change_history:
- version: '0.1'
  change: 'Erstfassung: 40 Testfälle TC-001 bis TC-040, davon 4 manuell adjudizierte Referenzfälle (Golden Cases TC-036 bis TC-039). T01 bis T15 nach Zweck zu TC-001 bis TC-006 gebündelt; identische Szenarien (T08/T14, T11/T12) als Varianten dokumentiert.'
- version: '0.2'
  change: 'TC-041 ergänzt: aktive Prüfung des Blocks SRC009_EIFU_ADDITIONAL und Nachweis der designbedingten Unerreichbarkeit von SRC009_ART3_1_PATH. Bindung an DATA_MODEL 0.5 (rr_measure_version im CatalogVersionSet).'
- version: '0.3'
  change: 'Demonstrator D1 (Assessment-/Gap-Kern): TC-042 bis TC-046 mit neuer Kategorie K (Gap-Analyse / Erfüllungsstatus); TC-036 bis TC-039 zusätzlich über den Assessment-Kern automatisiert, Gap-Soll ohne Antworten aus den bestehenden Referenz-Sollwerten und der dokumentierten Ableitungstabelle abgeleitet (keine Soll-Werte geändert). Bindung an SR_CATALOG 0.4 und DATA_MODEL 0.6.'
- version: '0.4'
  change: 'Demonstrator D2 (Persistenz, Versionsabgleich, Revisionen, Audit): TC-047 bis TC-050; TC-043 um den Lebenszyklus von Nachweisreferenzen erweitert; TC-044 an die Bestätigungspflicht wieder anwendbarer Bewertungen angepasst (Audit-Prüfung nach TC-049 verlagert). Bindung an DATA_MODEL 0.7 und SR_CATALOG 0.5. Keine Soll-Werte der Referenzfälle geändert.'
- version: '0.5'
  change: 'Demonstrator D3 (Reporting, PDF, zentrale Sprachausgabe): Kategorie L (Bericht / Sprachausgabe), TC-051 bis TC-054. Bindung an DATA_MODEL 0.8. Keine Soll-Werte der Referenzfälle geändert.'
- version: '0.6'
  change: 'Demonstrator D4 (Web-Anwendung): Kategorie M (Web-Anwendung / Oberfläche und API); Abnahmeszenarien TC-055 bis TC-060 mit Browser-Ende-zu-Ende-Tests (web/e2e) und den zugehörigen Tests der Anwendungs-API. Bindung an SR_CATALOG 0.6. Keine Soll-Werte der Referenzfälle geändert.'
- version: '0.7'
  change: 'Block 6 (Fallstudie und Evaluation): TC-061 Evaluation der Fallstudie gegen die eingefrorene Referenz; TC-054 um den Regressionstest der Nachweisreihenfolge (Befund F-2) ergänzt. Keine Soll-Werte der Referenzfälle geändert.'
- version: '0.8'
  change: 'Bindung an RR_MEASURE_CATALOG 0.2 (Impact-Prüfung): TC-035 prüft weiterhin den Mapping-Status aller RR, jetzt 959 MAPPED mit Mapping-Basis, Zuordnungsregel und Begründung; der fail-closed-Pfad REVIEW_REQUIRED wird über eine Testfixture geprüft. TC-061 führt die Fallstudie unverändert gegen den evaluierten Maßnahmenkatalog 0.1 aus (eingefrorene Fassung, SHA-256 geprüft). Keine Soll-Werte geändert, kein TC neu.'
- version: '0.9'
  change: 'TC-062 ergänzt: gezielte Korrektur der Anhang-III-Übergangslücke. Bindung an RUL 0.3 und RR_APPLICABILITY 0.5; bestehende TC-001 bis TC-061 und alle Golden-Case-Sollwerte unverändert. TC-061 verwendet die hashgebundenen historischen Fassungen RUL 0.2, RR_APPLICABILITY 0.4 und RR_MEASURE 0.1.'
