change_history:
  - version: "0.1"
    change: "Erstfassung: 15 generische Maßnahmen mit 15 Nachweisarten; alle 959 RR mit Mapping-Status (457 MAPPED, 502 REVIEW_REQUIRED). Keine RR geändert."
  - version: "0.2"
    change: "Post-Evaluation-Fortschreibung der Traceability (Schließung B-1 des Thesis-Audits): alle 502 REVIEW_REQUIRED-RR fachlich adjudiziert (16 Zuordnungsregeln ADJ-*, Methode RR_MEASURE_METHOD.md); je RR Mapping-Basis (SOURCE_EXPLICIT/PROJECT_DERIVED), Wortlautanker, Zuordnungsregel und Begründung; 457 TRIGGER-Zuordnungen unverändert, Mapping-Basis aus dem Wortlaut abgeleitet; zwei neue Maßnahmen und Nachweisarten (Daten-Governance, menschliche Aufsicht); Beschreibung von EVT_LABELLING_AND_INSTRUCTIONS und EVT_REVIEW_RECORD sowie Bezeichnung von MEAS_REVIEW präzisiert. Ergebnis: 959 MAPPED, 0 REVIEW_REQUIRED. Keine RR geändert; Evaluation R1/R2 bleibt an Version 0.1 gebunden."
