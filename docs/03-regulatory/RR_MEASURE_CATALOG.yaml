version: "0.2"
rr_catalog_version: "0.26"
description: "Katalog vorgesehener Umsetzungsmaßnahmen und Nachweisarten je RR (SR-043, Katalogart RR_MEASURE). Generische, wiederverwendbare Maßnahmen; jede RR hat genau eine primäre Zuordnung mit Mapping-Basis (SOURCE_EXPLICIT oder PROJECT_DERIVED), Wortlautanker aus dem deutschen Anforderungstext, Zuordnungsregel und Begründung. TRIGGER-Zuordnungen sind aus den trigger_pattern reproduzierbar (seit 0.1); ADJ-Zuordnungen sind fachlich adjudiziert (seit 0.2, Methode: RR_MEASURE_METHOD.md). PROJECT_DERIVED bezeichnet eine projektseitig vorgesehene Maßnahme bzw. Nachweisform, keine rechtlich oder normativ vorgeschriebene Dokumentpflicht. Nachweisarten sind vorgesehene Nachweise, keine Projektevidenz (EV). Die Evaluation R1/R2 ist an Version 0.1 gebunden (eingefroren unter docs/08-evaluation/frozen/)."
mapping_bases:
  SOURCE_EXPLICIT:
    label:
      de: "Quellenseitig explizit"
      en: "Source-explicit"
    description:
      de: "Der Anforderungstext benennt das Nachweisartefakt ausdrücklich (Dokument, Aufzeichnung, Plan, Bericht, Spezifikation, Verfahren in dokumentierter Form oder bereitzustellende Herstellerinformation)."
      en: "The requirement text explicitly names the evidence artefact (document, record, plan, report, specification, documented procedure or information to be supplied by the manufacturer)."
  PROJECT_DERIVED:
    label:
      de: "Projektseitig abgeleitet"
      en: "Project-derived"
    description:
      de: "Die Quelle fordert einen Zustand, eine Eigenschaft, einen Prozess oder eine Tätigkeit, schreibt aber kein bestimmtes Nachweisdokument vor; RegScoutX sieht dafür eine geeignete Maßnahme und Nachweisform vor. Keine rechtlich oder normativ vorgeschriebene Dokumentpflicht."
      en: "The source requires a state, property, process or activity but does not prescribe a specific evidence document; RegScoutX assigns a suitable measure and evidence form. Not a legally or normatively required document."
explicit_evidence_terms: "\\w*[Aa]kte\\b|\\bFile\\b|\\w*[Dd]okumentation\\b|\\w*[Dd]okumente?\\b|\\w*[Aa]ufzeichnung(?:en)?\\b|\\w*aufzeichnungen\\b|aufzeichn\\w*|dokumentier\\w*|aufbewahr\\w*|aufzubewahren|archivier\\w*|schriftlich\\w*|\\b[\\w-]*[Pp]lan(?:s|es)?\\b|\\b[\\w-]*[Pp]läne\\b|\\w*[Bb]ericht\\w*|\\w*[Ss]pezifikation\\w*|Specification|\\w*[Pp]rotokoll\\w*|\\bNachweis\\b|\\w*[Vv]ereinbarung\\w*|\\bAngaben\\b|\\w*[Ii]nformationen\\b|Zugangsinformation\\w*|\\bHinweis\\b|Kennzeichnung|Gebrauchsanweisung\\w*|Etikett\\w*|\\bIFU\\b|\\beIFU\\b|Betriebsanleitung\\w*|\\bPSUR\\b|Symbol\\w*|\\w*[Pp]olitik\\b|Historie|Anweisungen"
adjudication_rules:
  ADJ-RM:
    measure: "MEAS_RISK_MANAGEMENT_FILE"
    label:
      de: "Risikomanagement"
      en: "Risk management"
    description:
      de: "Tätigkeit oder Ergebnis des Risikomanagements (Ermittlung, Analyse, Einschätzung, Bewertung, Beherrschung, Restrisiko, Aktualisierung, Einrichtung des Systems)."
      en: "Risk management activity or result (identification, analysis, estimation, evaluation, control, residual risk, update, establishing the system)."
  ADJ-PLAN:
    measure: "MEAS_PLAN"
    label:
      de: "Planung"
      en: "Planning"
    description:
      de: "Die Quelle verlangt Planung bzw. die geplante Ausgestaltung eines Prozesses."
      en: "The source requires planning or the planned design of a process."
  ADJ-REVIEW:
    measure: "MEAS_REVIEW"
    label:
      de: "Review, Bewertung bzw. Freigabe"
      en: "Review, evaluation or approval"
    description:
      de: "Die Quelle verlangt eine Überprüfung, Bewertung der Angemessenheit, Genehmigung oder Freigabe."
      en: "The source requires a review, adequacy evaluation, approval or release."
  ADJ-VERIF:
    measure: "MEAS_VERIFICATION"
    label:
      de: "Nachzuweisende Eigenschaft bzw. Prüfung"
      en: "Property to be demonstrated or testing"
    description:
      de: "Die Quelle verlangt eine nachzuweisende Produkteigenschaft (z. B. Genauigkeit, Robustheit, Zuverlässigkeit) oder eine Prüf-/Verifizierungstätigkeit."
      en: "The source requires a product property to be demonstrated (e.g. accuracy, robustness, reliability) or a test/verification activity."
  ADJ-VALID:
    measure: "MEAS_VALIDATION"
    label:
      de: "Validierung"
      en: "Validation"
    description:
      de: "Die Quelle verlangt eine Validierung bzw. deren Festlegung."
      en: "The source requires validation or its determination."
  ADJ-DATA:
    measure: "MEAS_DATA_GOVERNANCE"
    label:
      de: "Daten-Governance"
      en: "Data governance"
    description:
      de: "Anforderung an Daten-Governance, Datenverwaltungsverfahren oder Eigenschaften von Trainings-, Validierungs- und Testdatensätzen."
      en: "Requirement on data governance, data management procedures or properties of training, validation and test data sets."
  ADJ-HO:
    measure: "MEAS_HUMAN_OVERSIGHT"
    label:
      de: "Menschliche Aufsicht"
      en: "Human oversight"
    description:
      de: "Anforderung an Gestaltung und Bereitstellung der menschlichen Aufsicht."
      en: "Requirement on the design and provision of human oversight."
  ADJ-DESIGN:
    measure: "MEAS_TECHNICAL_DOCUMENTATION"
    label:
      de: "Auslegungs- und Entwicklungsergebnis"
      en: "Design and development output"
    description:
      de: "Die Quelle verlangt ein Auslegungs- bzw. Entwicklungsergebnis oder ein Produktmerkmal (z. B. Softwareanforderungen, Architektur, Sicherheitsklasse, technische Schutzmaßnahme)."
      en: "The source requires a design or development output or a product feature (e.g. software requirements, architecture, safety class, technical safeguard)."
  ADJ-INFO:
    measure: "MEAS_LABELLING_AND_INSTRUCTIONS"
    label:
      de: "Herstellerinformation"
      en: "Information supplied by the manufacturer"
    description:
      de: "Die Quelle verlangt vom Hersteller bereitzustellende Informationen (Kennzeichnung, Gebrauchsanweisung, Website, Zugangsinformation) bzw. die Information der Anwender."
      en: "The source requires information to be supplied by the manufacturer (labelling, instructions for use, website, access information) or informing users."
  ADJ-UE:
    measure: "MEAS_USABILITY_ENGINEERING_FILE"
    label:
      de: "Usability Engineering"
      en: "Usability engineering"
    description:
      de: "Tätigkeit oder Ergebnis des Usability-Engineering-Prozesses bzw. gebrauchstauglichkeitsbezogene Auslegung."
      en: "Usability engineering activity or result, or usability-related design."
  ADJ-QMS:
    measure: "MEAS_DOCUMENTED_PROCEDURE"
    label:
      de: "QMS-Prozess bzw. -Verfahren"
      en: "QMS process or procedure"
    description:
      de: "Die Quelle verlangt einen Prozess, ein Verfahren oder einen Bestandteil des Qualitätsmanagementsystems."
      en: "The source requires a process, procedure or element of the quality management system."
  ADJ-PMS:
    measure: "MEAS_PMS_VIGILANCE"
    label:
      de: "Überwachung nach dem Inverkehrbringen bzw. Rückmeldungen"
      en: "Post-market surveillance or feedback"
    description:
      de: "Tätigkeit der Überwachung nach dem Inverkehrbringen bzw. der Rückmeldungsbearbeitung einschließlich Meldungen."
      en: "Post-market surveillance or feedback activity including notifications."
  ADJ-CHANGE:
    measure: "MEAS_CHANGE_CONTROL"
    label:
      de: "Änderungslenkung"
      en: "Change control"
    description:
      de: "Die Quelle verlangt die Lenkung, Bewertung, Genehmigung oder Umsetzung von Änderungen bzw. Konfigurationskontrolle."
      en: "The source requires control, evaluation, approval or implementation of changes or configuration control."
  ADJ-COMP:
    measure: "MEAS_COMPETENCE"
    label:
      de: "Kompetenz"
      en: "Competence"
    description:
      de: "Die Quelle verlangt Kompetenz, Wissen oder deren Aufzeichnung."
      en: "The source requires competence, knowledge or its record."
  ADJ-RECORD:
    measure: "MEAS_RECORD"
    label:
      de: "Aufzeichnung des geforderten Ergebnisses"
      en: "Record of the required result"
    description:
      de: "Die Quelle verlangt ein Ergebnis, eine Festlegung, Mitteilung oder Behandlung, deren Nachweis als gelenkte Aufzeichnung geführt wird (z. B. Lieferantenbewertung, Nichtkonformität, Korrekturmaßnahme, Benachrichtigung)."
      en: "The source requires a result, determination, notification or handling evidenced by a controlled record (e.g. supplier evaluation, nonconformity, corrective action, notification)."
  ADJ-REPORT:
    measure: "MEAS_REPORT"
    label:
      de: "Bericht"
      en: "Report"
    description:
      de: "Die Quelle verlangt einen Bericht bzw. die Aktualisierung eines berichtsförmigen Ergebnisses (z. B. klinische Bewertung, Problembericht)."
      en: "The source requires a report or the update of a report-type result (e.g. clinical evaluation, problem report)."
evidence_types:
  EVT_RISK_MANAGEMENT_FILE:
    label:
      de: "Risikomanagementakte"
      en: "Risk management file"
    description:
      de: "Eintrag bzw. Dokument in der Risikomanagementakte des Produkts."
      en: "Entry or document in the risk management file of the device."
  EVT_USABILITY_ENGINEERING_FILE:
    label:
      de: "Usability Engineering File"
      en: "Usability engineering file"
    description:
      de: "Eintrag bzw. Dokument im Usability Engineering File."
      en: "Entry or document in the usability engineering file."
  EVT_TECHNICAL_DOCUMENTATION:
    label:
      de: "Technische Dokumentation"
      en: "Technical documentation"
    description:
      de: "Bestandteil der technischen Dokumentation bzw. einer Produkt- oder Entwicklungsakte."
      en: "Part of the technical documentation or of a device or design file."
  EVT_LABELLING_AND_INSTRUCTIONS:
    label:
      de: "Kennzeichnung und Gebrauchsanweisung"
      en: "Labelling and instructions for use"
    description:
      de: "Inhalt der Kennzeichnung, Gebrauchs- oder Betriebsanleitung bzw. elektronischen Gebrauchsanweisung sowie weiterer vom Hersteller bereitgestellter Produktinformationen (z. B. Website, Zugangsinformation)."
      en: "Content of the labelling, instructions for use or electronic instructions for use and of further product information supplied by the manufacturer (e.g. website, access information)."
  EVT_PLAN:
    label:
      de: "Plan"
      en: "Plan"
    description:
      de: "Gelenkter Plan (z. B. Entwicklungs-, Risikomanagement-, Überwachungs- oder Evaluationsplan)."
      en: "Controlled plan (e.g. development, risk management, surveillance or evaluation plan)."
  EVT_REPORT:
    label:
      de: "Bericht"
      en: "Report"
    description:
      de: "Gelenkter Bericht (z. B. PMS-Bericht, PSUR, Problem- oder Risikomanagementbericht)."
      en: "Controlled report (e.g. PMS report, PSUR, problem or risk management report)."
  EVT_AUDIT_RECORD:
    label:
      de: "Auditnachweis"
      en: "Audit record"
    description:
      de: "Auditprogramm, Auditbericht bzw. Auditaufzeichnung."
      en: "Audit programme, audit report or audit record."
  EVT_REVIEW_RECORD:
    label:
      de: "Review-Protokoll"
      en: "Review record"
    description:
      de: "Aufzeichnung eines Reviews, einer Bewertung der Angemessenheit, einer Genehmigung bzw. Freigabe oder einer Managementbewertung."
      en: "Record of a review, adequacy evaluation, approval or release, or management review."
  EVT_VALIDATION_RECORD:
    label:
      de: "Validierungsnachweis"
      en: "Validation record"
    description:
      de: "Validierungsplan, -protokoll bzw. -bericht mit Ergebnis."
      en: "Validation plan, protocol or report with result."
  EVT_VERIFICATION_RECORD:
    label:
      de: "Verifizierungs- bzw. Prüfnachweis"
      en: "Verification or test record"
    description:
      de: "Verifizierungs- bzw. Prüfaufzeichnung mit Ergebnis."
      en: "Verification or test record with result."
  EVT_COMPETENCE_RECORD:
    label:
      de: "Kompetenz- bzw. Schulungsnachweis"
      en: "Competence or training record"
    description:
      de: "Nachweis über Qualifikation, Schulung oder Kompetenz."
      en: "Record of qualification, training or competence."
  EVT_PMS_VIGILANCE_RECORD:
    label:
      de: "PMS- bzw. Vigilanznachweis"
      en: "PMS or vigilance record"
    description:
      de: "Aufzeichnung aus Überwachung nach dem Inverkehrbringen, Vorkommnis- bzw. Reklamationsbearbeitung."
      en: "Record from post-market surveillance, incident or complaint handling."
  EVT_CHANGE_RECORD:
    label:
      de: "Änderungsnachweis"
      en: "Change record"
    description:
      de: "Änderungsanforderung mit Bewertung, Genehmigung und Umsetzungsnachweis."
      en: "Change request with evaluation, approval and implementation record."
  EVT_DOCUMENTED_PROCEDURE:
    label:
      de: "Dokumentiertes Verfahren"
      en: "Documented procedure"
    description:
      de: "Gelenkte Verfahrensanweisung bzw. Prozessbeschreibung."
      en: "Controlled procedure or process description."
  EVT_RECORD:
    label:
      de: "Aufzeichnung"
      en: "Record"
    description:
      de: "Gelenkte Aufzeichnung bzw. Dokumentation des geforderten Ergebnisses."
      en: "Controlled record or documentation of the required result."
  EVT_DATA_GOVERNANCE_RECORD:
    label:
      de: "Daten-Governance-Dokumentation"
      en: "Data governance documentation"
    description:
      de: "Beschreibung und Nachweis der Daten-Governance und der Trainings-, Validierungs- und Testdatensätze (z. B. Herkunft, Erhebung, Aufbereitung, Annahmen, Eignung, Untersuchung auf Verzerrungen)."
      en: "Description and evidence of data governance and of the training, validation and test data sets (e.g. provenance, collection, preparation, assumptions, suitability, examination for bias)."
  EVT_HUMAN_OVERSIGHT_SPECIFICATION:
    label:
      de: "Spezifikation der menschlichen Aufsicht"
      en: "Human oversight specification"
    description:
      de: "Beschreibung der vom Anbieter bestimmten Aufsichtsmaßnahmen (eingebaute Vorkehrungen, Vorkehrungen für den Betreiber, Mensch-Maschine-Schnittstelle) mit Nachweis ihrer Umsetzung."
      en: "Description of the oversight measures determined by the provider (built-in arrangements, arrangements for the deployer, human-machine interface) with evidence of their implementation."
measures:
  MEAS_RISK_MANAGEMENT_FILE:
    label:
      de: "In der Risikomanagementakte dokumentieren"
      en: "Document in the risk management file"
    evidence_types: ["EVT_RISK_MANAGEMENT_FILE"]
    trigger_pattern: "Risikomanagementakte|RM-Akte"
  MEAS_USABILITY_ENGINEERING_FILE:
    label:
      de: "Im Usability Engineering File dokumentieren"
      en: "Document in the usability engineering file"
    evidence_types: ["EVT_USABILITY_ENGINEERING_FILE"]
    trigger_pattern: "Usability Engineering File|UE File|UE-File"
  MEAS_TECHNICAL_DOCUMENTATION:
    label:
      de: "In die technische Dokumentation aufnehmen"
      en: "Include in the technical documentation"
    evidence_types: ["EVT_TECHNICAL_DOCUMENTATION"]
    trigger_pattern: "technische[nr]? Dokumentation|Medizinproduktakte|Entwicklungsakte"
  MEAS_LABELLING_AND_INSTRUCTIONS:
    label:
      de: "Kennzeichnung bzw. Gebrauchsanweisung entsprechend gestalten"
      en: "Design labelling or instructions for use accordingly"
    evidence_types: ["EVT_LABELLING_AND_INSTRUCTIONS"]
    trigger_pattern: "Gebrauchsanweisung\\w*|Kennzeichnung|Etikett\\w*|\\bIFU\\b|\\beIFU\\b|Betriebsanleitung\\w*"
  MEAS_REPORT:
    label:
      de: "Bericht erstellen und aktualisieren"
      en: "Prepare and update report"
    evidence_types: ["EVT_REPORT"]
    trigger_pattern: "\\bPMS-Bericht\\w*|\\bPSUR\\b|\\bSicherheitsbericht\\w*|\\bProblembericht\\w*|\\bRisikomanagementbericht\\w*|\\bBericht(?:e|s|es)?\\b"
  MEAS_PLAN:
    label:
      de: "Plan erstellen und pflegen"
      en: "Establish and maintain plan"
    evidence_types: ["EVT_PLAN"]
    trigger_pattern: "(?<!gemäß )\\b[\\w-]*[Pp]lan(?:s|es)?\\b(?!-Kriterien)|\\b[\\w-]*[Pp]läne\\b"
  MEAS_AUDIT:
    label:
      de: "Audit planen und durchführen"
      en: "Plan and conduct audit"
    evidence_types: ["EVT_AUDIT_RECORD"]
    trigger_pattern: "\\b[\\w-]*[Aa]udit\\w*"
  MEAS_REVIEW:
    label:
      de: "Review, Bewertung bzw. Freigabe durchführen und aufzeichnen"
      en: "Conduct and record review, evaluation or approval"
    evidence_types: ["EVT_REVIEW_RECORD"]
    trigger_pattern: "\\bReviews?\\b|Managementbewertung\\w*|Leitungsüberprüfung\\w*|Entwicklungsbewertung\\w*"
  MEAS_VALIDATION:
    label:
      de: "Validierung durchführen und aufzeichnen"
      en: "Perform and record validation"
    evidence_types: ["EVT_VALIDATION_RECORD"]
    trigger_pattern: "\\b(?:re)?validier(?:en|t)\\b|\\bValidierung(?:en)?\\b"
  MEAS_VERIFICATION:
    label:
      de: "Verifizierung bzw. Prüfung durchführen und aufzeichnen"
      en: "Perform and record verification or testing"
    evidence_types: ["EVT_VERIFICATION_RECORD"]
    trigger_pattern: "\\bverifizier(?:en|t)\\b|(?<!Implementierung/)\\bVerifizierung(?:en)?\\b|\\bVerifikation\\b|\\b\\w*[Pp]rüfungen\\b|\\bprüfen\\b|\\btesten\\b"
  MEAS_COMPETENCE:
    label:
      de: "Kompetenz bzw. Schulung sicherstellen und nachweisen"
      en: "Ensure and demonstrate competence or training"
    evidence_types: ["EVT_COMPETENCE_RECORD"]
    trigger_pattern: "(?<!angemessener )\\bSchulung(?:en)?\\b|\\bKompetenz(?:en)?\\b|\\bqualifiziert sein\\b|\\bgeschult\\b"
  MEAS_PMS_VIGILANCE:
    label:
      de: "PMS- bzw. Vigilanztätigkeit durchführen und aufzeichnen"
      en: "Perform and record PMS or vigilance activity"
    evidence_types: ["EVT_PMS_VIGILANCE_RECORD"]
    trigger_pattern: "Überwachung nach dem Inverkehrbringen|Beobachtung nach dem Inverkehrbringen|\\bVorkommnis\\w*|schwerwiegende[nr]? Vorf[aä]ll\\w*|\\bReklamation\\w*|Sicherheitskorrekturmaßnahme\\w*"
  MEAS_CHANGE_CONTROL:
    label:
      de: "Änderung über Änderungsanforderung lenken"
      en: "Control change through change request"
    evidence_types: ["EVT_CHANGE_RECORD"]
    trigger_pattern: "\\bÄnderungsanforderung\\w*"
  MEAS_DOCUMENTED_PROCEDURE:
    label:
      de: "Verfahren festlegen und dokumentieren"
      en: "Establish and document procedure"
    evidence_types: ["EVT_DOCUMENTED_PROCEDURE"]
    trigger_pattern: "\\b(?:dokumentierte[nsm]?|schriftliche[nsm]?) Verfahren\\b|\\bVerfahren\\b[^.;]*\\b(?:dokumentieren|festlegen|einrichten|aufrechterhalten)\\b"
  MEAS_RECORD:
    label:
      de: "Ergebnis aufzeichnen"
      en: "Record result"
    evidence_types: ["EVT_RECORD"]
    trigger_pattern: "\\baufzeichnen\\b|\\bAufzeichnungen\\b|\\bdokumentieren\\b|\\bdokumentiert\\b|\\baufbewahren\\b|\\baufzubewahren\\b"
  MEAS_DATA_GOVERNANCE:
    label:
      de: "Daten-Governance festlegen und dokumentieren"
      en: "Establish and document data governance"
    evidence_types: ["EVT_DATA_GOVERNANCE_RECORD"]
    trigger_pattern: null
  MEAS_HUMAN_OVERSIGHT:
    label:
      de: "Maßnahmen der menschlichen Aufsicht festlegen und umsetzen"
      en: "Define and implement human oversight measures"
    evidence_types: ["EVT_HUMAN_OVERSIGHT_SPECIFICATION"]
    trigger_pattern: null
requirements:
  RR-001:
    status: "MAPPED"
    measures: ["MEAS_TECHNICAL_DOCUMENTATION"]
    basis: "so konzipiert und entwickelt"
    mapping_basis: "PROJECT_DERIVED"
    mapping_rule: "ADJ-DESIGN"
    rationale: "ADJ-DESIGN Auslegungs- und Entwicklungsergebnis: Die Quelle fordert „so konzipiert und entwickelt“, schreibt aber kein bestimmtes Nachweisdokument vor; projektseitig vorgesehen: In die technische Dokumentation aufnehmen (vorgesehener Nachweis, keine Dokumentpflicht aus der Quelle). Bezug: „Transparenz zur Interpretation und angemessenen Verwendung von Systemausgaben“."
  RR-002:
    status: "MAPPED"
    measures: ["MEAS_TECHNICAL_DOCUMENTATION"]
    basis: "Transparenz auf eine geeignete Art"
    mapping_basis: "PROJECT_DERIVED"
    mapping_rule: "ADJ-DESIGN"
    rationale: "ADJ-DESIGN Auslegungs- und Entwicklungsergebnis: Die Quelle fordert „Transparenz auf eine geeignete Art“, schreibt aber kein bestimmtes Nachweisdokument vor; projektseitig vorgesehen: In die technische Dokumentation aufnehmen (vorgesehener Nachweis, keine Dokumentpflicht aus der Quelle). Bezug: „Angemessene Art und angemessenes Maß der Transparenz“."
  RR-003:
    status: "MAPPED"
    measures: ["MEAS_DATA_GOVERNANCE"]
    basis: "Daten-Governance- und Datenverwaltungsverfahren"
    mapping_basis: "PROJECT_DERIVED"
    mapping_rule: "ADJ-DATA"
    rationale: "ADJ-DATA Daten-Governance: Die Quelle fordert „Daten-Governance- und Datenverwaltungsverfahren“, schreibt aber kein bestimmtes Nachweisdokument vor; projektseitig vorgesehen: Daten-Governance festlegen und dokumentieren (vorgesehener Nachweis, keine Dokumentpflicht aus der Quelle). Bezug: „Untersuchung möglicher Verzerrungen in Datensätzen“."
  RR-004:
    status: "MAPPED"
    measures: ["MEAS_DATA_GOVERNANCE"]
    basis: "Daten-Governance- und Datenverwaltungsverfahren"
    mapping_basis: "PROJECT_DERIVED"
    mapping_rule: "ADJ-DATA"
    rationale: "ADJ-DATA Daten-Governance: Die Quelle fordert „Daten-Governance- und Datenverwaltungsverfahren“, schreibt aber kein bestimmtes Nachweisdokument vor; projektseitig vorgesehen: Daten-Governance festlegen und dokumentieren (vorgesehener Nachweis, keine Dokumentpflicht aus der Quelle). Bezug: „Maßnahmen zur Erkennung möglicher Verzerrungen“."
  RR-005:
    status: "MAPPED"
    measures: ["MEAS_DATA_GOVERNANCE"]
    basis: "Daten-Governance- und Datenverwaltungsverfahren"
    mapping_basis: "PROJECT_DERIVED"
    mapping_rule: "ADJ-DATA"
    rationale: "ADJ-DATA Daten-Governance: Die Quelle fordert „Daten-Governance- und Datenverwaltungsverfahren“, schreibt aber kein bestimmtes Nachweisdokument vor; projektseitig vorgesehen: Daten-Governance festlegen und dokumentieren (vorgesehener Nachweis, keine Dokumentpflicht aus der Quelle). Bezug: „Maßnahmen zur Verhinderung möglicher Verzerrungen“."
  RR-006:
    status: "MAPPED"
    measures: ["MEAS_DATA_GOVERNANCE"]
    basis: "Daten-Governance- und Datenverwaltungsverfahren"
