    status: "aktiv"
    title:
      de: "Methoden zur Prüfung von Beschwerden"
      en: "Methods for Investigation of Complaints"
    requirement_text:
      de: "Der PMS-Plan muss wirksame und geeignete Methoden und Instrumente zur Prüfung von Beschwerden vorsehen."
