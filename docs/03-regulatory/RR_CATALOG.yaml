      en: "PMS Plan for Non-Serious Incidents and Undesirable Side-Effects"
    requirement_text:
      de: "Der PMS-Plan muss die Erhebung und Verwendung von Aufzeichnungen über nicht schwerwiegende Vorkommnisse und Daten zu etwaigen unerwünschten Nebenwirkungen abdecken."
      en: "The PMS plan shall address the collection and utilisation of records concerning non-serious incidents and data on any undesirable side-effects."
    sources:
