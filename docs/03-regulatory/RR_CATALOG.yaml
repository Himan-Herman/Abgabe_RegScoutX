  - id: "RR-044"
    status: "aktiv"
    title:
      de: "Geeignete statistische Eigenschaften der Datensätze"
      en: "Appropriate Statistical Properties of Data Sets"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass Trainings-, Validierungs- und Testdatensätze geeignete statistische Merkmale aufweisen, gegebenenfalls auch bezüglich der Personen oder Personengruppen, für die das Hochrisiko-KI-System bestimmungsgemäß verwendet werden soll. Diese Merkmale können auf Ebene einzelner Datensätze oder einer Kombination von Datensätzen erfüllt werden. Bei Hochrisiko-KI-Systemen ohne Techniken zum Training von KI-Modellen gilt diese Anforderung ausschließlich für Testdatensätze."
      en: "The provider shall ensure that training, validation and testing data sets have appropriate statistical properties, including, where applicable, as regards the persons or groups of persons in relation to whom the high-risk AI system is intended to be used. Those properties may be satisfied at the level of individual data sets or a combination of data sets. For high-risk AI systems not using techniques involving the training of AI models, the requirement applies only to testing data sets."
    sources:
      primary:
        - "SRC-002#Art.10/Abs.3/Satz.2"
      supplementary:
        - "SRC-002#Art.10/Abs.3/Satz.3"
