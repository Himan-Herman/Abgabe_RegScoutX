    title:
      de: "Methoden zur Bewertung erhobener PMS-Daten"
      en: "Methods for Assessment of Collected PMS Data"
    requirement_text:
      de: "Der PMS-Plan muss wirksame und geeignete Methoden und Prozesse zur Bewertung der erhobenen PMS-Daten festlegen."
      en: "The PMS plan shall specify effective and appropriate methods and processes for assessing the collected PMS data."
