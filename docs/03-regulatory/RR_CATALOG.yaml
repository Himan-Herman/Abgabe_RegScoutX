    title:
      de: "PMS-System auf Grundlage eines PMS-Plans"
      en: "PMS System Based on a PMS Plan"
    requirement_text:
      de: "Der Hersteller muss sicherstellen, dass das PMS-System nach Artikel 83 auf einem Plan zur Überwachung nach dem Inverkehrbringen beruht."
      en: "The manufacturer shall ensure that the post-market surveillance system referred to in Article 83 is based on a post-market surveillance plan."
    sources:
      primary:
        - "SRC-001#Art.84/Satz.1"
      supplementary: []
    theme_cluster: "Post-Market-Monitoring"
    lifecycle_phases:
      - "Planung und Konzeption"
    uncertainty: null
    replaces: []
