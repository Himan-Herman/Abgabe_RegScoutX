version: "0.26"

requirements:
  - id: "RR-001"
    status: "aktiv"
    title:
      de: "Transparenz zur Interpretation und angemessenen Verwendung von Systemausgaben"
      en: "Transparency for Interpretation and Appropriate Use of System Outputs"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass ein Hochrisiko-KI-System so konzipiert und entwickelt wird, dass sein Betrieb hinreichend transparent ist, damit Betreiber die Ausgaben des Systems angemessen interpretieren und verwenden können."
      en: "The provider shall ensure that a high-risk AI system is designed and developed so that its operation is sufficiently transparent to enable deployers to appropriately interpret and use the system's outputs."
    sources:
      primary:
        - "SRC-002#Art.13/Abs.1/Satz.1"
      supplementary:
        - "SRC-002#Art.16/Buchst.a"
    theme_cluster: "Transparenz"
    lifecycle_phases:
      - "Entwicklung und Realisierung"
    uncertainty: null
    replaces: []
    replaced_by: []

  - id: "RR-002"
    status: "aktiv"
    title:
      de: "Angemessene Art und angemessenes Maß der Transparenz"
      en: "Appropriate Type and Degree of Transparency"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass bei einem Hochrisiko-KI-System Transparenz auf eine geeignete Art und in einem angemessenen Maß gewährleistet wird, damit die einschlägigen Pflichten des Anbieters und des Betreibers nach Abschnitt 3 erfüllt werden können."
      en: "The provider shall ensure that an appropriate type and degree of transparency are provided for a high-risk AI system so that the relevant obligations of the provider and deployer under Section 3 can be fulfilled."
    sources:
      primary:
        - "SRC-002#Art.13/Abs.1/Satz.2"
      supplementary:
        - "SRC-002#Art.16/Buchst.a"
    theme_cluster: "Transparenz"
    lifecycle_phases:
      - "Entwicklung und Realisierung"
    uncertainty: null
    replaces: []
    replaced_by: []

  - id: "RR-003"
    status: "aktiv"
    title:
      de: "Untersuchung möglicher Verzerrungen in Datensätzen"
      en: "Examination of Potential Biases in Data Sets"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass die für die Zweckbestimmung geeigneten Daten-Governance- und Datenverwaltungsverfahren für Trainings-, Validierungs- und Testdatensätze eine Untersuchung möglicher Verzerrungen umfassen, die die Gesundheit und Sicherheit von Personen beeinträchtigen, sich negativ auf Grundrechte auswirken oder zu unionsrechtlich verbotener Diskriminierung führen könnten, insbesondere wenn Datenausgaben Eingaben für künftige Operationen beeinflussen. Bei der Entwicklung von Hochrisiko-KI-Systemen, in denen keine Techniken eingesetzt werden, bei denen KI-Modelle trainiert werden, gilt diese Anforderung ausschließlich für Testdatensätze."
      en: "The provider shall ensure that the data governance and management practices appropriate for the intended purpose for training, validation and testing data sets include an examination of potential biases that could affect the health and safety of persons, negatively affect fundamental rights, or lead to discrimination prohibited under Union law, in particular where data outputs influence inputs for future operations. For the development of high-risk AI systems not using techniques involving the training of AI models, this requirement applies only to testing data sets."
    sources:
      primary:
        - "SRC-002#Art.10/Abs.2/Buchst.f"
      supplementary:
        - "SRC-002#Art.10/Abs.2/Satz.1"
        - "SRC-002#Art.10/Abs.2/Satz.2"
        - "SRC-002#Art.10/Abs.6"
        - "SRC-002#Art.16/Buchst.a"
    theme_cluster: "Data Governance"
    lifecycle_phases:
      - "Entwicklung und Realisierung"
      - "Verifikation und Validierung"
    uncertainty: null
    replaces: []
    replaced_by: []

  - id: "RR-004"
    status: "aktiv"
    title:
      de: "Maßnahmen zur Erkennung möglicher Verzerrungen"
      en: "Measures to Detect Potential Biases"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass die für die Zweckbestimmung geeigneten Daten-Governance- und Datenverwaltungsverfahren für Trainings-, Validierungs- und Testdatensätze geeignete Maßnahmen zur Erkennung der gemäß Art. 10 Abs. 2 Buchst. f ermittelten möglichen Verzerrungen umfassen. Bei der Entwicklung von Hochrisiko-KI-Systemen, in denen keine Techniken eingesetzt werden, bei denen KI-Modelle trainiert werden, gilt diese Anforderung ausschließlich für Testdatensätze."
      en: "The provider shall ensure that the data governance and management practices appropriate for the intended purpose for training, validation and testing data sets include appropriate measures to detect potential biases identified pursuant to Article 10(2), point (f). For the development of high-risk AI systems not using techniques involving the training of AI models, this requirement applies only to testing data sets."
    sources:
      primary:
        - "SRC-002#Art.10/Abs.2/Buchst.g"
      supplementary:
        - "SRC-002#Art.10/Abs.2/Satz.1"
        - "SRC-002#Art.10/Abs.2/Satz.2"
        - "SRC-002#Art.10/Abs.2/Buchst.f"
        - "SRC-002#Art.10/Abs.6"
        - "SRC-002#Art.16/Buchst.a"
    theme_cluster: "Data Governance"
    lifecycle_phases:
      - "Entwicklung und Realisierung"
      - "Verifikation und Validierung"
    uncertainty: null
    replaces: []
    replaced_by: []

