      en: "Freedom from Errors of Data Sets to the Best Extent Possible"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass Trainings-, Validierungs- und Testdatensätze im Hinblick auf die Zweckbestimmung so weit wie möglich fehlerfrei sind. Dieses Merkmal kann auf Ebene einzelner Datensätze oder einer Kombination von Datensätzen erfüllt werden. Bei Hochrisiko-KI-Systemen ohne Techniken zum Training von KI-Modellen gilt diese Anforderung ausschließlich für Testdatensätze."
      en: "The provider shall ensure that training, validation and testing data sets are, to the best extent possible, free of errors in view of the intended purpose. This characteristic may be satisfied at the level of individual data sets or a combination of data sets. For high-risk AI systems not using techniques involving the training of AI models, the requirement applies only to testing data sets."
    sources:
      primary:
        - "SRC-002#Art.10/Abs.3/Satz.1"
      supplementary:
        - "SRC-002#Art.10/Abs.3/Satz.3"
        - "SRC-002#Art.10/Abs.6"
        - "SRC-002#Art.16/Buchst.a"
