  - id: "RR-343"
    status: "aktiv"
    title:
      de: "Indikatoren und Schwellenwerte für kontinuierliche Neubewertung"
      en: "Indicators and Threshold Values for Continuous Reassessment"
    requirement_text:
      de: "Der PMS-Plan muss geeignete Indikatoren und Schwellenwerte festlegen, die für die kontinuierliche Neubewertung der Nutzen-Risiko-Analyse und des Risikomanagements nach Anhang I Abschnitt 3 verwendet werden."
      en: "The PMS plan shall specify suitable indicators and threshold values for the continuous reassessment of the benefit-risk analysis and risk management referred to in Section 3 of Annex I."
