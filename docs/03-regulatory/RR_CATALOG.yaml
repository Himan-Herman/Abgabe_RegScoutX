    status: "aktiv"
    title:
      de: "Bezugnahme auf Verfahren zur Erfüllung der PMS-Pflichten"
      en: "Reference to Procedures for Fulfilling PMS Obligations"
    requirement_text:
      de: "Der PMS-Plan muss auf die Verfahren zur Erfüllung der Herstellerpflichten nach den Artikeln 83 und 84 sowie, soweit für das Produkt einschlägig, Artikel 86 Bezug nehmen."
      en: "The PMS plan shall refer to the procedures for fulfilling the manufacturer's obligations under Articles 83 and 84 and, where applicable to the device, Article 86."
    sources:
      primary:
