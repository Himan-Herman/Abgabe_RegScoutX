  - id: "RR-040"
    status: "aktiv"
    title:
      de: "Relevanz der Datensätze"
      en: "Relevance of Data Sets"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass Trainings-, Validierungs- und Testdatensätze im Hinblick auf die Zweckbestimmung relevant sind. Dieses Merkmal kann auf Ebene einzelner Datensätze oder einer Kombination von Datensätzen erfüllt werden. Bei Hochrisiko-KI-Systemen ohne Techniken zum Training von KI-Modellen gilt diese Anforderung ausschließlich für Testdatensätze."
      en: "The provider shall ensure that training, validation and testing data sets are relevant in view of the intended purpose. This characteristic may be satisfied at the level of individual data sets or a combination of data sets. For high-risk AI systems not using techniques involving the training of AI models, the requirement applies only to testing data sets."
