      en: "Updating the Summary of Safety and Clinical Performance"
    requirement_text:
      de: "Soweit für das Produkt ein Kurzbericht über Sicherheit und klinische Leistung nach Artikel 32 erforderlich ist, muss der Hersteller PMS-Daten zu dessen Aktualisierung verwenden."
      en: "Where a summary of safety and clinical performance under Article 32 is required for the device, the manufacturer shall use PMS data to update that summary."
