    requirement_text:
      de: "Soweit relevant, muss der Hersteller die durch sein PMS-System gesammelten Daten als Beitrag zur Überwachung anderer Produkte nach dem Inverkehrbringen verwenden."
      en: "Where relevant, the manufacturer shall use data gathered through its PMS system to contribute to the post-market surveillance of other devices."
