    title:
      de: "Nachweis der Art.-83-Erfüllung im PMS-Plan"
      en: "Demonstration of Article 83 Compliance in the PMS Plan"
    requirement_text:
      de: "Der Hersteller muss im PMS-Plan nachweisen, dass er die Verpflichtungen nach Artikel 83 erfüllt."
      en: "The manufacturer shall demonstrate in the post-market surveillance plan that it complies with the obligations referred to in Article 83."
    sources:
      primary:
        - "SRC-001#Anh.III/Abschn.1"
      supplementary: []
    theme_cluster: "Post-Market-Monitoring"
