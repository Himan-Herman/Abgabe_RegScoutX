    title:
      de: "Instrumente zur Identifizierung korrekturmaßnahmenbedürftiger Produkte"
      en: "Tools for Identifying Devices Requiring Corrective Action"
    requirement_text:
      de: "Der PMS-Plan muss wirksame Instrumente vorsehen, mit denen Produkte ermittelt und identifiziert werden können, die gegebenenfalls Korrekturmaßnahmen erfordern."
      en: "The PMS plan shall provide effective tools for tracing and identifying devices that may require corrective action."
    sources:
