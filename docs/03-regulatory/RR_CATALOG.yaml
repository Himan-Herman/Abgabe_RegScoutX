      en: "PMS Plan as Part of the Technical Documentation"
    requirement_text:
      de: "Bei Produkten, die keine Sonderanfertigungen sind, muss der Hersteller sicherstellen, dass der PMS-Plan Bestandteil der technischen Dokumentation nach Anhang II ist."
      en: "For devices other than custom-made devices, the manufacturer shall ensure that the post-market surveillance plan forms part of the technical documentation specified in Annex II."
    sources:
      primary:
        - "SRC-001#Art.84/Satz.2"
      supplementary: []
    theme_cluster: "Post-Market-Monitoring"
    lifecycle_phases:
      - "Konformitätsbewertung"
    uncertainty: null
    replaces: []
