  - id: "RR-346"
    status: "aktiv"
    title:
      de: "Verfahren für trendmeldepflichtige Vorkommnisse"
      en: "Procedures for Incidents Subject to Trend Reporting"
    requirement_text:
      de: "Der PMS-Plan muss Methoden und Protokolle zur Behandlung der Vorkommnisse festlegen, die der Trendmeldung nach Artikel 88 unterliegen; hierzu gehören die Verfahren zur Feststellung statistisch signifikanter Anstiege und der maßgebliche Beobachtungszeitraum."
      en: "The PMS plan shall specify methods and protocols for managing incidents subject to trend reporting under Article 88, including methods for determining statistically significant increases and the applicable observation period."
