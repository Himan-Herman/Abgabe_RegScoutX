      en: "Corresponding Update of the Technical Documentation"
    requirement_text:
      de: "Der Hersteller muss die technische Dokumentation entsprechend den Ergebnissen und daraus folgenden Aktualisierungen des PMS auf dem aktuellen Stand halten."
      en: "The manufacturer shall update the technical documentation accordingly in light of the PMS results and resulting updates."
