  - id: "RR-073"
    status: "aktiv"
    title:
      de: "Zwei-Personen-Verifikation bei biometrischer Fernidentifizierung"
      en: "Two-Person Verification for Remote Biometric Identification"
    requirement_text:
      de: "Bei einem Hochrisiko-KI-System nach Anhang III Nummer 1 Buchstabe a muss der Anbieter sicherstellen, dass die Maßnahmen zur menschlichen Aufsicht so ausgestaltet sind, dass der Betreiber keine Handlung oder Entscheidung auf Grundlage des vom System hervorgebrachten Identifizierungsergebnisses trifft, solange diese Identifizierung nicht von mindestens zwei natürlichen Personen mit der erforderlichen Kompetenz, Ausbildung und Befugnis getrennt überprüft und bestätigt wurde; die Ausnahme nach Artikel 14 Absatz 5 Unterabsatz 2 bleibt unberührt."
      en: "For a high-risk AI system referred to in Annex III, point 1(a), the provider shall ensure that the human oversight measures are designed so that no action or decision is taken by the deployer on the basis of the identification resulting from the system unless that identification has been separately verified and confirmed by at least two natural persons with the necessary competence, training and authority; the exception in Article 14(5), second subparagraph, remains unaffected."
    sources:
      primary:
        - "SRC-002#Art.14/Abs.5/UAbs.1"
      supplementary:
        - "SRC-002#Anh.III/Nr.1/Buchst.a"
        - "SRC-002#Art.14/Abs.5/UAbs.2"
        - "SRC-002#Art.16/Buchst.a"
    theme_cluster: "Menschliche Aufsicht"
    lifecycle_phases:
      - "Planung und Konzeption"
      - "Entwicklung und Realisierung"
      - "Inverkehrbringen, Inbetriebnahme und Betrieb"
    uncertainty: null
    replaces: []
    replaced_by: []

  - id: "RR-074"
    status: "aktiv"
    title:
      de: "Angemessenes und lebenszyklusbeständiges Genauigkeitsniveau"
      en: "Appropriate and Lifecycle-Consistent Level of Accuracy"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass ein Hochrisiko-KI-System so konzipiert und entwickelt wird, dass es ein angemessenes Maß an Genauigkeit erreicht und hinsichtlich seiner Genauigkeit während seines gesamten Lebenszyklus beständig funktioniert."
      en: "The provider shall ensure that a high-risk AI system is designed and developed so that it achieves an appropriate level of accuracy and performs consistently in that respect throughout its lifecycle."
