  - id: "RR-352"
    status: "aktiv"
    title:
      de: "PMCF-Plan oder Begründung der Nichtanwendbarkeit"
      en: "PMCF Plan or Justification of Non-Applicability"
    requirement_text:
      de: "Der PMS-Plan muss entweder einen Plan für die klinische Nachbeobachtung nach dem Inverkehrbringen gemäß Anhang XIV Teil B enthalten oder eine Begründung enthalten, warum eine klinische Nachbeobachtung nach dem Inverkehrbringen nicht anwendbar ist."
      en: "The PMS plan shall contain either a post-market clinical follow-up plan in accordance with Part B of Annex XIV or a justification as to why post-market clinical follow-up is not applicable."
    sources:
      primary:
        - "SRC-001#Anh.III/Abschn.1/Buchst.b"
      supplementary: []
    theme_cluster: "Post-Market-Monitoring"
    lifecycle_phases:
