  - id: "RR-347"
    status: "aktiv"
    title:
      de: "Verfahren zur wirksamen PMS-Kommunikation"
      en: "Procedures for Effective PMS Communication"
    requirement_text:
      de: "Der PMS-Plan muss Methoden und Protokolle zur wirksamen Kommunikation mit zuständigen Behörden, Benannten Stellen, Wirtschaftsakteuren und Anwendern festlegen."
      en: "The PMS plan shall specify methods and protocols for effective communication with competent authorities, notified bodies, economic operators and users."
