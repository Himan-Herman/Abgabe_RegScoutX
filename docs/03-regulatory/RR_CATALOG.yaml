      en: "Reporting of Trends under Article 88"
    requirement_text:
      de: "Liegt ein gemäß Artikel 88 meldepflichtiger Trend vor, muss der Hersteller diesen auf Grundlage der PMS-Daten nach Artikel 88 melden."
      en: "Where a trend meets the reporting conditions of Article 88, the manufacturer shall report that trend on the basis of PMS data in accordance with Article 88."
