  - id: "RR-345"
    status: "aktiv"
    title:
      de: "Methoden zur Analyse marktbezogener Erfahrungen"
      en: "Methods for Analysis of Market-Related Experience"
    requirement_text:
      de: "Der PMS-Plan muss wirksame und geeignete Methoden und Instrumente zur Analyse der im Feld erhobenen marktbezogenen Erfahrungen vorsehen."
      en: "The PMS plan shall specify effective and appropriate methods and tools for analysing market-related experience collected in the field."
