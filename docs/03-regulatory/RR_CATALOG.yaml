    title:
      de: "Meldung schwerwiegender Vorkommnisse und FSCAs"
      en: "Reporting of Serious Incidents and FSCAs"
    requirement_text:
      de: "Wird ein schwerwiegendes Vorkommnis festgestellt oder eine Sicherheitskorrekturmaßnahme im Feld durchgeführt, muss der Hersteller dies gemäß Artikel 87 melden."
      en: "Where a serious incident is identified or a field safety corrective action is implemented, the manufacturer shall report it in accordance with Article 87."
    sources:
      primary:
        - "SRC-001#Art.83/Abs.4/Satz.2"
      supplementary: []
    theme_cluster: "Post-Market-Monitoring"
    lifecycle_phases:
      - "Post-Market-Überwachung"
    uncertainty: null
