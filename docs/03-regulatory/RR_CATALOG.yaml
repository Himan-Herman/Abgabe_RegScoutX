  - id: "RR-045"
    status: "aktiv"
    title:
      de: "Berücksichtigung der spezifischen Einsatzbedingungen in den Datensätzen"
      en: "Consideration of Specific Settings in Data Sets"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass Trainings-, Validierungs- und Testdatensätze, soweit dies für die Zweckbestimmung erforderlich ist, die entsprechenden Merkmale oder Elemente berücksichtigen, die für die besonderen geografischen, kontextuellen, verhaltensbezogenen oder funktionalen Rahmenbedingungen typisch sind, unter denen das Hochrisiko-KI-System bestimmungsgemäß verwendet werden soll. Bei Hochrisiko-KI-Systemen ohne Techniken zum Training von KI-Modellen gilt diese Anforderung ausschließlich für Testdatensätze."
      en: "The provider shall ensure that training, validation and testing data sets take into account, to the extent required by the intended purpose, the relevant characteristics or elements particular to the specific geographical, contextual, behavioural or functional setting within which the high-risk AI system is intended to be used. For high-risk AI systems not using techniques involving the training of AI models, the requirement applies only to testing data sets."
    sources:
      primary:
        - "SRC-002#Art.10/Abs.4"
      supplementary:
        - "SRC-002#Art.10/Abs.6"
        - "SRC-002#Art.16/Buchst.a"
    theme_cluster: "Data Governance"
