    requirement_text:
      de: "Der Hersteller muss PMS-Daten zur Erkennung von Trends verwenden, die im Rahmen der PMS-Auswertung regulatorisch relevant sind."
      en: "The manufacturer shall use PMS data to detect trends relevant to post-market surveillance."
    sources:
