      en: "Systematic Initiation of Appropriate PMS Measures"
    requirement_text:
      de: "Der PMS-Plan muss systematische Verfahren zur Einleitung der als geeignet ermittelten Maßnahmen einschließlich erforderlicher Korrekturmaßnahmen festlegen."
      en: "The PMS plan shall specify systematic procedures for initiating appropriate measures identified through post-market surveillance, including corrective actions where required."
