      en: "Comparison with Similar Devices"
    requirement_text:
      de: "Der im PMS-Plan vorgesehene Erhebungsprozess muss einen Vergleich des Produkts mit ähnlichen Produkten auf dem Markt ermöglichen."
      en: "The collection process specified in the PMS plan shall enable comparison between the device and similar devices available on the market."
