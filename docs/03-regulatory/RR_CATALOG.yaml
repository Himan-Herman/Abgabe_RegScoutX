      en: "Implementation of Appropriate Measures when Action Is Needed"
    requirement_text:
      de: "Wird im Verlauf der PMS ein Bedarf an Präventiv- oder Korrekturmaßnahmen oder beiden festgestellt, muss der Hersteller die geeigneten Maßnahmen durchführen."
      en: "Where PMS identifies a need for preventive or corrective action or both, the manufacturer shall implement the appropriate measures."
    sources:
