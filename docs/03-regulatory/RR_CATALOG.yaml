      de: "Der Anbieter muss sicherstellen, dass die für die Zweckbestimmung geeigneten Daten-Governance- und Datenverwaltungsverfahren insbesondere eine Bewertung der Verfügbarkeit, Menge und Eignung der benötigten Datensätze betreffen. Bei Hochrisiko-KI-Systemen ohne Techniken zum Training von KI-Modellen gilt diese Anforderung ausschließlich für Testdatensätze."
