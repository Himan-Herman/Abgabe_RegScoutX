      en: "Systematic Identification of Appropriate PMS Measures"
    requirement_text:
      de: "Der PMS-Plan muss systematische Verfahren zur Ermittlung geeigneter Maßnahmen einschließlich möglicher Korrekturmaßnahmen festlegen."
      en: "The PMS plan shall specify systematic procedures for identifying appropriate measures, including corrective actions where appropriate."
    sources:
