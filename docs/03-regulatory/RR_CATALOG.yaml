      en: "Identification of Compliance-Relevant Data Gaps and Shortcomings"
    requirement_text:
      de: "Der Anbieter muss sicherstellen, dass die für die Zweckbestimmung geeigneten Daten-Governance- und Datenverwaltungsverfahren insbesondere die Ermittlung relevanter Datenlücken oder Mängel betreffen, die der Einhaltung dieser Verordnung entgegenstehen. Bei Hochrisiko-KI-Systemen ohne Techniken zum Training von KI-Modellen gilt diese Anforderung ausschließlich für Testdatensätze."
