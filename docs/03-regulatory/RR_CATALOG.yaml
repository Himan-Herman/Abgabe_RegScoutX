change_history:
  - version: "0.1"
    change: "Katalogstruktur angelegt; noch keine regulatorischen Anforderungen enthalten."
  - version: "0.2"
    change: "RR-001 und RR-002 aus SRC-002 Art. 13 Abs. 1 als erster Pilot der regulatorischen Anforderungsextraktion aufgenommen."
  - version: "0.3"
    change: "RR-003 bis RR-006 aus SRC-002 Art. 10 Abs. 2 Buchst. f und g als zweiter Pilot der regulatorischen Anforderungsextraktion aufgenommen."
  - version: "0.4"
    change: "RR-007 bis RR-029 aus SRC-002 Art. 9 als erster systematisch extrahierter Kernbereich aufgenommen; 23 freigegebene Anforderungen zu Risikomanagement und Testing katalogisiert. Zwei Kandidaten bleiben ausserhalb des Katalogs zurueckgestellt."
  - version: "0.5"
    change: "RR-030 bis RR-045 aus SRC-002 Art. 10 als 16 systematisch extrahierte Anforderungen aufgenommen. RR-003 bis RR-006 bleiben materiell unverändert; ihre supplementary-Lokatoren wurden ausschließlich auf die präziseren Satz-Lokatoren des Art. 10 Abs. 2 angepasst. Grundlage ist RR_EXTRACTION_ART10.md Version 1.0."
  - version: "0.6"
    change: "RR-046 bis RR-062 aus SRC-002 Art. 13 als 17 systematisch extrahierte Anforderungen aufgenommen. RR-001 und RR-002 wurden im systematischen Durchlauf materiell bestätigt und unverändert belassen. Grundlage ist RR_EXTRACTION_ART13.md Version 1.0."
  - version: "0.7"
    change: "RR-063 aus SRC-002 Art. 9 Abs. 5 UAbs. 3 als Kandidat V aufgenommen, nachdem die Sprachfassungsdivergenz nach dem multilingualen Source-Divergence-Protokoll adjudiziert wurde. Kandidat T erhält nach der Cross-Source-Deduplizierung keine eigene RR. Grundlage ist RR_EXTRACTION_ART9.md Version 1.2."
  - version: "0.8"
    change: "RR-064 bis RR-073 aus SRC-002 Art. 14 als 10 systematisch extrahierte Anforderungen aufgenommen. Grundlage ist RR_EXTRACTION_ART14.md Version 1.0. RR-073 trägt die konditionale Anwendbarkeit nach Art. 14 Abs. 5 im normativen Requirement Text; das Katalogschema bleibt unverändert."
  - version: "0.9"
    change: "RR-074 bis RR-080 als sieben systematisch extrahierte Gap-Anforderungen aus den freigegebenen Bereichen von SRC-002 Art. 15 aufgenommen. Grundlage ist RR_EXTRACTION_ART15.md Version 1.0. RR-079 und RR-080 enthalten die konditionale Anwendbarkeit für weiterlernende Systeme im normativen Requirement Text. Die Cybersecurity-Komponente aus Art. 15 Abs. 1 verbleibt aufgrund des definierten Gap-Themen-Scope außerhalb des RR-Katalogs."
  - version: "0.10"
    change: "RR-081 bis RR-104 als 24 systematisch extrahierte Anforderungen aus den freigegebenen Bereichen von SRC-002 Art. 17 aufgenommen. Grundlage ist RR_EXTRACTION_ART17.md Version 1.0. RR-093 enthält die konditionale Anwendbarkeit aus Art. 17 Abs. 1 Buchst. e im Requirement Text. Art. 17 Abs. 1 Buchst. i, Abs. 3 und Abs. 4 erzeugen im aktuellen Coverage keine RR. RR-096 bis RR-098 bleiben für den späteren Abgleich mit Art. 72 traceability-seitig vorgemerkt."
  - version: "0.11"
    change: "RR-105 bis RR-115 als 11 systematisch extrahierte Anforderungen aus SRC-002 Art. 72 aufgenommen. Grundlage ist RR_EXTRACTION_ART72.md Version 1.0. RR-111, RR-114 und RR-115 enthalten ihre konditionale Anwendbarkeit im Requirement Text. Die Scope-Ausnahme aus Art. 72 Abs. 2 Satz 3, die institutionelle Kommissionspflicht aus Abs. 3 Satz 3 sowie Art. 72 Abs. 4 UAbs. 2 erzeugen keine RR. RR-096 bis RR-098 bleiben nach dokumentiertem Cross-Source-Abgleich unverändert."
  - version: "0.12"
    change: "RR-116 bis RR-142 als 27 systematisch extrahierte Anforderungen aus den freigegebenen Bereichen von SRC-001 Art. 10 aufgenommen. Grundlage ist RR_EXTRACTION_MDR_ART10.md Version 1.1. Davon sind 5 reguläre Anforderungen aus Art. 10 Absatz 2 und Absatz 9 Unterabsatz 1 Satz 1; 22 Anforderungen aus Art. 10 Absatz 9 besitzen eine konditionale Anwendbarkeit, deren jeweilige Bedingung im Requirement Text erhalten ist. Die Nachadjudikation der Evidenz ergab 0 unresolved, 0 deferred, 0 Cross-Regulation-Deduplizierungen und 0 Out-of-Scope-Atome im finalen aktiven Bereich."
  - version: "0.13"
    change: "RR-143 bis RR-153 als 11 systematisch extrahierte Anforderungen aus SRC-001#Anh.I/Nr.3 aufgenommen. Grundlage ist RR_EXTRACTION_MDR_ANNEXI_3.md Version 1.0. Davon sind 10 reguläre Anforderungen und eine Anforderung mit konditionaler Anwendbarkeit, deren Bedingung im Requirement Text erhalten ist. Die vier Top-Level-Sollzustände aus Anhang I Nr. 3 Satz 1 wurden vollständig gegen RR-116 bis RR-119 dedupliziert und erzeugen keine neuen RR. Die Supplementary-Lokatoren von RR-116 bis RR-119 wurden ausschließlich von SRC-001#Anh.I/Nr.3 auf SRC-001#Anh.I/Nr.3/Satz.1 präzisiert; diese vier RR bleiben materiell unverändert. 0 unresolved, 0 deferred, 0 Out-of-Scope-Atome und 0 Cross-Regulation-Deduplizierungen."
  - version: "0.14"
    change: "RR-154 bis RR-162 als neun systematisch extrahierte Anforderungen aus SRC-001#Anh.I/Nr.4 aufgenommen. Grundlage ist RR_EXTRACTION_MDR_ANNEXI_4.md Version 1.0. Davon sind 7 reguläre Anforderungen und 2 Anforderungen mit konditionaler Anwendbarkeit, deren Bedingung jeweils im Requirement Text erhalten ist. Es erfolgte keine MDR-interne Deduplizierung mit RR-151 oder RR-153; beide bleiben unverändert. Anhang I Nr. 2 wurde ausschließlich als notwendiger normativer Supplementary-Kontext für RR-158 verwendet und nicht systematisch extrahiert. 0 unresolved, 0 deferred, 0 Out-of-Scope-Atome und 0 Cross-Regulation-Deduplizierungen."
  - version: "0.15"
    change: "RR-163 und RR-164 als zwei systematisch extrahierte Anforderungen aus SRC-001#Anh.I/Nr.5 aufgenommen. Grundlage ist RR_EXTRACTION_MDR_ANNEXI_5.md Version 1.0. Beide Anforderungen sind regulär aktivierbar. 0 MDR-interne Deduplizierungen, 0 unresolved, 0 deferred, 0 Out-of-Scope-Atome und 0 Cross-Regulation-Deduplizierungen. Die in der Evidenz dokumentierte multilinguale Abweichung zur Modalitätsklausel in Anhang I Nr. 5 Buchstabe b wurde vollständig adjudiziert und erzeugt keine verbleibende Unsicherheit. Anhang I Nr. 2 wurde ausschließlich als notwendiger Supplementary-Kontext für RR-163 verwendet und nicht systematisch extrahiert."
  - version: "0.16"
    change: "RR-165 bis RR-168 als vier systematisch extrahierte Anforderungen aus SRC-001#Anh.I/Nr.17.1 aufgenommen. Grundlage ist RR_EXTRACTION_MDR_ANNEXI_17_1.md Version 1.0. Alle vier Anforderungen sind regulär, 0 conditional. Satz 1 ergibt drei getrennte Sollzustände für Wiederholbarkeit, Zuverlässigkeit und Leistung entsprechend der Zweckbestimmung; Satz 2 ergibt eine gemeinsame reguläre Single-Fault-Anforderung mit erhaltener Oder-Struktur für resultierende Risiken oder Leistungsbeeinträchtigungen. Die zunächst als M17_1-E geprüfte Split-Variante wurde vor der Katalogisierung verworfen und erhält keine permanente RR-ID. Anhang I Nr. 2 wurde nicht als Supplementary-Locator von RR-168 übernommen und nicht systematisch extrahiert. 0 MDR-interne Deduplizierungen, 0 unresolved, 0 deferred, 0 Out-of-Scope-Atome und 0 Cross-Regulation-Deduplizierungen."
  - version: "0.17"
    change: "RR-169 bis RR-173 als fünf systematisch extrahierte Anforderungen aus SRC-001#Anh.I/Nr.17.2 aufgenommen. Grundlage ist RR_EXTRACTION_MDR_ANNEXI_17_2.md Version 1.0. Alle fünf Anforderungen sind regulär, 0 conditional. Atomisiert wurden der Stand der Technik, der Software-Lebenszyklus, das Risikomanagement einschließlich der Informationssicherheit, die Verifizierung und die Validierung. Die Informationssicherheit bleibt Bestandteil von RR-171 und erzeugt keine separate Security-Anforderung. Die multilinguale Divergenz zwischen dem amtlichen deutschen Ausdruck Software-Lebenszyklus und der englischen Formulierung development life cycle wurde vollständig adjudiziert; RR-170 behält im deutschen Requirement Text den amtlichen Begriff und uncertainty null. Alle fünf neuen Anforderungen tragen die Lebenszyklusphasen Entwicklung und Realisierung sowie Änderung und Wartung. Es wurden keine Inhalte aus Anhang I Nr. 17.4, IEC 62304 oder ISO 14971 importiert. 0 MDR-interne Deduplizierungen, 0 unresolved, 0 deferred, 0 Out-of-Scope-Atome und 0 Cross-Regulation-Deduplizierungen."
  - version: "0.18"
    change: "RR-174 bis RR-182 als neun systematisch extrahierte Anforderungen aus SRC-001#Anh.I/Nr.22.1 bis Nr.22.3 aufgenommen. Grundlage ist RR_EXTRACTION_MDR_ANNEXI_22_1_22_3.md Version 1.0. 10 normative Kandidatenatome geprüft; 1 Out-of-Scope-Atom (unbeabsichtigtes Schneiden, Stechen bzw. Nadelstichverletzungen) erzeugt keine RR. Alle neun Anforderungen tragen das Themencluster Gebrauchstauglichkeit und stehen unter dem äußeren Coverage-Trigger der vorgesehenen Laienanwendung; RR-180, RR-181 und RR-182 enthalten zusätzlich ihre innere konditionale Anwendbarkeit im Requirement Text. Kein neues Schemafeld. Die Sprachfassungsdivergenz fehlerfrei / accurately / correctement ist in der Evidenz dokumentiert. Abgleich mit RR-163 und RR-164: 0 vollständige Deduplizierungen; beide unverändert. 0 unresolved, 0 deferred."
  - version: "0.19"
