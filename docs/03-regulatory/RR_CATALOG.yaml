  - id: "RR-353"
    status: "aktiv"
    title:
      de: "Erstellung des PMS-Berichts"
      en: "Preparation of the Post-Market Surveillance Report"
    requirement_text:
      de: "Für ein Produkt der Klasse I muss der Hersteller einen Bericht über die Überwachung nach dem Inverkehrbringen erstellen."
      en: "For a class I device, the manufacturer shall prepare a post-market surveillance report."
    sources:
      primary:
        - "SRC-001#Art.85/Satz.1"
      supplementary: []
    theme_cluster: "Post-Market-Monitoring"
    lifecycle_phases:
