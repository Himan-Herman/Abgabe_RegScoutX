      de: "Information der zuständigen Behörden über erforderliche PMS-Maßnahmen"
      en: "Information of Competent Authorities about Required PMS Action"
    requirement_text:
      de: "Wird im Verlauf der PMS ein Bedarf an Präventiv- oder Korrekturmaßnahmen festgestellt, muss der Hersteller die betroffenen zuständigen Behörden informieren."
      en: "Where PMS identifies a need for preventive or corrective action, the manufacturer shall inform the competent authorities concerned."
    sources:
