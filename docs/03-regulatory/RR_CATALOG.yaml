      en: "PMS Plan for Serious Incidents and FSCAs"
    requirement_text:
      de: "Der PMS-Plan muss die Erhebung und Verwendung verfügbarer Informationen über schwerwiegende Vorkommnisse einschließlich Informationen aus PSURs sowie über Sicherheitskorrekturmaßnahmen im Feld abdecken."
      en: "The PMS plan shall address the collection and utilisation of available information concerning serious incidents, including information from PSURs, and field safety corrective actions."
    sources:
      primary:
        - "SRC-001#Anh.III/Abschn.1/Buchst.a"
      supplementary: []
    theme_cluster: "Post-Market-Monitoring"
    lifecycle_phases:
      - "Planung und Konzeption"
    uncertainty: null
    replaces: []
    replaced_by: []
  - id: "RR-334"
    status: "aktiv"
    title:
