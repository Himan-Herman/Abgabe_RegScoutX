  - id: "RR-328"
    status: "aktiv"
    title:
      de: "Information der Benannten Stelle über erforderliche PMS-Maßnahmen"
      en: "Information of the Notified Body about Required PMS Action"
    requirement_text:
      de: "Wird im Verlauf der PMS ein Bedarf an Präventiv- oder Korrekturmaßnahmen festgestellt und ist eine Benannte Stelle einschlägig, muss der Hersteller diese informieren."
      en: "Where PMS identifies a need for preventive or corrective action and a notified body is applicable, the manufacturer shall inform that notified body."
    sources:
      primary:
