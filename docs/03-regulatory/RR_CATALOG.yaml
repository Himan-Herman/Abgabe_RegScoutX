    requirement_text:
      de: "Der im PMS-Plan vorgesehene Erhebungsprozess muss eine ordnungsgemäße Charakterisierung der Leistung des Produkts ermöglichen."
      en: "The collection process specified in the PMS plan shall enable a correct characterisation of the performance of the device."
