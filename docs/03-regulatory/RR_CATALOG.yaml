      en: "Identification of Action Needs from PMS Data"
    requirement_text:
      de: "Der Hersteller muss PMS-Daten zur Ermittlung des Bedarfs an Präventiv-, Korrektur- oder Sicherheitskorrekturmaßnahmen im Feld verwenden."
      en: "The manufacturer shall use PMS data to identify needs for preventive, corrective or field safety corrective action."
