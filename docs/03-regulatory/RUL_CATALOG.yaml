    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Art. 3 Nr. 1 definiert das KI-System als maschinenbasiertes System mit variierendem Autonomiegrad, das für explizite oder implizite Ziele aus Eingaben ableitet, wie es Ausgaben erzeugt, die physische oder virtuelle Umgebungen beeinflussen können."
    dependencies: []
    replaces: []
    replaced_by: []

  - id: "RUL-028"
    status: "aktiv"
    category: "AI_ACT_APPLICABILITY"
    title:
      de: "Anknüpfungspunkt nach Art. 2 Abs. 1"
      en: "Nexus under Article 2(1)"
    question:
      de: "Besteht ein räumlicher bzw. akteursbezogener Anknüpfungspunkt nach Art. 2 Abs. 1?"
      en: "Is there a territorial or operator nexus under Article 2(1)?"
    input_key: "scope_nexus"
    input_type: "enum"
    allowed_values: ["EU_PROVIDER", "EU_DEPLOYER", "THIRD_COUNTRY_OUTPUT_USED_IN_EU", "IMPORTER_DISTRIBUTOR", "PRODUCT_MANUFACTURER", "AUTH_REP", "NONE", "UNCLEAR"]
    value_labels:
      EU_PROVIDER: {de: "Anbieter, der das KI-System in der Union in Verkehr bringt oder in Betrieb nimmt", en: "Provider placing the AI system on the market or putting it into service in the Union"}
      EU_DEPLOYER: {de: "Betreiber mit Sitz oder Standort in der Union", en: "Deployer established or located in the Union"}
      THIRD_COUNTRY_OUTPUT_USED_IN_EU: {de: "Anbieter oder Betreiber in einem Drittland, dessen Ausgabe in der Union verwendet wird", en: "Provider or deployer in a third country whose output is used in the Union"}
      IMPORTER_DISTRIBUTOR: {de: "Einführer oder Händler", en: "Importer or distributor"}
      PRODUCT_MANUFACTURER: {de: "Produkthersteller, der das KI-System zusammen mit seinem Produkt unter eigenem Namen oder eigener Marke in Verkehr bringt oder in Betrieb nimmt", en: "Product manufacturer placing the AI system on the market or putting it into service together with its product under its own name or trademark"}
      AUTH_REP: {de: "Bevollmächtigter eines nicht in der Union niedergelassenen Anbieters", en: "Authorised representative of a provider not established in the Union"}
      NONE: {de: "Kein Anknüpfungspunkt", en: "No nexus"}
      UNCLEAR: {de: "Unklar", en: "Unclear"}
    decision_logic: "Jede benannte Kategorie führt zu RUL-029; NONE ergibt AI_ACT_NOT_APPLICABLE; UNCLEAR ergibt AI_ACT_APPLICABILITY_REVIEW_REQUIRED."
    branches:
      - when: "EU_PROVIDER"
        next: "RUL-029"
      - when: "EU_DEPLOYER"
        next: "RUL-029"
      - when: "THIRD_COUNTRY_OUTPUT_USED_IN_EU"
        next: "RUL-029"
      - when: "IMPORTER_DISTRIBUTOR"
        next: "RUL-029"
      - when: "PRODUCT_MANUFACTURER"
        next: "RUL-029"
      - when: "AUTH_REP"
        next: "RUL-029"
      - when: "NONE"
        result: "AI_ACT_NOT_APPLICABLE"
      - when: "UNCLEAR"
        result: "AI_ACT_APPLICABILITY_REVIEW_REQUIRED"
        review_cause:
          de: "Der Anknüpfungspunkt nach Art. 2 Abs. 1 ist nicht determinierbar."
          en: "The nexus under Article 2(1) cannot be determined."
    primary_legal_anchor:
      - "SRC-002#Art.2/Abs.1"
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Art. 2 Abs. 1 bestimmt den persönlichen und räumlichen Anwendungsbereich."
    dependencies: ["RUL-027"]
    replaces: []
    replaced_by: []

