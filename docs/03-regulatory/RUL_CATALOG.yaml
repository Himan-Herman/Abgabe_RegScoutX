  - id: "RUL-038"
    status: "aktiv"
    category: "AI_ACT_APPLICABILITY"
    title:
      de: "Anhang-III-Anwendungsfall nach Art. 6 Abs. 2"
      en: "Annex III use case under Article 6(2)"
    question:
      de: "Ist das KI-System für einen der für RegScoutX relevanten Anwendungsfälle aus Anhang III bestimmt?"
      en: "Is the AI system intended for any Annex III use case relevant to the RegScoutX MDSW scope?"
    input_key: "annex_iii_use_case"
    input_type: "enum"
    allowed_values: ["REMOTE_BIOMETRIC_IDENTIFICATION", "SENSITIVE_BIOMETRIC_CATEGORISATION", "EMOTION_RECOGNITION", "PUBLIC_HEALTHCARE_ELIGIBILITY", "HEALTH_INSURANCE_RISK_PRICING", "EMERGENCY_CALL_CLASSIFICATION", "EMERGENCY_SERVICE_DISPATCH_PRIORITY", "EMERGENCY_HEALTHCARE_TRIAGE", "NONE", "OTHER_ANNEX_III_POSSIBLE", "UNCLEAR"]
    value_labels:
      REMOTE_BIOMETRIC_IDENTIFICATION: {de: "Biometrische Fernidentifizierung (nicht bloße 1:1-Verifizierung)", en: "Remote biometric identification (not mere 1:1 verification)"}
      SENSITIVE_BIOMETRIC_CATEGORISATION: {de: "Biometrische Kategorisierung nach sensiblen oder geschützten Merkmalen auf Grundlage abgeleiteter Merkmale", en: "Biometric categorisation according to sensitive or protected attributes based on inferred attributes"}
      EMOTION_RECOGNITION: {de: "Emotionserkennung", en: "Emotion recognition"}
      PUBLIC_HEALTHCARE_ELIGIBILITY: {de: "Bewertung der Anspruchsberechtigung natürlicher Personen für wesentliche öffentliche Unterstützungsleistungen einschließlich Gesundheitsleistungen", en: "Evaluation of the eligibility of natural persons for essential public assistance benefits including healthcare services"}
      HEALTH_INSURANCE_RISK_PRICING: {de: "Risikobewertung und Preisbildung in der Lebens- und Krankenversicherung", en: "Risk assessment and pricing in life and health insurance"}
      EMERGENCY_CALL_CLASSIFICATION: {de: "Bewertung und Klassifizierung von Notrufen", en: "Evaluation and classification of emergency calls"}
      EMERGENCY_SERVICE_DISPATCH_PRIORITY: {de: "Disposition und Priorisierung von Notfalldiensten", en: "Dispatch and prioritisation of emergency services"}
      EMERGENCY_HEALTHCARE_TRIAGE: {de: "Triage von Patientinnen und Patienten in der Notfallversorgung", en: "Emergency healthcare patient triage"}
      NONE: {de: "Kein Anhang-III-Anwendungsfall", en: "No Annex III use case"}
      OTHER_ANNEX_III_POSSIBLE: {de: "Anderer, auch nicht-medizinischer bzw. dualer Anhang-III-Anwendungsfall möglich", en: "Other, including non-medical or dual-use, Annex III use case possible"}
      UNCLEAR: {de: "Unklar", en: "Unclear"}
    decision_logic: "Beginn der Art.-6(2)-Route; wird nach jedem Art.-6(1)-Routenergebnis ausgeführt. Konkreter Treffer ergibt ANNEX_III_MATCH und führt zu RUL-040 (Zuordnung: REMOTE_BIOMETRIC_IDENTIFICATION Anh. III Nr. 1 Buchst. a; SENSITIVE_BIOMETRIC_CATEGORISATION Nr. 1 Buchst. b; EMOTION_RECOGNITION Nr. 1 Buchst. c; PUBLIC_HEALTHCARE_ELIGIBILITY Nr. 5 Buchst. a; HEALTH_INSURANCE_RISK_PRICING Nr. 5 Buchst. c; EMERGENCY_CALL_CLASSIFICATION, EMERGENCY_SERVICE_DISPATCH_PRIORITY und EMERGENCY_HEALTHCARE_TRIAGE Nr. 5 Buchst. d). NONE ergibt ART6_2_ROUTE_FALSE; OTHER_ANNEX_III_POSSIBLE und UNCLEAR ergeben ART6_2_REVIEW_REQUIRED, weil nicht-medizinische bzw. duale Anhang-III-Bereiche nicht pauschal verneint werden. Diese beiden Routenergebnisse führen zu RUL-043."
    branches:
      - when: "REMOTE_BIOMETRIC_IDENTIFICATION"
        result: "ANNEX_III_MATCH"
        next: "RUL-040"
      - when: "SENSITIVE_BIOMETRIC_CATEGORISATION"
        result: "ANNEX_III_MATCH"
        next: "RUL-040"
      - when: "EMOTION_RECOGNITION"
        result: "ANNEX_III_MATCH"
        next: "RUL-040"
      - when: "PUBLIC_HEALTHCARE_ELIGIBILITY"
        result: "ANNEX_III_MATCH"
        next: "RUL-040"
      - when: "HEALTH_INSURANCE_RISK_PRICING"
        result: "ANNEX_III_MATCH"
        next: "RUL-040"
      - when: "EMERGENCY_CALL_CLASSIFICATION"
        result: "ANNEX_III_MATCH"
        next: "RUL-040"
      - when: "EMERGENCY_SERVICE_DISPATCH_PRIORITY"
        result: "ANNEX_III_MATCH"
        next: "RUL-040"
      - when: "EMERGENCY_HEALTHCARE_TRIAGE"
        result: "ANNEX_III_MATCH"
        next: "RUL-040"
      - when: "NONE"
        result: "ART6_2_ROUTE_FALSE"
        next: "RUL-043"
      - when: "OTHER_ANNEX_III_POSSIBLE"
        result: "ART6_2_REVIEW_REQUIRED"
        next: "RUL-043"
      - when: "UNCLEAR"
        result: "ART6_2_REVIEW_REQUIRED"
        next: "RUL-043"
    primary_legal_anchor:
      - "SRC-002#Art.6/Abs.2"
      - "SRC-002#Anh.III/Nr.1/Buchst.a"
      - "SRC-002#Anh.III/Nr.1/Buchst.b"
      - "SRC-002#Anh.III/Nr.1/Buchst.c"
      - "SRC-002#Anh.III/Nr.5/Buchst.a"
      - "SRC-002#Anh.III/Nr.5/Buchst.c"
      - "SRC-002#Anh.III/Nr.5/Buchst.d"
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Art. 6 Abs. 2 verweist unmittelbar auf die Anwendungsfälle des Anhangs III; die Route ist eine Alternative zu Art. 6 Abs. 1, kein Unterfall."
    dependencies: ["RUL-030", "RUL-031", "RUL-032", "RUL-033", "RUL-034", "RUL-035", "RUL-036", "RUL-037"]
    replaces: []
    replaced_by: []

