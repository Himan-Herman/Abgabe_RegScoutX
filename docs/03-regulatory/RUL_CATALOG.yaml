    value_labels:
      "YES": {de: "Ja", en: "Yes"}
      "NO": {de: "Nein", en: "No"}
      UNCLEAR: {de: "Unklar", en: "Unclear"}
    decision_logic: "YES schließt die Art.-6(3)-Ausnahme aus und ergibt ANNEX_III_HIGH_RISK_CANDIDATE (weiter mit RUL-044); NO führt zur Prüfung der Ausnahmebedingungen (RUL-041); UNCLEAR ergibt ART6_2_REVIEW_REQUIRED (weiter mit RUL-043)."
    branches:
      - when: "YES"
        result: "ANNEX_III_HIGH_RISK_CANDIDATE"
        next: "RUL-044"
      - when: "NO"
        next: "RUL-041"
      - when: "UNCLEAR"
        result: "ART6_2_REVIEW_REQUIRED"
        next: "RUL-043"
    primary_legal_anchor:
      - "SRC-002#Art.6/Abs.3"
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Ungeachtet der Ausnahme gilt ein in Anhang III genanntes KI-System immer als hochriskant, wenn es Profiling natürlicher Personen vornimmt."
    dependencies: ["RUL-038"]
    replaces: []
    replaced_by: []

  - id: "RUL-041"
    status: "aktiv"
    category: "AI_ACT_APPLICABILITY"
    title:
      de: "Bedingung der Ausnahme nach Art. 6 Abs. 3 Buchst. a bis d"
      en: "Derogation condition under Article 6(3)(a) to (d)"
    question:
      de: "Ist mindestens eine der folgenden Bedingungen erfüllt: enge verfahrensbezogene Aufgabe, Verbesserung des Ergebnisses einer zuvor abgeschlossenen menschlichen Tätigkeit, Erkennung von Entscheidungsmustern oder Abweichungen ohne Ersetzung oder Beeinflussung der zuvor abgeschlossenen menschlichen Bewertung ohne angemessene menschliche Überprüfung, vorbereitende Aufgabe für eine für Anhang III relevante Bewertung?"
      en: "Is at least one of the following conditions met: narrow procedural task, improving the result of a previously completed human activity, detecting decision-making patterns or deviations without replacing or influencing the previously completed human assessment without proper human review, preparatory task to an assessment relevant for Annex III?"
    input_key: "art6_3_derogation_condition"
    input_type: "enum"
    allowed_values: ["NARROW_PROCEDURAL_TASK", "IMPROVES_PREVIOUS_HUMAN_ACTIVITY", "PATTERN_DETECTION_WITH_HUMAN_REVIEW", "PREPARATORY_TASK", "NONE", "UNCLEAR"]
    value_labels:
      NARROW_PROCEDURAL_TASK: {de: "Enge verfahrensbezogene Aufgabe (Buchst. a)", en: "Narrow procedural task (point (a))"}
      IMPROVES_PREVIOUS_HUMAN_ACTIVITY: {de: "Verbesserung des Ergebnisses einer zuvor abgeschlossenen menschlichen Tätigkeit (Buchst. b)", en: "Improving the result of a previously completed human activity (point (b))"}
      PATTERN_DETECTION_WITH_HUMAN_REVIEW: {de: "Erkennung von Entscheidungsmustern oder Abweichungen ohne Ersetzung oder Beeinflussung der zuvor abgeschlossenen menschlichen Bewertung ohne angemessene menschliche Überprüfung (Buchst. c)", en: "Detecting decision-making patterns or deviations without replacing or influencing the previously completed human assessment without proper human review (point (c))"}
      PREPARATORY_TASK: {de: "Vorbereitende Aufgabe für eine für Anhang III relevante Bewertung (Buchst. d)", en: "Preparatory task to an assessment relevant for Annex III (point (d))"}
      NONE: {de: "Keine dieser Bedingungen", en: "None of these conditions"}
      UNCLEAR: {de: "Unklar", en: "Unclear"}
    decision_logic: "Eine erfüllte Bedingung führt zur Prüfung des erheblichen Risikos (RUL-042); allein daraus folgt kein Nicht-Hochrisiko. NONE ergibt ANNEX_III_HIGH_RISK_CANDIDATE (weiter mit RUL-044); UNCLEAR ergibt ART6_2_REVIEW_REQUIRED (weiter mit RUL-043)."
    branches:
      - when: "NARROW_PROCEDURAL_TASK"
        next: "RUL-042"
      - when: "IMPROVES_PREVIOUS_HUMAN_ACTIVITY"
        next: "RUL-042"
      - when: "PATTERN_DETECTION_WITH_HUMAN_REVIEW"
        next: "RUL-042"
      - when: "PREPARATORY_TASK"
        next: "RUL-042"
      - when: "NONE"
        result: "ANNEX_III_HIGH_RISK_CANDIDATE"
        next: "RUL-044"
      - when: "UNCLEAR"
        result: "ART6_2_REVIEW_REQUIRED"
        next: "RUL-043"
    primary_legal_anchor:
      - "SRC-002#Art.6/Abs.3/Buchst.a"
      - "SRC-002#Art.6/Abs.3/Buchst.b"
      - "SRC-002#Art.6/Abs.3/Buchst.c"
      - "SRC-002#Art.6/Abs.3/Buchst.d"
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Die Ausnahme nach Art. 6 Abs. 3 setzt mindestens eine der vier Bedingungen des zweiten Unterabsatzes voraus; sie gilt nur kumulativ mit dem Fehlen eines erheblichen Risikos."
    dependencies: ["RUL-040"]
    replaces: []
    replaced_by: []

  - id: "RUL-042"
    status: "aktiv"
    category: "AI_ACT_APPLICABILITY"
    title:
      de: "Erhebliches Risiko nach Art. 6 Abs. 3"
      en: "Significant risk under Article 6(3)"
    question:
      de: "Birgt das KI-System ein erhebliches Risiko der Beeinträchtigung von Gesundheit, Sicherheit oder Grundrechten natürlicher Personen, auch dadurch, dass es das Ergebnis der Entscheidungsfindung wesentlich beeinflusst?"
      en: "Does the AI system pose a significant risk of harm to the health, safety or fundamental rights of natural persons, including by materially influencing the outcome of decision making?"
    input_key: "significant_risk_health_safety_fundamental_rights"
    input_type: "enum"
    allowed_values: ["YES", "NO", "UNCLEAR"]
    value_labels:
      "YES": {de: "Ja", en: "Yes"}
      "NO": {de: "Nein", en: "No"}
      UNCLEAR: {de: "Unklar", en: "Unclear"}
    decision_logic: "YES ergibt ANNEX_III_HIGH_RISK_CANDIDATE (weiter mit RUL-044); NO ergibt ART6_3_NON_HIGH_RISK mit dem Hinweis ART6_4_SELF_ASSESSMENT_OBLIGATIONS_APPLY; UNCLEAR ergibt ART6_2_REVIEW_REQUIRED. Beide führen zu RUL-043."
    branches:
      - when: "YES"
        result: "ANNEX_III_HIGH_RISK_CANDIDATE"
        next: "RUL-044"
      - when: "NO"
        result: "ART6_3_NON_HIGH_RISK"
        next: "RUL-043"
      - when: "UNCLEAR"
        result: "ART6_2_REVIEW_REQUIRED"
        next: "RUL-043"
    primary_legal_anchor:
      - "SRC-002#Art.6/Abs.3"
      - "SRC-002#Art.6/Abs.4"
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Die Ausnahme greift nur, wenn zusätzlich zu einer Bedingung nach Buchst. a bis d belastbar feststeht, dass kein erhebliches Risiko besteht; Art. 6 Abs. 4 regelt die Folgen der Nicht-Hochrisiko-Selbsteinstufung."
    dependencies: ["RUL-041"]
    replaces: []
    replaced_by: []

  - id: "RUL-043"
    status: "aktiv"
    category: "AI_ACT_APPLICABILITY"
    title:
      de: "Kombiniertes Hochrisiko-Routing nach Art. 6"
      en: "Combined high-risk routing under Article 6"
    question:
      de: "Keine Nutzerfrage; ergibt sich aus den Ergebnissen der Art.-6(1)- und Art.-6(2)/(3)-Route."
      en: "No user question; follows from the results of the Article 6(1) and Article 6(2)/(3) routes."
    input_key: "art6_combined_route_state"
    input_type: "derived"
    allowed_values: ["AI_ACT_HIGH_RISK", "AI_ACT_APPLICABILITY_REVIEW_REQUIRED", "AI_ACT_HIGH_RISK_LEGACY_TRANSITION", "AI_ACT_NOT_YET_APPLICABLE", "AI_ACT_APPLICABLE_NOT_HIGH_RISK"]
    value_labels: null
    decision_logic: "Kombiniert ausschließlich die bereits bestimmten Routenergebnisse: HIGH_RISK = wirksame Art.-6(1)-Route ODER wirksame Art.-6(2)-Route. Vorrangfolge der Zustände in allowed_values: ein wirksamer Hochrisiko-Weg vor ungeklärter Route vor Übergang vor noch nicht anwendbar vor nicht hochriskant. Nicht hochriskant daher nur, wenn beide Routen negativ sind bzw. die Art.-6(3)-Ausnahme festgestellt ist; nie aus einer negativen Art.-6(1)-Route allein. Ein positives Art.-6(1)-Ergebnis wird durch Art. 6 Abs. 3 nicht aufgehoben. Treffen beide Wege zu, bestimmt der früheste wirksame Weg den Beginn (applicable_from)."
    branches:
      - when: "AI_ACT_HIGH_RISK"
        result: "AI_ACT_HIGH_RISK"
      - when: "AI_ACT_APPLICABILITY_REVIEW_REQUIRED"
        result: "AI_ACT_APPLICABILITY_REVIEW_REQUIRED"
        review_cause:
          de: "Mindestens eine Hochrisiko-Route ist nicht determinierbar, und keine Route ergibt einen wirksamen Hochrisiko-Status."
          en: "At least one high-risk route cannot be determined and no route yields an effective high-risk status."
      - when: "AI_ACT_HIGH_RISK_LEGACY_TRANSITION"
        result: "AI_ACT_HIGH_RISK_LEGACY_TRANSITION"
      - when: "AI_ACT_NOT_YET_APPLICABLE"
        result: "AI_ACT_NOT_YET_APPLICABLE"
      - when: "AI_ACT_APPLICABLE_NOT_HIGH_RISK"
        result: "AI_ACT_APPLICABLE_NOT_HIGH_RISK"
    primary_legal_anchor:
      - "SRC-002#Art.6"
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Art. 6 Abs. 2 bestimmt die Anhang-III-Systeme zusätzlich zu den Systemen nach Abs. 1 als hochriskant; die Wege sind parallel möglich. Die Anwendungstermine nach Art. 113 Buchst. c unterscheiden die Wege zeitlich."
    dependencies: ["RUL-038", "RUL-039", "RUL-040", "RUL-041", "RUL-042", "RUL-044", "RUL-045", "RUL-046", "RUL-047"]
    replaces: []
    replaced_by: []

  - id: RUL-044
    status: aktiv
    category: AI_ACT_APPLICABILITY
    title:
      de: Anwendungsbeginn der Anhang-III-Route vor Übergangsprüfung
      en: Annex III date of application before the transitional check
    question:
      de: Auf welches Datum bezieht sich die Bewertung (Stichtag 02.12.2027 für Art.-6(2)-Systeme)?
      en: To which date does the assessment refer (reference date 2 December 2027 for Article 6(2) systems)?
    input_key: assessment_date
    input_type: date
    allowed_values: []
    value_labels: null
    decision_logic: Vor 2027-12-02 ergibt ART6_2_NOT_YET_APPLICABLE und führt zu RUL-043; ab 2027-12-02 folgt zwingend
      die Übergangsprüfung RUL-045. Noch kein wirksamer Hochrisiko-Ausgang allein aus dem Bewertungsdatum.
    branches:
    - when:
        before: '2027-12-02'
      result: ART6_2_NOT_YET_APPLICABLE
      next: RUL-043
    - when:
        on_or_after: '2027-12-02'
      next: RUL-045
    primary_legal_anchor:
    - SRC-002#Art.113/Buchst.c/Ziff.i
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: 'Anwendungsbeginn und Übergang sind getrennte Voraussetzungen: Art. 113 Buchst. c Ziff. i bestimmt
      den Stichtag; Art. 111 Abs. 2 kann die Hochrisiko-Pflichten für Bestandsysteme begrenzen. Ersetzt die unvollständige
      zeitliche Freigabe in RUL-039.'
    dependencies:
    - RUL-040
    - RUL-041
    - RUL-042
    replaces:
    - RUL-039
    replaced_by: []
  - id: RUL-045
    status: aktiv
    category: AI_ACT_APPLICABILITY
    title:
      de: Inverkehrbringen oder Inbetriebnahme auf der Anhang-III-Route
      en: Placing on the market or putting into service on the Annex III route
    question:
      de: Wann wurde das KI-System in Verkehr gebracht oder in Betrieb genommen (Anhang-III-Stichtag 02.12.2027)?
      en: When was the AI system placed on the market or put into service (Annex III reference date 2 December 2027)?
    input_key: market_or_service_date
    input_type: date
    allowed_values:
    - UNKNOWN
    value_labels: null
    decision_logic: Vor 2027-12-02 folgt RUL-046 (Konzeptionsänderung); ab 2027-12-02 ergibt ART6_2_HIGH_RISK und
      führt zu RUL-043; UNKNOWN ergibt ART6_2_REVIEW_REQUIRED und führt zu RUL-043.
    branches:
    - when:
        before: '2027-12-02'
      next: RUL-046
    - when:
        on_or_after: '2027-12-02'
      result: ART6_2_HIGH_RISK
      next: RUL-043
    - when: UNKNOWN
      result: ART6_2_REVIEW_REQUIRED
      next: RUL-043
    primary_legal_anchor:
    - SRC-002#Art.111/Abs.2
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: Art. 111 Abs. 2 Satz 1 knüpft den Bestandsschutz an das Inverkehrbringen oder die Inbetriebnahme vor
      dem für diese Route einschlägigen Anwendungsbeginn nach Art. 113 (02.12.2027). Ein unbekanntes Datum erlaubt
      keine Freigabe.
    dependencies:
    - RUL-044
    replaces: []
    replaced_by: []
  - id: RUL-046
    status: aktiv
    category: AI_ACT_APPLICABILITY
    title:
      de: Signifikante Konzeptionsänderung seit dem Anhang-III-Anwendungsbeginn
      en: Significant design change since the Annex III date of application
    question:
      de: Wurde das vor dem 02.12.2027 in Verkehr gebrachte oder in Betrieb genommene System seit diesem Datum signifikant
        in seiner Konzeption geändert?
      en: Has the design of the system placed on the market or put into service before 2 December 2027 changed significantly
        since that date?
    input_key: annex_iii_significant_design_change_after_application_date
    input_type: enum
    allowed_values:
    - 'YES'
    - 'NO'
    - UNCLEAR
    value_labels:
      'YES':
        de: Ja
        en: 'Yes'
      'NO':
        de: Nein
        en: 'No'
      UNCLEAR:
        de: Unklar
        en: Unclear
    decision_logic: YES ergibt ART6_2_HIGH_RISK und führt zu RUL-043; NO führt zu RUL-047; UNCLEAR ergibt ART6_2_REVIEW_REQUIRED
      und führt zu RUL-043. Die Eingabe gilt ausschließlich für den Stichtag 02.12.2027 und ist von der Produktroute
      mit Stichtag 02.08.2028 getrennt.
    branches:
    - when: 'YES'
      result: ART6_2_HIGH_RISK
      next: RUL-043
    - when: 'NO'
      next: RUL-047
    - when: UNCLEAR
      result: ART6_2_REVIEW_REQUIRED
      next: RUL-043
    primary_legal_anchor:
    - SRC-002#Art.111/Abs.2/Satz.1
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: Art. 111 Abs. 2 Satz 1 verlangt die Prüfung signifikanter Konzeptionsänderungen seit dem einschlägigen
      Anwendungsbeginn. Unterschiedliche Stichtage beider Routen benötigen getrennte Angaben; UNCLEAR ist kein bestätigter
      Bestandsschutz.
    dependencies:
    - RUL-045
    replaces: []
    replaced_by: []
  - id: RUL-047
    status: aktiv
    category: AI_ACT_APPLICABILITY
    title:
      de: Anhang-III-Bestandsystem zur Nutzung durch Behörden
      en: Existing Annex III high-risk system intended for public authorities
    question:
      de: Ist das bestehende Hochrisiko-System zur Nutzung durch Behörden bestimmt?
      en: Is the existing high-risk system intended for use by public authorities?
    input_key: public_authority_intended_use
    input_type: enum
    allowed_values:
    - 'YES'
    - 'NO'
    - UNCLEAR
    value_labels:
      'YES':
        de: Ja
        en: 'Yes'
      'NO':
        de: Nein
        en: 'No'
      UNCLEAR:
        de: Unklar
        en: Unclear
    decision_logic: NO ergibt ART6_2_LEGACY_TRANSITION; YES mit Bewertungsdatum vor 2030-08-02 ergibt ART6_2_LEGACY_TRANSITION_PUBLIC_AUTHORITY
      (Übergang mit Frist 02.08.2030); YES mit Bewertungsdatum ab 2030-08-02 ergibt ART6_2_HIGH_RISK_PUBLIC_AUTHORITY;
      UNCLEAR ergibt ART6_2_REVIEW_REQUIRED. Routenergebnisse führen zu RUL-043.
    branches:
    - when: 'NO'
      result: ART6_2_LEGACY_TRANSITION
      next: RUL-043
    - when: 'YES'
      date_condition:
        input_key: assessment_date
        before: '2030-08-02'
      result: ART6_2_LEGACY_TRANSITION_PUBLIC_AUTHORITY
      next: RUL-043
    - when: 'YES'
      date_condition:
        input_key: assessment_date
        on_or_after: '2030-08-02'
      result: ART6_2_HIGH_RISK_PUBLIC_AUTHORITY
      next: RUL-043
    - when: UNCLEAR
      result: ART6_2_REVIEW_REQUIRED
      next: RUL-043
    primary_legal_anchor:
    - SRC-002#Art.111/Abs.2/Satz.2
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: Für zur Nutzung durch Behörden bestimmte Hochrisiko-Systeme ist die Compliance spätestens bis 02.08.2030
      erforderlich.
    dependencies:
    - RUL-046
    replaces: []
    replaced_by: []

change_history:
  - version: "0.1"
    change: "Katalog angelegt. RUL-001 bis RUL-026 aus den 26 finalen temporären Kandidaten der SRC-004-Research-Adjudikation übernommen (RQ-Q01 bis RQ-Q08 → RUL-001 bis RUL-008, RQ-C01 bis RQ-C12 → RUL-009 bis RUL-020, RQ-M01 bis RQ-M03 → RUL-021 bis RUL-023, RQ-CH01 bis RQ-CH03 → RUL-024 bis RUL-026). Grundlage ist DECISION_LOGIC_SRC_004_MDSW_QUALIFICATION_CLASSIFICATION.md Version 1.0 nach RUL_METHOD.md Version 1.0. Jede RUL trägt einen Primary Legal Anchor (SRC-001 bzw. SRC-010) und getrennt einen Guidance Anchor (SRC-004). Keine RR erzeugt oder geändert."
  - version: "0.2"
    change: "RUL-027 bis RUL-043 für AI-Act-Applicability und Hochrisiko-Routing nach Art. 6 ergänzt (AIA-R01 bis AIA-R11 → RUL-027 bis RUL-037, AIA-R12 → RUL-038, AIA-R13 → RUL-039, Art.-6(3)-Profiling, -Ausnahmebedingung und -Risikoprüfung → RUL-040 bis RUL-042, kombiniertes Art.-6-Routing → RUL-043). Neuer Einstiegspunkt RUL-027; 21 neue Ausgabewerte; Hinweise ART6_4_SELF_ASSESSMENT_OBLIGATIONS_APPLY und ART111_2_PUBLIC_AUTHORITY_COMPLIANCE_BY_2030_08_02. Primary Legal Anchor ausschließlich SRC-002 (konsolidiert 27.07.2026); keine Guidance-Anker. Grundlage ist DECISION_LOGIC_SRC_002_AI_ACT_APPLICABILITY.md Version 1.0 nach RUL_METHOD.md Version 1.1. RUL-001 bis RUL-026 unverändert; keine RR erzeugt oder geändert."
  - version: "0.3"
    change: "R01-4.6-F01 auf Verfasserauftrag vom 04.11.2026: RUL-039 durch RUL-044 ersetzt; RUL-045 bis RUL-047 ergänzen die Anhang-III-Übergangsprüfung nach Art. 111 Abs. 2 mit eigenem Änderungsmerkmal für den Stichtag 02.12.2027 und Behördenfrist 02.08.2030. RUL-040 bis RUL-042 verweisen auf die Ersatzregel; RUL-043 nimmt die neuen Vorgänger auf, Aggregationssemantik unverändert. Keine RR- oder Quellenänderung; historische RUL-Fassung 0.2 und R1/R2 bleiben eingefroren."
