version: "0.3"

entry_points:
  - "RUL-001"
  - "RUL-021"
  - "RUL-024"
  - "RUL-027"

class_order:
  - "I"
  - "IIa"
  - "IIb"
  - "III"

outputs:
  NOT_COVERED_BY_SRC004:
    type: "RESULT"
    class: null
    label:
      de: "Kein Software-Pfad nach SRC-004; eine Erfassung durch die Medizinprodukteverordnungen ist damit nicht ausgeschlossen"
      en: "No software path under SRC-004; coverage by the medical devices regulations is not thereby excluded"
  MEDICAL_DEVICES_REGULATION_SPECIAL_ROUTE:
    type: "RESULT"
    class: null
    label:
      de: "Sonderroute: Anhang-XVI-Produkt, Zubehör oder Software, die ein Medizinprodukt steuert oder beeinflusst; kein eigenständiger MDSW-Pfad"
      en: "Special route: Annex XVI product, accessory or software driving or influencing a medical device; no stand-alone MDSW path"
  NOT_MDSW:
    type: "RESULT"
    class: null
    label:
      de: "Keine Medizinproduktesoftware (MDSW)"
      en: "Not medical device software (MDSW)"
  MDSW:
    type: "RESULT"
    class: null
    label:
      de: "Medizinproduktesoftware (MDSW); MDR/IVDR-Abgrenzung folgt"
      en: "Medical device software (MDSW); MDR/IVDR boundary follows"
  MDR_MDSW:
    type: "RESULT"
    class: null
    label:
      de: "MDSW im Anwendungsbereich der MDR"
      en: "MDSW within the scope of the MDR"
  OUT_OF_SCOPE_IVDR:
    type: "RESULT"
    class: null
    label:
      de: "IVDR-Route; außerhalb des derzeitigen RegScoutX-Scopes, keine MDR-Gap-Auswertung"
      en: "IVDR route; outside the current RegScoutX scope, no MDR gap evaluation"
  BOUNDARY_REVIEW_REQUIRED:
    type: "REVIEW"
    class: null
    label:
      de: "Abgrenzungsprüfung erforderlich: MDR/IVDR-Zuordnung mit den verfügbaren Eingaben nicht belastbar entscheidbar"
      en: "Boundary review required: MDR/IVDR allocation cannot be reliably decided from the available inputs"
  CLASS_OF_DRIVEN_OR_INFLUENCED_DEVICE:
    type: "RESULT"
    class: null
    label:
      de: "Klasse des gesteuerten bzw. beeinflussten Produkts"
      en: "Class of the driven or influenced device"
  OWN_CLASSIFICATION_NOT_BELOW_DRIVEN_DEVICE_CLASS:
    type: "RESULT"
    class: null
    label:
      de: "Eigene Klassifizierung nach der eigenen Zweckbestimmung; Klasse nach Guidance-Auslegung nicht niedriger als die Klasse des gesteuerten Produkts"
      en: "Own classification by own intended purpose; class not lower than the class of the driven device according to guidance interpretation"
  CLASS_I_CANDIDATE:
    type: "CLASS_CANDIDATE"
    class: "I"
    label:
      de: "Klassenkandidat I"
      en: "Class candidate I"
  CLASS_IIA_CANDIDATE:
    type: "CLASS_CANDIDATE"
    class: "IIa"
    label:
      de: "Klassenkandidat IIa"
      en: "Class candidate IIa"
  CLASS_IIB_CANDIDATE:
    type: "CLASS_CANDIDATE"
    class: "IIb"
    label:
      de: "Klassenkandidat IIb"
      en: "Class candidate IIb"
  CLASS_III_CANDIDATE:
    type: "CLASS_CANDIDATE"
    class: "III"
    label:
      de: "Klassenkandidat III"
      en: "Class candidate III"
  RULE_12_HARDWARE_AND_3_3_PATH:
    type: "RESULT"
    class: null
    label:
      de: "Hardware nach Regel 12 zu klassifizieren; Software über Anhang VIII Abschnitt 3.3"
      en: "Hardware to be classified under Rule 12; software via Annex VIII section 3.3"
  FINAL_MDR_CLASS:
    type: "RESULT"
    class: null
    label:
      de: "Finale MDR-Klasse: strengster belastbar ermittelter Klassenkandidat (nur ohne Review-Ausgang auf dem Pfad)"
      en: "Final MDR class: strictest reliably determined class candidate (only without a review outcome on the path)"
  ADDITIONAL_CLASSIFICATION_REVIEW_REQUIRED:
    type: "REVIEW"
    class: null
    label:
      de: "Zusätzliche Klassifizierungsprüfung erforderlich: möglicherweise anwendbare Regel im Kernbaum nicht vollständig modelliert"
      en: "Additional classification review required: possibly applicable rule not fully modelled in the core tree"
  MDSW_MODULE:
    type: "RESULT"
    class: null
    label:
      de: "MDSW-Modul: eigenständige Qualifizierung und risikobasierte Klassifizierung nach eigener medizinischer Zweckbestimmung"
      en: "MDSW module: own qualification and risk-based classification by its own medical purpose"
  NON_MEDICAL_MODULE_NOT_REGULATED_AS_MDSW:
    type: "RESULT"
    class: null
    label:
      de: "Nicht-medizinisches Modul; nicht als MDSW reguliert"
      en: "Non-medical module; not regulated as MDSW"
  NON_MEDICAL_BUT_ASSESSMENT_RELEVANT:
    type: "RESULT"
    class: null
    label:
      de: "Nicht-medizinisches Modul, aber bewertungsrelevant (Architektur, Schnittstellen, Sicherheit, Leistung, Interdependenzen); nicht automatisch MDSW"
      en: "Non-medical module but assessment-relevant (architecture, interfaces, safety, performance, interdependencies); not automatically MDSW"
  INTEGRATED_PRODUCT_ASSESSMENT_REQUIRED:
    type: "RESULT"
    class: null
    label:
      de: "Integriertes Gesamtprodukt: Zweckbestimmung, Gesamtarchitektur und alle anwendbaren Regeln zusätzlich auf das Gesamtprodukt anwenden"
      en: "Integrated overall product: additionally apply intended purpose, overall architecture and all applicable rules to the overall product"
  MODULE_OWN_PURPOSE_CLASSIFICATION:
    type: "RESULT"
    class: null
    label:
      de: "Medizinische Module werden nach ihrer eigenen Zweckbestimmung und ihrem Risiko klassifiziert; keine allgemeine Gesamtklassenregel"
      en: "Medical modules are classified by their own intended purpose and risk; no general overall-class rule"
  REASSESS_QUALIFICATION_CLASSIFICATION:
    type: "RESULT"
    class: null
    label:
      de: "Erneute Prüfung von Qualifizierung und Klassifizierung erforderlich; keine automatische Änderung der Klasse"
      en: "Reassessment of qualification and classification required; no automatic change of class"
  NO_SRC004_REASSESSMENT_TRIGGER:
    type: "RESULT"
    class: null
    label:
      de: "Kein Auslöser einer erneuten Prüfung nach SRC-004"
      en: "No SRC-004-based reassessment trigger"

  AI_ACT_NOT_APPLICABLE:
    type: "RESULT"
    class: null
    label:
      de: "AI Act nicht anwendbar (kein KI-System, kein Art.-2-Anknüpfungspunkt oder einschlägige Art.-2-Ausnahme)"
      en: "AI Act not applicable (no AI system, no Article 2 nexus or relevant Article 2 exclusion)"
  AI_ACT_APPLICABLE_NOT_HIGH_RISK:
    type: "RESULT"
    class: null
    label:
      de: "AI Act anwendbar, kein Hochrisiko-KI-System (Art.-6(1)-Route negativ und Art.-6(2)-Route negativ oder Art.-6(3)-Ausnahme festgestellt)"
      en: "AI Act applicable, not a high-risk AI system (Article 6(1) route negative and Article 6(2) route negative or Article 6(3) derogation established)"
  AI_ACT_HIGH_RISK:
    type: "RESULT"
    class: null
    label:
      de: "Hochrisiko-KI-System; Hochrisiko-Anforderungen wirksam"
      en: "High-risk AI system; high-risk requirements in effect"
  AI_ACT_NOT_YET_APPLICABLE:
    type: "RESULT"
    class: null
    label:
      de: "Hochrisiko-Anforderungsblock noch nicht anwendbar (Anwendungsbeginn nach Art. 113 noch nicht erreicht); betrifft nicht den gesamten AI Act"
      en: "High-risk requirement block not yet applicable (Article 113 date of application not reached); does not concern the entire AI Act"
  AI_ACT_HIGH_RISK_LEGACY_TRANSITION:
    type: "RESULT"
    class: null
    label:
      de: "Hochrisiko-KI-System im Übergang nach Art. 111 Abs. 2 (vor dem Anwendungsbeginn in Verkehr gebracht oder in Betrieb genommen)"
      en: "High-risk AI system in transition under Article 111(2) (placed on the market or put into service before the date of application)"
  AI_ACT_APPLICABILITY_REVIEW_REQUIRED:
    type: "REVIEW"
    class: null
    label:
      de: "Prüfung der AI-Act-Anwendbarkeit erforderlich: Eingaben nicht determinierbar oder ein Hochrisiko-Weg ungeklärt"
      en: "AI Act applicability review required: inputs not determinable or a high-risk route unresolved"
  ART6_1_ROUTE_FALSE:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_APPLICABLE_NOT_HIGH_RISK"
    label:
      de: "Art.-6(1)-Produktroute: kein Hochrisiko"
      en: "Article 6(1) product route: not high-risk"
  ART6_1_REVIEW_REQUIRED:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_APPLICABILITY_REVIEW_REQUIRED"
    label:
      de: "Art.-6(1)-Produktroute: Eingabe nicht determinierbar"
      en: "Article 6(1) product route: input not determinable"
  ART6_1_NOT_YET_APPLICABLE:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_NOT_YET_APPLICABLE"
    applicable_from: "2028-08-02"
    label:
      de: "Art.-6(1)-Produktroute: Hochrisiko-Anforderungen ab 02.08.2028"
      en: "Article 6(1) product route: high-risk requirements from 2 August 2028"
  ART6_1_HIGH_RISK:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_HIGH_RISK"
    applicable_from: "2028-08-02"
    label:
      de: "Art.-6(1)-Produktroute: Hochrisiko wirksam (frühestens ab 02.08.2028)"
      en: "Article 6(1) product route: high-risk in effect (from 2 August 2028 at the earliest)"
  ART6_1_HIGH_RISK_PUBLIC_AUTHORITY:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_HIGH_RISK"
    applicable_from: "2030-08-02"
    label:
      de: "Art.-6(1)-Produktroute: bestehendes Hochrisiko-System zur Nutzung durch Behörden, Hochrisiko wirksam ab 02.08.2030"
      en: "Article 6(1) product route: existing high-risk system intended for public authorities, high-risk in effect from 2 August 2030"
  ART6_1_LEGACY_TRANSITION:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_HIGH_RISK_LEGACY_TRANSITION"
    label:
      de: "Art.-6(1)-Produktroute: Übergang nach Art. 111 Abs. 2 ohne signifikante Konzeptionsänderung"
      en: "Article 6(1) product route: transition under Article 111(2) without significant design change"
  ART6_1_LEGACY_TRANSITION_PUBLIC_AUTHORITY:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_HIGH_RISK_LEGACY_TRANSITION"
    flags: ["ART111_2_PUBLIC_AUTHORITY_COMPLIANCE_BY_2030_08_02"]
    label:
      de: "Art.-6(1)-Produktroute: Übergang nach Art. 111 Abs. 2 für ein zur Nutzung durch Behörden bestimmtes System mit Frist 02.08.2030"
      en: "Article 6(1) product route: transition under Article 111(2) for a system intended for public authorities with deadline 2 August 2030"
  ANNEX_III_MATCH:
    type: "RESULT"
    class: null
    label:
      de: "Anhang-III-Anwendungsfall liegt vor; Art.-6(3)-Prüfung folgt"
      en: "Annex III use case present; Article 6(3) check follows"
  ANNEX_III_HIGH_RISK_CANDIDATE:
    type: "RESULT"
    class: null
    label:
      de: "Anhang-III-Hochrisiko-Kandidat; zeitliche Prüfung nach Art. 113 folgt"
      en: "Annex III high-risk candidate; temporal check under Article 113 follows"
  ART6_2_ROUTE_FALSE:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_APPLICABLE_NOT_HIGH_RISK"
    label:
      de: "Art.-6(2)-Route: kein Anhang-III-Anwendungsfall"
      en: "Article 6(2) route: no Annex III use case"
  ART6_2_REVIEW_REQUIRED:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_APPLICABILITY_REVIEW_REQUIRED"
    label:
      de: "Art.-6(2)-Route: Anhang-III- bzw. Art.-6(3)-Sachverhalt nicht determinierbar"
      en: "Article 6(2) route: Annex III or Article 6(3) facts not determinable"
  ART6_3_NON_HIGH_RISK:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_APPLICABLE_NOT_HIGH_RISK"
    flags: ["ART6_4_SELF_ASSESSMENT_OBLIGATIONS_APPLY"]
    label:
      de: "Art.-6(3)-Ausnahme: Anhang-III-System nicht hochriskant; Pflichten nach Art. 6 Abs. 4"
      en: "Article 6(3) derogation: Annex III system not high-risk; obligations under Article 6(4)"
  ART6_2_NOT_YET_APPLICABLE:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_NOT_YET_APPLICABLE"
    applicable_from: "2027-12-02"
    label:
      de: "Art.-6(2)-Route: Hochrisiko-Anforderungen ab 02.12.2027"
      en: "Article 6(2) route: high-risk requirements from 2 December 2027"
  ART6_2_HIGH_RISK:
    type: "RESULT"
    class: null
    aggregates_to: "AI_ACT_HIGH_RISK"
    applicable_from: "2027-12-02"
    label:
      de: "Art.-6(2)-Route: Hochrisiko wirksam ab 02.12.2027"
      en: "Article 6(2) route: high-risk in effect from 2 December 2027"

  ART6_2_HIGH_RISK_PUBLIC_AUTHORITY:
    type: RESULT
    class: null
    aggregates_to: AI_ACT_HIGH_RISK
    applicable_from: '2030-08-02'
    label:
      de: 'Art.-6(2)-Anhang-III-Route: bestehendes Hochrisiko-System zur Nutzung durch Behörden, Hochrisiko wirksam
        ab 02.08.2030'
      en: 'Article 6(2) Annex III route: existing high-risk system intended for public authorities, high-risk in effect
        from 2 August 2030'
  ART6_2_LEGACY_TRANSITION:
    type: RESULT
    class: null
    aggregates_to: AI_ACT_HIGH_RISK_LEGACY_TRANSITION
    label:
      de: 'Art.-6(2)-Anhang-III-Route: Übergang nach Art. 111 Abs. 2 ohne signifikante Konzeptionsänderung'
      en: 'Article 6(2) Annex III route: transition under Article 111(2) without significant design change'
  ART6_2_LEGACY_TRANSITION_PUBLIC_AUTHORITY:
    type: RESULT
    class: null
    aggregates_to: AI_ACT_HIGH_RISK_LEGACY_TRANSITION
    flags:
    - ART111_2_PUBLIC_AUTHORITY_COMPLIANCE_BY_2030_08_02
    label:
      de: 'Art.-6(2)-Anhang-III-Route: Übergang nach Art. 111 Abs. 2 für ein zur Nutzung durch Behörden bestimmtes
        System mit Frist 02.08.2030'
      en: 'Article 6(2) Annex III route: transition under Article 111(2) for a system intended for public authorities
        with deadline 2 August 2030'

flags:
  ART6_4_SELF_ASSESSMENT_OBLIGATIONS_APPLY:
    label:
      de: "Art. 6 Abs. 4: Bewertung vor dem Inverkehrbringen oder der Inbetriebnahme dokumentieren, Registrierungspflicht nach Art. 49 Abs. 2 erfüllen, Dokumentation auf Verlangen der zuständigen nationalen Behörden vorlegen. Routing-/Compliance-Hinweis, kein Erfüllungsstatus."
      en: "Article 6(4): document the assessment before placing on the market or putting into service, comply with the registration obligation under Article 49(2), provide the documentation upon request of national competent authorities. Routing/compliance note, not a fulfilment status."
    primary_legal_anchor:
      - "SRC-002#Art.6/Abs.4"
      - "SRC-002#Art.49/Abs.2"
  ART111_2_PUBLIC_AUTHORITY_COMPLIANCE_BY_2030_08_02:
    label:
      de: "Art. 111 Abs. 2: Für zur Nutzung durch Behörden bestimmte Hochrisiko-KI-Systeme sind die erforderlichen Compliance-Schritte spätestens bis 02.08.2030 vorzunehmen. Routing-/Compliance-Hinweis, kein Erfüllungsstatus."
      en: "Article 111(2): for high-risk AI systems intended for use by public authorities the necessary compliance steps must be taken by 2 August 2030 at the latest. Routing/compliance note, not a fulfilment status."
    primary_legal_anchor:
      - "SRC-002#Art.111/Abs.2/Satz.2"

rules:
  - id: "RUL-001"
    status: "aktiv"
    category: "QUALIFICATION"
    title:
      de: "Software im Sinne der Guidance"
      en: "Software within the meaning of the guidance"
    question:
      de: "Ist das Produkt Software, also ein Satz von Anweisungen, der Eingabedaten verarbeitet und Ausgabedaten erzeugt?"
      en: "Is the product software, i.e. a set of instructions that processes input data and creates output data?"
    input_key: "is_software"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "Nur Software durchläuft den Qualifikationsbaum nach SRC-004 Figure 1. NEIN bedeutet ausschließlich, dass der Software-Pfad von SRC-004 nicht einschlägig ist; eine Erfassung durch MDR oder IVDR ist damit nicht ausgeschlossen."
    branches:
      - when: true
        next: "RUL-002"
      - when: false
        result: "NOT_COVERED_BY_SRC004"
    primary_legal_anchor:
      - "SRC-001#Art.2/Nr.1"
    guidance_anchor:
      - "SRC-004#Abschnitt 2"
      - "SRC-004#Abschnitt 3.3"
    guidance_detail: "Softwaredefinition in Abschnitt 2; Figure 1, Decision step 1 (Entscheidungsschritte in Abschnitt 3.3)"
    guidance_role: "INTERPRETATIVE"
    rationale: "SRC-001 Art. 2 Nr. 1 nennt Software als mögliches Medizinprodukt. Die operative Softwaredefinition stammt aus der Guidance und ist Guidance-Interpretation, keine eigenständige MDR-Definition."
    dependencies: []
    replaces: []
    replaced_by: []

  - id: "RUL-002"
    status: "aktiv"
    category: "QUALIFICATION"
    title:
      de: "Sonderroute Anhang XVI, Zubehör oder steuernde/beeinflussende Software"
      en: "Special route Annex XVI, accessory or driving/influencing software"
    question:
      de: "Trifft eine der folgenden Konstellationen zu: Die Software ist ein Produkt nach Anhang XVI MDR, sie ist Zubehör eines Medizinprodukts, oder sie steuert ein (Hardware-)Medizinprodukt bzw. beeinflusst dessen Anwendung?"
      en: "Does one of the following apply: the software is an MDR Annex XVI product, it is an accessory for a medical device, or it drives a (hardware) medical device or influences its use?"
    input_key: "special_route"
    input_type: "enum"
    allowed_values: ["ANNEX_XVI", "ACCESSORY", "DRIVES_INFLUENCES", "NONE"]
    value_labels:
      ANNEX_XVI:
        de: "Produkt nach Anhang XVI MDR"
        en: "MDR Annex XVI product"
      ACCESSORY:
        de: "Zubehör eines Medizinprodukts"
        en: "Accessory for a medical device"
      DRIVES_INFLUENCES:
        de: "Software, die ein Medizinprodukt steuert oder dessen Anwendung beeinflusst"
        en: "Software driving or influencing the use of a medical device"
      NONE:
        de: "Keine dieser Konstellationen"
        en: "None of these"
    decision_logic: "ANNEX_XVI, ACCESSORY und DRIVES_INFLUENCES führen in die Sonderroute MEDICAL_DEVICES_REGULATION_SPECIAL_ROUTE; die Software wird im Regulierungsprozess des betreffenden Produkts bzw. als Zubehör betrachtet und nicht in den MDSW-Pfad der Schritte 3 bis 5 gezwungen. Die Klassifizierung steuernder oder beeinflussender Software im MDR-Regime erfolgt über RUL-009. NONE führt zu RUL-003."
    branches:
      - when: "ANNEX_XVI"
        result: "MEDICAL_DEVICES_REGULATION_SPECIAL_ROUTE"
      - when: "ACCESSORY"
        result: "MEDICAL_DEVICES_REGULATION_SPECIAL_ROUTE"
      - when: "DRIVES_INFLUENCES"
        result: "MEDICAL_DEVICES_REGULATION_SPECIAL_ROUTE"
      - when: "NONE"
        next: "RUL-003"
    primary_legal_anchor:
      - "SRC-001#Art.1/Abs.2"
      - "SRC-001#Anh.XVI"
      - "SRC-001#Art.2/Nr.2"
      - "SRC-001#Anh.VIII/Kap.II/Abschn.3.3/Satz.1"
    guidance_anchor:
      - "SRC-004#Abschnitt 3.3"
    guidance_detail: "Figure 1, Decision step 2"
    guidance_role: "INTERPRETATIVE"
    rationale: "Nach SRC-004 Figure 1 Step 2 kann solche Software unabhängig von den Schritten 3 bis 5 unter die Medizinprodukteverordnungen fallen; sie ist als Teil des Produkts bzw. als Zubehör zu betrachten. Dieser Pfad bleibt vom MDSW-Kernpfad getrennt."
    dependencies: ["RUL-001"]
    replaces: []
    replaced_by: []

  - id: "RUL-003"
    status: "aktiv"
    category: "QUALIFICATION"
    title:
      de: "Datenverarbeitung über Basisfunktionen hinaus"
      en: "Data processing beyond basic functions"
    question:
      de: "Führt die Software mit Daten mehr aus als Speichern, Archivieren, Kommunizieren, einfache Suche oder verlustfreie Kompression? Eine Suchfunktion, die zur Erreichung eines medizinischen Zwecks beiträgt, gilt dabei nicht als einfache Suche."
      en: "Does the software do more with data than storage, archival, communication, simple search or lossless compression? A search function that contributes to achieving a medical purpose does not count as simple search."
    input_key: "data_action_type"
    input_type: "enum"
    allowed_values: ["BASIC_ONLY", "BEYOND_BASIC"]
    value_labels:
      BASIC_ONLY:
        de: "Nur Speichern, Archivieren, Kommunizieren, einfache Suche oder verlustfreie Kompression"
        en: "Only storage, archival, communication, simple search or lossless compression"
      BEYOND_BASIC:
        de: "Datenverarbeitung darüber hinaus"
        en: "Data processing beyond that"
    decision_logic: "BASIC_ONLY führt zu NOT_MDSW, BEYOND_BASIC zu RUL-004. Maßgeblich ist die Funktion, nicht die verwendete Technologie: Eine Suchfunktion, die zu einem medizinischen Zweck beiträgt, ist BEYOND_BASIC; der Einsatz einer bestimmten Technik (z. B. NLP) allein entscheidet nicht."
    branches:
      - when: "BASIC_ONLY"
        result: "NOT_MDSW"
      - when: "BEYOND_BASIC"
        next: "RUL-004"
    primary_legal_anchor:
      - "SRC-001#Art.2/Nr.1"
    guidance_anchor:
      - "SRC-004#Abschnitt 3.1"
      - "SRC-004#Abschnitt 3.3"
    guidance_detail: "Figure 1, Decision step 3"
    guidance_role: "INTERPRETATIVE"
    rationale: "SRC-001 Art. 2 Nr. 1 bildet den rechtlichen Qualifikationsrahmen; die operative Abgrenzung rein technischer Datenhaltung und -übertragung stammt aus der Guidance."
    dependencies: ["RUL-002"]
    replaces: []
    replaced_by: []

  - id: "RUL-004"
    status: "aktiv"
    category: "QUALIFICATION"
    title:
      de: "Nutzen für individuelle Patientinnen und Patienten"
      en: "Benefit of individual patients"
    question:
      de: "Erfolgt diese Datenverarbeitung zum Nutzen einzelner Patientinnen und Patienten – und nicht nur zur Aggregation von Populationsdaten, für allgemeine Diagnose- oder Behandlungspfade, Literatur, Atlanten, Modelle, Vorlagen, epidemiologische Studien oder Register?"
      en: "Is this data processing performed for the benefit of individual patients – and not only to aggregate population data, for generic diagnostic or treatment pathways, literature, atlases, models, templates, epidemiological studies or registers?"
    input_key: "individual_patient_benefit"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "NEIN führt zu NOT_MDSW, JA zu RUL-005."
    branches:
      - when: true
        next: "RUL-005"
      - when: false
        result: "NOT_MDSW"
    primary_legal_anchor:
      - "SRC-001#Art.2/Nr.1"
    guidance_anchor:
      - "SRC-004#Abschnitt 3.3"
    guidance_detail: "Figure 1, Decision step 4"
    guidance_role: "INTERPRETATIVE"
    rationale: "Der Patientenbezug operationalisiert die medizinischen Zwecke nach SRC-001 Art. 2 Nr. 1; die Negativbeispiele stammen aus der Guidance."
    dependencies: ["RUL-003"]
    replaces: []
    replaced_by: []

  - id: "RUL-005"
    status: "aktiv"
    category: "QUALIFICATION"
    title:
      de: "Eigener medizinischer Zweck"
      en: "Own medical purpose"
    question:
      de: "Soll die Software selbst einen der in der MDR genannten medizinischen Zwecke erfüllen – z. B. Diagnose, Vorhersage, Überwachung oder Behandlung einer Krankheit?"
      en: "Is the software itself intended to fulfil one of the medical purposes set out in the MDR – e.g. diagnosis, prediction, monitoring or treatment of a disease?"
    input_key: "own_medical_purpose"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "JA ergibt MDSW und führt zur MDR/IVDR-Abgrenzung (RUL-006); NEIN ergibt NOT_MDSW. Maßgeblich ist die Zweckbestimmung des Herstellers, nicht der Einsatzort."
    branches:
      - when: true
        result: "MDSW"
        next: "RUL-006"
      - when: false
        result: "NOT_MDSW"
    primary_legal_anchor:
      - "SRC-001#Art.2/Nr.1"
      - "SRC-001#Art.2/Nr.12"
    guidance_anchor:
      - "SRC-004#Abschnitt 3.1"
      - "SRC-004#Abschnitt 3.3"
    guidance_detail: "Figure 1, Decision step 5"
    guidance_role: "CLARIFIES"
    rationale: "Zentraler MDSW-Qualifikationsschritt: medizinischer Zweck nach SRC-001 Art. 2 Nr. 1 auf Grundlage der Zweckbestimmung nach Art. 2 Nr. 12."
    dependencies: ["RUL-004"]
    replaces: []
    replaced_by: []

  - id: "RUL-006"
    status: "aktiv"
    category: "BOUNDARY"
    title:
      de: "Informationszweck im Sinne der IVD-Definition"
      en: "Information purpose within the IVD definition"
    question:
      de: "Liefert die Software Informationen im Sinne der Definition des In-vitro-Diagnostikums, also zu physiologischen oder pathologischen Prozessen oder Zuständen, kongenitalen körperlichen oder geistigen Beeinträchtigungen, der Prädisposition für einen Gesundheitszustand oder eine Krankheit, der Unbedenklichkeit und Verträglichkeit bei potenziellen Empfängern, der voraussichtlichen Wirkung einer Behandlung oder Reaktionen darauf oder zur Festlegung oder Überwachung therapeutischer Maßnahmen?"
      en: "Does the software provide information within the definition of an in vitro diagnostic medical device, i.e. concerning physiological or pathological processes or states, congenital physical or mental impairments, the predisposition to a medical condition or disease, safety and compatibility with potential recipients, predicted treatment response or reactions, or the definition or monitoring of therapeutic measures?"
    input_key: "ivdr_information_purpose"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "Beginnt erst nach festgestellter MDSW. NEIN ergibt MDR_MDSW und führt zur Klassifizierung (RUL-009); JA führt zu RUL-007."
    branches:
      - when: true
        next: "RUL-007"
      - when: false
        result: "MDR_MDSW"
        next: "RUL-009"
    primary_legal_anchor:
      - "SRC-010#Art.2/Nr.2"
    guidance_anchor:
      - "SRC-004#Abschnitt 3.4"
    guidance_detail: "Figure 2, Decision step 1"
    guidance_role: "CROSSWALK"
    rationale: "Die sechs Informationskategorien stammen aus der rechtsverbindlichen IVD-Definition in SRC-010 Art. 2 Nr. 2; SRC-004 verknüpft sie in Figure 2 mit der MDSW-Qualifikation."
    dependencies: ["RUL-005"]
    replaces: []
    replaced_by: []

  - id: "RUL-007"
    status: "aktiv"
    category: "BOUNDARY"
    title:
      de: "Information ausschließlich aus IVD-Daten"
      en: "Information based solely on IVD data"
    question:
      de: "Beruht die von der Software erzeugte Information ausschließlich auf Daten, die mit In-vitro-Diagnostika gewonnen wurden?"
      en: "Is the information created by the software based solely on data obtained by in vitro diagnostic medical devices?"
    input_key: "information_solely_from_ivd_data"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "JA ergibt OUT_OF_SCOPE_IVDR; NEIN (gemischte Datenquellen aus In-vitro-Diagnostika und Medizinprodukten) führt zu RUL-008."
    branches:
      - when: true
        result: "OUT_OF_SCOPE_IVDR"
      - when: false
        next: "RUL-008"
    primary_legal_anchor:
      - "SRC-010#Art.2/Nr.2"
    guidance_anchor:
      - "SRC-004#Abschnitt 3.4"
    guidance_detail: "Figure 2, Decision step 2"
    guidance_role: "INTERPRETATIVE"
    rationale: "Software, deren Information ausschließlich auf IVD-Daten beruht, ist nach SRC-004 IVD-MDSW; die rechtsverbindliche Grundlage ist die IVD-Definition in SRC-010 Art. 2 Nr. 2."
    dependencies: ["RUL-006"]
    replaces: []
    replaced_by: []

  - id: "RUL-008"
    status: "aktiv"
    category: "BOUNDARY"
    title:
      de: "Dominante Datenquelle bei gemischten Daten"
      en: "Dominant data source for mixed data"
    question:
      de: "Welche Datenquelle bestimmt die Zweckbestimmung der Software wesentlich, gemessen an der Bedeutung der jeweiligen Information für das Erreichen dieser Zweckbestimmung?"
      en: "Which data source substantially drives the intended purpose of the software, judged by the significance of the respective information for achieving that intended purpose?"
    input_key: "dominant_data_source"
    input_type: "enum"
    allowed_values: ["IVD_DOMINANT", "MDR_DOMINANT", "UNCLEAR"]
    value_labels:
      IVD_DOMINANT:
        de: "Wesentlich durch Daten aus In-vitro-Diagnostika bestimmt"
        en: "Substantially driven by data from in vitro diagnostic medical devices"
      MDR_DOMINANT:
        de: "Wesentlich durch Daten aus Medizinprodukten bestimmt"
        en: "Substantially driven by data from medical devices"
      UNCLEAR:
        de: "Belastbare Gewichtung nicht möglich"
        en: "Reliable weighting not possible"
    decision_logic: "Qualitative Gewichtung der Datenquellen nach ihrem Beitrag zur Zweckbestimmung. IVD_DOMINANT ergibt OUT_OF_SCOPE_IVDR, MDR_DOMINANT ergibt MDR_MDSW und führt zur Klassifizierung (RUL-009), UNCLEAR ergibt BOUNDARY_REVIEW_REQUIRED. Es wird kein numerischer Schwellenwert verwendet."
    branches:
      - when: "IVD_DOMINANT"
        result: "OUT_OF_SCOPE_IVDR"
      - when: "MDR_DOMINANT"
        result: "MDR_MDSW"
        next: "RUL-009"
      - when: "UNCLEAR"
        result: "BOUNDARY_REVIEW_REQUIRED"
        review_cause:
          de: "Die Gewichtung der IVD- und MDR-Datenquellen für die Zweckbestimmung ist nicht belastbar bestimmbar; SRC-004 gibt bewusst keinen numerischen Schwellenwert vor."
          en: "The weighting of IVD and MDR data sources for the intended purpose cannot be reliably determined; SRC-004 deliberately provides no numerical threshold."
    primary_legal_anchor:
      - "SRC-010#Art.2/Nr.2"
      - "SRC-001#Art.2/Nr.1"
    guidance_anchor:
      - "SRC-004#Abschnitt 3.4"
    guidance_detail: "Figure 2, Decision step 3; qualitative Gewichtung nach Fußnote 26"
    guidance_role: "INTERPRETATIVE"
    rationale: "Bei gemischten Daten erfüllt die Ausgabe sowohl die MDR- als auch die IVD-Definition; die Guidance verlangt eine qualitative Gewichtung. Ohne belastbare Gewichtung wird nicht geraten."
    dependencies: ["RUL-007"]
    replaces: []
    replaced_by: []

  - id: "RUL-009"
    status: "aktiv"
    category: "CLASSIFICATION"
    title:
      de: "Steuernde oder beeinflussende Software nach Anhang VIII Abschnitt 3.3"
      en: "Driving or influencing software under Annex VIII section 3.3"
    question:
      de: "Steuert die Software ein (Hardware-)Medizinprodukt oder beeinflusst sie dessen Anwendung – und wenn ja, hat sie daneben einen eigenen medizinischen Zweck?"
      en: "Does the software drive a (hardware) medical device or influence its use – and if so, does it additionally have its own medical purpose?"
    input_key: "drives_or_influences_device"
    input_type: "enum"
    allowed_values: ["NONE", "WITHOUT_OWN_MEDICAL_PURPOSE", "WITH_OWN_MEDICAL_PURPOSE"]
    value_labels:
      NONE:
        de: "Steuert oder beeinflusst kein Medizinprodukt"
        en: "Does not drive or influence a medical device"
      WITHOUT_OWN_MEDICAL_PURPOSE:
        de: "Steuert oder beeinflusst ein Medizinprodukt, ohne eigenen medizinischen Zweck"
        en: "Drives or influences a medical device, without its own medical purpose"
      WITH_OWN_MEDICAL_PURPOSE:
        de: "Steuert oder beeinflusst ein Medizinprodukt und hat einen eigenen medizinischen Zweck"
        en: "Drives or influences a medical device and has its own medical purpose"
    decision_logic: "Einstieg in die MDR-Klassifizierung nach MDR_MDSW; zugleich Klassifizierungspunkt für Software im MDR-Regime, die ein Medizinprodukt steuert oder beeinflusst. NONE führt zu Regel 11 (RUL-010). WITHOUT_OWN_MEDICAL_PURPOSE: Die Software fällt in dieselbe Klasse wie das gesteuerte bzw. beeinflusste Produkt; da dessen Klasse nach Regeln bestimmt wird, die im Kernbaum nicht vollständig modelliert sind, wird keine finale Klasse ausgegeben. WITH_OWN_MEDICAL_PURPOSE: eigene Klassifizierung nach der eigenen Zweckbestimmung (weiter mit RUL-010); nach Guidance-Auslegung soll die resultierende Klasse nicht niedriger sein als die Klasse des Hardwareprodukts (max(Klasse aus eigener Zweckbestimmung, Klasse des gesteuerten Produkts)); diese max-Operationalisierung ist GUIDANCE_INTERPRETATION. Weil die Hardwareklasse nicht modelliert ist, wird der Review-Ausgang bis zur Aggregation mitgeführt."
    branches:
      - when: "NONE"
        next: "RUL-010"
      - when: "WITHOUT_OWN_MEDICAL_PURPOSE"
        result: "CLASS_OF_DRIVEN_OR_INFLUENCED_DEVICE"
        review: "ADDITIONAL_CLASSIFICATION_REVIEW_REQUIRED"
        review_cause:
          de: "Die Klasse des gesteuerten bzw. beeinflussten Produkts ergibt sich aus den für dieses Produkt anwendbaren Regeln (z. B. Regeln 9, 10 oder 12), die im horizontalen Kernbaum nicht vollständig modelliert sind."
          en: "The class of the driven or influenced device follows from the rules applicable to that device (e.g. Rules 9, 10 or 12), which are not fully modelled in the horizontal core tree."
      - when: "WITH_OWN_MEDICAL_PURPOSE"
        result: "OWN_CLASSIFICATION_NOT_BELOW_DRIVEN_DEVICE_CLASS"
        next: "RUL-010"
        basis: "GUIDANCE_INTERPRETATION"
        review: "ADDITIONAL_CLASSIFICATION_REVIEW_REQUIRED"
        review_cause:
          de: "Die Untergrenze aus der Klasse des gesteuerten Hardwareprodukts (Guidance-Auslegung zu Anhang VIII Abschnitt 3.3) kann nicht bestimmt werden, weil die Hardwareklassifizierung im Kernbaum nicht vollständig modelliert ist."
          en: "The floor given by the class of the driven hardware device (guidance interpretation of Annex VIII section 3.3) cannot be determined because hardware classification is not fully modelled in the core tree."
    primary_legal_anchor:
      - "SRC-001#Anh.VIII/Kap.II/Abschn.3.3/Satz.1"
      - "SRC-001#Anh.VIII/Kap.II/Abschn.3.3/Satz.2"
    guidance_anchor:
      - "SRC-004#Abschnitt 4.1"
    guidance_detail: null
    guidance_role: "INTERPRETATIVE"
    rationale: "Anhang VIII Abschnitt 3.3 Satz 1 ordnet steuernde oder beeinflussende Software der Klasse des Produkts zu; Satz 2 verlangt für unabhängige Software eine eigene Klassifizierung. Die Untergrenze aus der Hardwareklasse bei eigenem medizinischem Zweck ist Guidance-Auslegung und kein wörtlicher Primärrechtstext."
    dependencies: ["RUL-002", "RUL-006", "RUL-008"]
    replaces: []
    replaced_by: []

  - id: "RUL-010"
    status: "aktiv"
    category: "CLASSIFICATION"
