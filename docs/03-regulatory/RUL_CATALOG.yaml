  - id: "RUL-027"
    status: "aktiv"
    category: "AI_ACT_APPLICABILITY"
    title:
      de: "KI-System nach Art. 3 Nr. 1"
      en: "AI system under Article 3(1)"
    question:
      de: "Erfüllt das System die Definition eines KI-Systems?"
      en: "Does the system meet the definition of an AI system?"
    input_key: "ai_system_status"
    input_type: "enum"
    allowed_values: ["YES", "NO", "UNCLEAR"]
    value_labels:
      "YES": {de: "Ja", en: "Yes"}
      "NO": {de: "Nein", en: "No"}
      UNCLEAR: {de: "Unklar", en: "Unclear"}
    decision_logic: "YES führt zu RUL-028; NO ergibt AI_ACT_NOT_APPLICABLE; UNCLEAR ergibt AI_ACT_APPLICABILITY_REVIEW_REQUIRED. Ohne KI-System kein AI-Act-KI-System-Routing."
    branches:
      - when: "YES"
        next: "RUL-028"
      - when: "NO"
        result: "AI_ACT_NOT_APPLICABLE"
      - when: "UNCLEAR"
        result: "AI_ACT_APPLICABILITY_REVIEW_REQUIRED"
        review_cause:
          de: "Ob das System die Definition eines KI-Systems nach Art. 3 Nr. 1 erfüllt, ist nicht determinierbar."
          en: "Whether the system meets the definition of an AI system under Article 3(1) cannot be determined."
    primary_legal_anchor:
