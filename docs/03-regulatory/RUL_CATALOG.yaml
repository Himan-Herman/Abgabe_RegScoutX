      PRE_MARKET_R_AND_D_NOT_REAL_WORLD: {de: "Forschung, Test oder Entwicklung vor dem Inverkehrbringen, nicht unter Realbedingungen", en: "Research, testing or development before placing on the market, not under real-world conditions"}
