    replaced_by: []

  - id: "RUL-018"
    status: "aktiv"
    category: "CLASSIFICATION"
    title:
      de: "Regel 12 und Abschnitt 3.3: Steuerung eines Produkts zur Stoffabgabe oder -entfernung"
      en: "Rule 12 and section 3.3: driving a device administering or removing substances"
    question:
      de: "Steuert die Software ein aktives Produkt, das Arzneimittel, Körperflüssigkeiten oder andere Stoffe an den Körper abgibt oder aus ihm entfernt, oder beeinflusst sie dessen Anwendung?"
      en: "Does the software drive, or influence the use of, an active device intended to administer and/or remove medicinal products, body liquids or other substances to or from the body?"
    input_key: "drives_substance_administration_or_removal_device"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "Software selbst kann keine Stoffe physisch abgeben oder entfernen. JA: Die Hardware ist nach Regel 12 zu klassifizieren, die Software über Abschnitt 3.3; da die Hardwareklassifizierung im Kernbaum nicht modelliert ist, wird der Review-Ausgang bis zur Aggregation mitgeführt. Es wird keine künstliche Regel-12-Klasse für unabhängige Software erzeugt. In beiden Fällen weiter mit RUL-019."
    branches:
      - when: true
        result: "RULE_12_HARDWARE_AND_3_3_PATH"
        next: "RUL-019"
        review: "ADDITIONAL_CLASSIFICATION_REVIEW_REQUIRED"
        review_cause:
          de: "Hardware-Konstellation: Die Klasse des Produkts nach Regel 12 und die daraus nach Abschnitt 3.3 folgende Softwareklasse sind im Kernbaum nicht vollständig modelliert."
          en: "Hardware constellation: the class of the device under Rule 12 and the resulting software class under section 3.3 are not fully modelled in the core tree."
      - when: false
        next: "RUL-019"
    primary_legal_anchor:
      - "SRC-001#Anh.VIII/Kap.III/Abschn.6.4/Regel.12"
      - "SRC-001#Anh.VIII/Kap.II/Abschn.3.3/Satz.1"
    guidance_anchor:
      - "SRC-004#Abschnitt 4.2.2"
    guidance_detail: null
    guidance_role: "INTERPRETATIVE"
    rationale: "Regel 12 wird für Software insbesondere relevant, wenn sie ein entsprechendes Hardwareprodukt steuert oder beeinflusst."
    dependencies: ["RUL-017"]
    replaces: []
    replaced_by: []

  - id: "RUL-019"
    status: "aktiv"
    category: "CLASSIFICATION"
    title:
      de: "Regel 13: alle anderen aktiven Produkte"
      en: "Rule 13: all other active devices"
    question:
      de: "Keine Nutzerfrage; ergibt sich aus dem bisherigen Regelpfad."
      en: "No user question; follows from the preceding rule path."
    input_key: "other_active_device_rule_applicable"
    input_type: "derived"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "Der abgeleitete Wert ist true, wenn auf dem Pfad bereits eine andere Regel für aktive Produkte einen Klassenkandidaten oder einen Hardwarepfad ergeben hat (im Kernbaum stets Regel 11); dann entsteht kein weiterer Kandidat. Nur wenn keine andere Regel greift (false), ergibt Regel 13 Klassenkandidat I. In beiden Fällen weiter mit RUL-020."
    branches:
      - when: true
        next: "RUL-020"
      - when: false
        result: "CLASS_I_CANDIDATE"
        next: "RUL-020"
    primary_legal_anchor:
      - "SRC-001#Anh.VIII/Kap.III/Abschn.6.5/Regel.13"
    guidance_anchor:
      - "SRC-004#Abschnitt 4.2.3"
    guidance_detail: null
    guidance_role: "INTERPRETATIVE"
    rationale: "Regel 13 ist Auffangregel für sonstige aktive Produkte und führt regelmäßig zu keiner Verschärfung gegenüber 11c."
    dependencies: ["RUL-018"]
    replaces: []
    replaced_by: []

  - id: "RUL-020"
    status: "aktiv"
    category: "CLASSIFICATION"
    title:
      de: "Aggregation nach Anhang VIII Abschnitt 3.5"
      en: "Aggregation under Annex VIII section 3.5"
    question:
      de: "Können für das Produkt weitere MDR-Klassifizierungsregeln anwendbar sein, die hier nicht abgefragt wurden – etwa Regeln 9 oder 10 bei Hardware- oder Kombinationsprodukten?"
      en: "Could further MDR classification rules not asked here apply to the product – for example Rules 9 or 10 for hardware or combination products?"
    input_key: "further_unmodelled_rule_possibly_applicable"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "JA ergibt ADDITIONAL_CLASSIFICATION_REVIEW_REQUIRED. NEIN: Wurde auf dem Pfad ein Review-Ausgang mitgeführt, ist das Ergebnis ADDITIONAL_CLASSIFICATION_REVIEW_REQUIRED; andernfalls ist die finale MDR-Klasse der strengste Klassenkandidat des Pfads nach class_order (FINAL_MDR_CLASS). Mehrere Kandidaten überschreiben sich nicht gegenseitig."
    branches:
      - when: true
        result: "ADDITIONAL_CLASSIFICATION_REVIEW_REQUIRED"
        review_cause:
          de: "Eine möglicherweise anwendbare MDR-Klassifizierungsregel (z. B. Regel 9 oder 10 bei Hardware- oder Kombinationsprodukten) ist im horizontalen Kernbaum nicht vollständig modelliert."
          en: "A possibly applicable MDR classification rule (e.g. Rule 9 or 10 for hardware or combination products) is not fully modelled in the horizontal core tree."
      - when: false
        result: "FINAL_MDR_CLASS"
    primary_legal_anchor:
      - "SRC-001#Anh.VIII/Kap.II/Abschn.3.5"
    guidance_anchor:
      - "SRC-004#Abschnitt 4.1"
      - "SRC-004#Abschnitt 4.2"
    guidance_detail: null
    guidance_role: "CLARIFIES"
    rationale: "Nach Anhang VIII Abschnitt 3.5 gilt bei mehreren anwendbaren Regeln oder Unterregeln die strengste, sodass das Produkt in die höchste Klasse eingestuft wird. Die Guidance weist darauf hin, dass für aktive Produkte die Regeln 9, 10, 11, 12, 13, 15 und 22 zu berücksichtigen sein können; Regeln 9 und 10 werden nicht als horizontaler Software-Kernbaum modelliert."
    dependencies: ["RUL-019"]
    replaces: []
    replaced_by: []

  - id: "RUL-021"
    status: "aktiv"
    category: "MODULES"
    title:
      de: "Modul mit eigenem medizinischem Zweck"
      en: "Module with its own medical purpose"
    question:
      de: "Soll dieses Modul selbst einen medizinischen Zweck erfüllen?"
      en: "Is this module itself intended to fulfil a medical purpose?"
    input_key: "module_has_own_medical_purpose"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "Je Modul zu beantworten. JA ergibt MDSW_MODULE: Das Modul wird selbst über den Qualifikationsbaum (ab RUL-001) qualifiziert und nach seiner eigenen Zweckbestimmung klassifiziert; weiter mit RUL-023. NEIN führt zu RUL-022."
    branches:
      - when: true
        result: "MDSW_MODULE"
        next: "RUL-023"
      - when: false
        next: "RUL-022"
    primary_legal_anchor:
      - "SRC-001#Art.2/Nr.1"
      - "SRC-001#Art.2/Nr.12"
    guidance_anchor:
      - "SRC-004#Abschnitt 7"
    guidance_detail: null
    guidance_role: "INTERPRETATIVE"
    rationale: "Module mit medizinischem Zweck fallen in den Anwendungsbereich der Medizinprodukteverordnungen; Module ohne medizinischen Zweck nicht."
    dependencies: []
    replaces: []
    replaced_by: []

  - id: "RUL-022"
    status: "aktiv"
    category: "MODULES"
    title:
      de: "Bewertungsrelevanz nicht-medizinischer Module"
      en: "Assessment relevance of non-medical modules"
    question:
      de: "Ist das nicht-medizinische Modul für den Betrieb der medizinischen Software erforderlich, oder kann es deren Sicherheit oder Leistung beeinflussen?"
      en: "Is the non-medical module required for the operation of the medical software, or can it affect its safety or performance?"
    input_key: "non_medical_module_required_or_affects_safety_performance"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "JA ergibt NON_MEDICAL_BUT_ASSESSMENT_RELEVANT: Das Modul wird dadurch nicht automatisch MDSW, ist aber in Beschreibung, Architektur-, Schnittstellen-, Sicherheits-, Leistungs- und Interdependenzbewertung zu berücksichtigen. NEIN ergibt NON_MEDICAL_MODULE_NOT_REGULATED_AS_MDSW."
    branches:
      - when: true
        result: "NON_MEDICAL_BUT_ASSESSMENT_RELEVANT"
      - when: false
        result: "NON_MEDICAL_MODULE_NOT_REGULATED_AS_MDSW"
    primary_legal_anchor:
      - "SRC-001#Art.2/Nr.1"
    guidance_anchor:
      - "SRC-004#Abschnitt 7"
    guidance_detail: null
    guidance_role: "INTERPRETATIVE"
    rationale: "Nach der Guidance muss die Gesamtkonfiguration einschließlich Schnittstellen nachweislich sicher sein und darf die Leistung der MDSW nicht beeinträchtigen; der Hersteller bewertet Architektur, Eingangsdatenwege, Ausgabedarstellung und Interdependenzen."
    dependencies: ["RUL-021"]
    replaces: []
    replaced_by: []

  - id: "RUL-023"
    status: "aktiv"
    category: "MODULES"
    title:
      de: "Integriertes Gesamtprodukt aus medizinischen Modulen"
      en: "Integrated overall product of medical modules"
    question:
      de: "Werden die medizinischen Module gemeinsam als ein integriertes Produkt in Verkehr gebracht?"
      en: "Are the medical modules placed on the market together as one integrated product?"
    input_key: "medical_modules_placed_on_market_as_integrated_product"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "JA ergibt INTEGRATED_PRODUCT_ASSESSMENT_REQUIRED: Zweckbestimmung, Gesamtarchitektur und alle anwendbaren Regeln werden zusätzlich auf das Gesamtprodukt angewendet, einschließlich Anhang VIII Abschnitt 3.5. NEIN ergibt MODULE_OWN_PURPOSE_CLASSIFICATION. Es gibt keine allgemeine Regel, nach der die Gesamtklasse der höchsten Modulklasse entspricht."
    branches:
      - when: true
        result: "INTEGRATED_PRODUCT_ASSESSMENT_REQUIRED"
      - when: false
        result: "MODULE_OWN_PURPOSE_CLASSIFICATION"
    primary_legal_anchor:
      - "SRC-001#Art.2/Nr.12"
      - "SRC-001#Anh.VIII/Kap.II/Abschn.3.1"
      - "SRC-001#Anh.VIII/Kap.II/Abschn.3.5"
    guidance_anchor:
      - "SRC-004#Abschnitt 7"
    guidance_detail: null
    guidance_role: "INTERPRETATIVE"
    rationale: "SRC-004 enthält keine allgemeine Regel, nach der die Gesamtsoftwareklasse der höchsten Modulklasse entspricht; für ein als ein Medizinprodukt in Verkehr gebrachtes Gesamtprodukt sind dessen Zweckbestimmung, die anwendbaren Regeln und Abschnitt 3.5 maßgeblich."
    dependencies: ["RUL-021"]
    replaces: []
    replaced_by: []

  - id: "RUL-024"
    status: "aktiv"
    category: "CHANGE_REASSESSMENT"
    title:
      de: "Änderung an Funktion, Zweckbestimmung, wesentlichem Design oder Herstellungsmerkmalen"
      en: "Change to function, intended purpose, essential design or manufacturing characteristics"
    question:
      de: "Betrifft die Änderung die Funktion, die Zweckbestimmung, das wesentliche Design oder Herstellungsmerkmale der Software?"
      en: "Does the change affect the function, intended purpose, essential design or manufacturing characteristics of the software?"
    input_key: "change_affects_function_purpose_design_or_manufacturing"
    input_type: "boolean"
    allowed_values: [true, false]
    value_labels: null
    decision_logic: "JA ergibt REASSESS_QUALIFICATION_CLASSIFICATION (Qualifikationsbaum, bei Bedarf MDR/IVDR-Abgrenzung und Klassifizierung erneut durchlaufen); NEIN führt zu RUL-025. Die erneute Prüfung bedeutet keine automatische Änderung von Qualifikation oder Klasse. Die wesentliche Änderung nach dem AI Act ist davon getrennt und wird hier nicht abgeleitet."
    branches:
      - when: true
        result: "REASSESS_QUALIFICATION_CLASSIFICATION"
      - when: false
        next: "RUL-025"
    primary_legal_anchor:
      - "SRC-001#Art.2/Nr.1"
      - "SRC-001#Art.2/Nr.12"
      - "SRC-001#Anh.VIII/Kap.II/Abschn.3.1"
    guidance_anchor:
      - "SRC-004#Abschnitt 8"
    guidance_detail: null
    guidance_role: "INTERPRETATIVE"
    rationale: "Nach SRC-004 Abschnitt 8 bewerten Hersteller die Auswirkungen von Änderungen an Funktion, Zweckbestimmung, wesentlichem Design und Herstellungsmerkmalen auf Qualifikation und Klassifikation; Qualifikation und Klassifizierung richten sich nach der Zweckbestimmung."
    dependencies: []
    replaces: []
    replaced_by: []

