    input_key: "annex_i_product_relation"
    input_type: "enum"
    allowed_values: ["AI_SYSTEM_IS_PRODUCT", "AI_COMPONENT_OF_PRODUCT", "NEITHER", "UNCLEAR"]
    value_labels:
      AI_SYSTEM_IS_PRODUCT: {de: "Das KI-System ist selbst das MDR-Produkt", en: "The AI system is itself the MDR product"}
      AI_COMPONENT_OF_PRODUCT: {de: "Das KI-System ist Bestandteil eines MDR-Produkts", en: "The AI system is a component of an MDR product"}
      NEITHER: {de: "Weder noch", en: "Neither"}
      UNCLEAR: {de: "Unklar", en: "Unclear"}
    decision_logic: "Beginn der Art.-6(1)-Produktroute. AI_SYSTEM_IS_PRODUCT führt zu RUL-032 (Produktalternative nach Art. 6 Abs. 1 Buchst. a; Abs. 1a/1b nicht erforderlich); AI_COMPONENT_OF_PRODUCT führt zu RUL-031; NEITHER ergibt ART6_1_ROUTE_FALSE; UNCLEAR ergibt ART6_1_REVIEW_REQUIRED. Jedes Routenergebnis führt zur Art.-6(2)-Route (RUL-038)."
    branches:
      - when: "AI_SYSTEM_IS_PRODUCT"
        next: "RUL-032"
      - when: "AI_COMPONENT_OF_PRODUCT"
        next: "RUL-031"
      - when: "NEITHER"
        result: "ART6_1_ROUTE_FALSE"
        next: "RUL-038"
      - when: "UNCLEAR"
        result: "ART6_1_REVIEW_REQUIRED"
        next: "RUL-038"
    primary_legal_anchor:
      - "SRC-002#Art.6/Abs.1/Buchst.a"
      - "SRC-002#Anh.I/Abschn.A/Nr.11"
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Art. 6 Abs. 1 Buchst. a enthält zwei alternative Wege: das KI-System ist selbst ein Produkt nach Anhang-I-Recht oder Sicherheitsbauteil eines solchen Produkts. Die MDR steht in Anhang I Abschnitt A Nr. 11."
    dependencies: ["RUL-029"]
    replaces: []
    replaced_by: []

  - id: "RUL-031"
    status: "aktiv"
    category: "AI_ACT_APPLICABILITY"
    title:
      de: "Sicherheitsbauteil nach Art. 6 Abs. 1a und 1b"
      en: "Safety component under Article 6(1a) and (1b)"
    question:
      de: "Qualifiziert die KI-Komponente als Sicherheitsbauteil?"
      en: "Does the AI component qualify as a safety component?"
    input_key: "safety_component_assessment"
    input_type: "enum"
    allowed_values: ["FAILURE_ENDANGERS_HEALTH_OR_SAFETY", "SOLE_NON_SAFETY_PURPOSE", "OTHER_SAFETY_COMPONENT", "NOT_SAFETY_COMPONENT", "UNCLEAR"]
    value_labels:
      FAILURE_ENDANGERS_HEALTH_OR_SAFETY: {de: "Ausfall oder Fehlfunktion führt zu einer Gefährdung von Gesundheit oder Sicherheit (Abs. 1b)", en: "Failure or malfunction leads to a risk to health or safety (paragraph 1b)"}
      SOLE_NON_SAFETY_PURPOSE: {de: "Dient ausschließlich nicht sicherheitsbezogenen Aspekten wie Nutzerunterstützung, Leistungsoptimierung, Serviceeffizienz, Automatisierung, Komfort oder Qualitätskontrolle, ohne Gefährdung nach Abs. 1b (Abs. 1a)", en: "Serves exclusively non-safety aspects such as user assistance, performance optimisation, service efficiency, automation, comfort or quality control, without a risk under paragraph 1b (paragraph 1a)"}
      OTHER_SAFETY_COMPONENT: {de: "Sonstiges Sicherheitsbauteil", en: "Other safety component"}
      NOT_SAFETY_COMPONENT: {de: "Kein Sicherheitsbauteil", en: "Not a safety component"}
      UNCLEAR: {de: "Unklar", en: "Unclear"}
    decision_logic: "Kontrollierte Kodierung der Entscheidungstabelle aus der Adjudikation mit Vorrang von Abs. 1b vor Abs. 1a: FAILURE_ENDANGERS_HEALTH_OR_SAFETY führt zu RUL-032; SOLE_NON_SAFETY_PURPOSE (ausschließlich nicht sicherheitsbezogen und keine Gefährdung) ergibt ART6_1_ROUTE_FALSE; OTHER_SAFETY_COMPONENT führt zu RUL-032; NOT_SAFETY_COMPONENT ergibt ART6_1_ROUTE_FALSE, weil die Bauteilalternative des Art. 6 Abs. 1 Buchst. a nicht erfüllt ist; UNCLEAR ergibt ART6_1_REVIEW_REQUIRED. Routenergebnisse führen zu RUL-038."
    branches:
      - when: "FAILURE_ENDANGERS_HEALTH_OR_SAFETY"
        next: "RUL-032"
      - when: "SOLE_NON_SAFETY_PURPOSE"
        result: "ART6_1_ROUTE_FALSE"
        next: "RUL-038"
      - when: "OTHER_SAFETY_COMPONENT"
        next: "RUL-032"
      - when: "NOT_SAFETY_COMPONENT"
        result: "ART6_1_ROUTE_FALSE"
        next: "RUL-038"
      - when: "UNCLEAR"
        result: "ART6_1_REVIEW_REQUIRED"
        next: "RUL-038"
    primary_legal_anchor:
      - "SRC-002#Art.6/Abs.1a"
      - "SRC-002#Art.6/Abs.1b"
    guidance_anchor: []
    guidance_detail: null
    guidance_role: null
    rationale: "Abs. 1a nimmt ausschließlich nicht sicherheitsbezogene KI-Systeme vom Begriff des Sicherheitsbauteils aus; Abs. 1b geht dieser Ausschlusswirkung vor, wenn Ausfall oder Fehlfunktion Gesundheit oder Sicherheit gefährdet."
    dependencies: ["RUL-030"]
    replaces: []
    replaced_by: []

