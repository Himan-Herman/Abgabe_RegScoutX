      de: "Das System muss eine Abweichung zwischen den fixierten Katalogversionen einer Bewertung und den aktuell geladenen Katalogen erkennen und darf die Bewertung nicht still neu auswerten."
      en: "The system shall detect a mismatch between the pinned catalog versions of an assessment and the currently loaded catalogs and shall not silently re-evaluate the assessment."
    acceptance_criterion:
      de: "Beim Öffnen einer Bewertung mit abweichender Katalogversion wird die Abweichung angezeigt und als CATALOG_VERSION_MISMATCH_DETECTED protokolliert."
      en: "Opening an assessment with a differing catalog version shows the mismatch and logs it as CATALOG_VERSION_MISMATCH_DETECTED."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["ASSESSMENT_SERVICE", "CATALOG_REPOSITORY", "PRESENTATION"]
    rationale: "DOCUMENTATION_CONVENTIONS.md Abschnitt 4 verlangt bei Fassungsänderungen eine Impact-Prüfung statt stiller Übernahme."
    replaces: []
    replaced_by: []

  - id: "SR-038"
    status: "aktiv"
    group: "NON_FUNCTIONAL"
    title:
      de: "Modulare Architektur mit Abhängigkeitsregeln"
      en: "Modular architecture with dependency rules"
    statement:
      de: "Das System muss aus den festgelegten Architekturmodulen bestehen, die nur die zugelassenen Abhängigkeiten nutzen."
      en: "The system shall consist of the defined architecture modules, which use only the permitted dependencies."
    acceptance_criterion:
      de: "Eine Abhängigkeitsanalyse zeigt keine Abhängigkeit außerhalb der Regeln in ARCHITECTURE.md Abschnitt 4, insbesondere keine Abhängigkeit einer Engine von PRESENTATION."
      en: "A dependency analysis shows no dependency outside the rules in ARCHITECTURE.md section 4, in particular no dependency of an engine on PRESENTATION."
    verification_method: "ANALYSIS"
    derived_from:
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
      - "EXPOSE_SCOPE.md#status-und-zweck-dieses-dokuments"
    allocated_modules: ["CATALOG_REPOSITORY", "ASSESSMENT_SERVICE", "ASSESSMENT_REPOSITORY", "RULE_ENGINE", "APPLICABILITY_ENGINE", "REQUIREMENT_SERVICE", "GAP_ENGINE", "EVIDENCE_SERVICE", "REPORTING", "I18N", "AUDIT_LOG", "PRESENTATION", "APPLICATION_API"]
    rationale: "Geringe Kopplung und hohe Kohäsion nach den Projektvorgaben; Voraussetzung für Wartbarkeit."
    replaces: []
    replaced_by: []

  - id: "SR-039"
    status: "aktiv"
    group: "NON_FUNCTIONAL"
    title:
      de: "Testbarkeit der Entscheidungsmodule ohne Oberfläche"
      en: "Testability of the decision modules without user interface"
    statement:
      de: "Das System muss Regel-, Applicability- und Gap-Logik ohne Oberfläche automatisiert testbar bereitstellen."
      en: "The system shall provide the rule, applicability and gap logic so that it can be tested automatically without a user interface."
    acceptance_criterion:
      de: "Die regelbasierten Testfälle unter docs/07-testing laufen automatisiert gegen die RULE_ENGINE ohne PRESENTATION und liefern die Soll-Ergebnisse."
      en: "The rule-based test cases under docs/07-testing run automatically against the RULE_ENGINE without PRESENTATION and yield the expected results."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#5-geplante-evaluation"
    allocated_modules: ["RULE_ENGINE", "APPLICABILITY_ENGINE", "GAP_ENGINE"]
    rationale: "Die Logikverifikation anhand definierter Testfälle ist Teil der geplanten Evaluation."
    replaces: []
    replaced_by: []

  - id: "SR-040"
    status: "aktiv"
    group: "QUALIFICATION_CLASSIFICATION"
    title:
      de: "Konsistente Neuberechnung nach Eingabeänderung"
      en: "Consistent recomputation after an input change"
    statement:
      de: "Das System muss nach Änderung einer bereits verwendeten Eingabe alle davon abhängigen Entscheidungs-, Anwendbarkeits- und Gap-Ergebnisse deterministisch aus dem aktuellen Eingabestand neu bestimmen und darf Eingaben, die auf dem geänderten Entscheidungspfad nicht mehr erreicht werden oder nicht mehr entscheidungsrelevant sind, nicht als Entscheidungsgrundlage verwenden."
      en: "After a change to an input already used, the system shall deterministically recompute all dependent decision, applicability and gap results from the current input state and shall not use inputs that are no longer reached on the changed decision path or are no longer decision-relevant as a basis for decisions."
    acceptance_criterion:
      de: "Nach einer Eingabeänderung sind DecisionResults, ApplicableRequirements und Gap-Zusammenfassung identisch mit einer vollständigen Neuauswertung des geänderten Eingabestands gegen dieselbe Katalogversion; nicht mehr erreichte Eingaben erscheinen in keiner RuleExecution und in keinem relevant_inputs; bereits erfasste Erfüllungsbewertungen werden nicht still verworfen, und die Änderung ist im Audit-Protokoll nachvollziehbar."
      en: "After an input change, DecisionResults, ApplicableRequirements and the gap summary are identical to a complete re-evaluation of the changed input state against the same catalog version; inputs no longer reached appear in no RuleExecution and in no relevant_inputs; fulfilment assessments already recorded are not silently discarded, and the change is traceable in the audit log."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
      - "STATE_OF_THE_ART.md#DI-005"
    allocated_modules: ["ASSESSMENT_SERVICE", "RULE_ENGINE", "APPLICABILITY_ENGINE", "GAP_ENGINE", "AUDIT_LOG", "PRESENTATION"]
    rationale: "Reproduzierbarkeit nach Exposé verlangt, dass ein Ergebnis stets dem aktuellen Eingabestand entspricht; die Korrektur früherer Eingaben in langen, bedingten Fragebäumen ist eine abgeleitete Design Implication (STATE_OF_THE_ART.md DI-005). Die zustandslose deterministische Auswertung (SR-002) ist die technische Grundlage."
    replaces: []
    replaced_by: []

  - id: "SR-041"
    status: "aktiv"
    group: "REPORTING"
    title:
      de: "Lebenszykluskontext je Anforderung"
      en: "Life-cycle context per requirement"
    statement:
      de: "Das System muss für jede ausgegebene RR die im RR-Katalog hinterlegten Lebenszyklusphasen in Ergebnisdarstellung und Ergebnisbericht in der gewählten Sprache ausweisen."
      en: "The system shall show, for every RR output, the life-cycle phases recorded in the RR catalog in the result view and in the result report in the selected language."
    acceptance_criterion:
      de: "Die ausgewiesenen Phasen entsprechen lifecycle_phases der RR in der fixierten Katalogversion; ihre Bezeichnungen stammen ausschließlich aus dem kontrollierten Vokabular nach CONTROLLED_VOCABULARY.md."
      en: "The phases shown correspond to the lifecycle_phases of the RR in the fixed catalog version; their labels are taken exclusively from the controlled vocabulary in CONTROLLED_VOCABULARY.md."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#2-problemstellung"
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
      - "STATE_OF_THE_ART.md#DI-010"
    allocated_modules: ["REQUIREMENT_SERVICE", "REPORTING", "I18N", "PRESENTATION"]
    rationale: "Das Exposé verlangt ein phasenbezogenes Modell und eine Traceability-Matrix mit Lebenszyklusphase; die Lebenszyklusphasen je RR liegen im Katalog vor, werden aber bisher von keiner SR ausgewiesen (STATE_OF_THE_ART.md DI-010). Keine neue Lebenszyklus-Taxonomie."
    replaces: []
    replaced_by: []

  - id: "SR-042"
    status: "aktiv"
    group: "TRACEABILITY"
    title:
      de: "Nachvollziehbare Herleitung jeder Anwendbarkeitsentscheidung"
      en: "Traceable derivation of every applicability decision"
    statement:
      de: "Das System muss für jede RR in jedem Anwendbarkeitszustand die Herleitung ihrer Anwendbarkeit mit Anwendbarkeits- und Begründungscode, Block, ausgewerteten Prädikaten mit ihrem Wert, entscheidungsrelevanten Eingaben, herangezogenen Entscheidungsergebnissen mit ihren RUL und den Quellenlokatoren der RR ausweisen."
      en: "The system shall show, for every RR in every applicability state, the derivation of its applicability with applicability and reason code, block, evaluated predicates with their value, decision-relevant inputs, the decision results used with their RUL and the source locators of the RR."
    acceptance_criterion:
      de: "Für jede ApplicableRequirement mit APPLICABLE, NOT_APPLICABLE oder APPLICABILITY_UNRESOLVED sind applicability, reason_code, block, evaluated_predicates, relevant_inputs, determined_by, supporting_rule_ids und die SRC-Lokatoren der RR in Ergebnisdarstellung und Bericht auflösbar; die Angaben stammen unverändert aus der vom APPLICABILITY_ENGINE erzeugten Trace-Struktur."
      en: "For every ApplicableRequirement with APPLICABLE, NOT_APPLICABLE or APPLICABILITY_UNRESOLVED, applicability, reason_code, block, evaluated_predicates, relevant_inputs, determined_by, supporting_rule_ids and the SRC locators of the RR can be resolved in the result view and the report; the data are taken unchanged from the trace structure produced by the APPLICABILITY_ENGINE."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
      - "STATE_OF_THE_ART.md#DI-004"
    allocated_modules: ["APPLICABILITY_ENGINE", "REPORTING", "PRESENTATION"]
    rationale: "Nachvollziehbarkeit nach Exposé erfordert die Herleitung nicht nur für nicht anwendbare RR (SR-010), sondern für sämtliche Anwendbarkeitszustände, einschließlich der Applicability-Eingaben, die nicht aus DecisionResults stammen (STATE_OF_THE_ART.md DI-004). Wiederverwendet wird die bestehende Trace-Struktur von ApplicableRequirement; keine eigene Erklärungskomponente."
    replaces: []
    replaced_by: []

  - id: "SR-043"
    status: "aktiv"
    group: "EVIDENCE"
    title:
      de: "Vorgesehene Maßnahme und Nachweisart je Anforderung"
      en: "Planned measure and evidence type per requirement"
    statement:
      de: "Das System muss einer RR vorgesehene Umsetzungsmaßnahmen mit vorgesehener Nachweisart aus einem versionierten Katalog zuordnen, nutzerseitige Nachweisreferenzen einer vorgesehenen Maßnahme zuordnen lassen und diese Zuordnung in Gap-Analyse und Bericht verwenden."
      en: "The system shall assign planned implementation measures with a planned evidence type from a versioned catalog to an RR, allow user evidence references to be assigned to a planned measure, and use this assignment in the gap analysis and the report."
    acceptance_criterion:
      de: "Vorgesehene Maßnahmen werden als Katalogverweis RR_MEASURE mit Bezug auf genau eine RR und mindestens eine vorgesehene Nachweisart geführt; eine EvidenceReference kann über measure_key auf eine vorgesehene Maßnahme verweisen; Gap-Analyse und Bericht lösen die Zuordnung Anforderung → Maßnahme → Nachweis auf; fehlt für eine RR eine vorgesehene Maßnahme, wird dies als offener Punkt ausgewiesen und nicht unterstellt."
      en: "Planned measures are held as catalog reference RR_MEASURE relating to exactly one RR and at least one planned evidence type; an EvidenceReference can refer to a planned measure via measure_key; gap analysis and report resolve the assignment requirement → measure → evidence; if a planned measure is missing for an RR, this is reported as an open item and not assumed."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
      - "STATE_OF_THE_ART.md#DI-008"
    allocated_modules: ["CATALOG_REPOSITORY", "REQUIREMENT_SERVICE", "EVIDENCE_SERVICE", "GAP_ENGINE", "REPORTING"]
    rationale: "Das Exposé verlangt eine Traceability-Matrix, die jede Anforderung mit Quelle, Lebenszyklusphase, Maßnahme und Nachweisdokument verknüpft; bisher ist nur die nutzerseitige Nachweisreferenz modelliert (STATE_OF_THE_ART.md DI-008). Die SR legt ausschließlich die System- und Datenfähigkeit fest; die inhaltliche Befüllung des Maßnahmenkatalogs ist nicht Gegenstand dieser SR."
    replaces: []
    replaced_by: []

change_history:
  - version: "0.1"
    change: "Katalog angelegt mit SR-001 bis SR-039 nach SYSTEM_REQUIREMENTS.md Version 1.0. Gruppen: 7 QUALIFICATION_CLASSIFICATION, 4 APPLICABILITY, 5 GAP_ANALYSIS, 2 EVIDENCE, 4 TRACEABILITY, 3 REPORTING, 3 I18N, 11 NON_FUNCTIONAL. Alle SR aus Abschnitten von EXPOSE_SCOPE.md abgeleitet; keine SR aus einzelnen RR; keine RR oder RUL geändert."
  - version: "0.2"
    change: "Redaktionell: In SR-009 den Statuscode UNDETERMINED an die Bezeichnung APPLICABILITY_UNRESOLVED aus DATA_MODEL.yaml Version 0.2 angeglichen. Keine Bedeutungsänderung; keine ID geändert."
  - version: "0.3"
    change: "SR-040 bis SR-043 aus dem Abgleich des Stands der Technik (STATE_OF_THE_ART.md Abschnitt 8) aufgenommen und damit die vier dort vorbereiteten PROPOSED_SR_GAP geschlossen: SR-040 konsistente Neuberechnung nach Eingabeänderung (DI-005), SR-041 Lebenszykluskontext je Anforderung (DI-010), SR-042 nachvollziehbare Herleitung jeder Anwendbarkeitsentscheidung (DI-004), SR-043 vorgesehene Maßnahme und Nachweisart je Anforderung (DI-008). derived_from verweist zusätzlich zum Exposé auf die Design Implication (STATE_OF_THE_ART.md#DI-NNN); keine SRC-ID für Fachliteratur. SR-001 bis SR-039 unverändert."
  - version: "0.4"
    change: "Redaktionell: Abnahmekriterium von SR-021 nennt statt „alle vier Versionen“ alle Versionen des CatalogVersionSet, das seit DATA_MODEL 0.5 sechs Versionen führt (zusätzlich RR_APPLICABILITY und RR_MEASURE). Anforderung, Zweck (reproduzierbare Bindung einer Bewertung an die verwendeten Katalogversionen) und ID unverändert; keine neue SR."
  - version: "0.5"
    change: "Zuordnung: Architekturmodul ASSESSMENT_REPOSITORY (ADR-0005) in allocated_modules von SR-021 (gespeicherte Versionsbindung), SR-033 (Datenminimierung im Speicher) und SR-038 (Modularchitektur) ergänzt. Keine Änderung an Anforderungstexten, Abnahmekriterien oder IDs."
  - version: "0.6"
    change: "Zuordnung: Architekturmodul APPLICATION_API (ADR-0007) in allocated_modules von SR-034 (Validierung der Anfragen), SR-035 (keine externe Übermittlung, nur localhost), SR-036 (Fehler als stabile Codes ohne Zustandsänderung) und SR-038 (Modularchitektur) ergänzt; PRESENTATION zusätzlich in SR-035 (keine Telemetrie, keine Drittanbieter-Ressourcen), SR-037 (Anzeige der Versionsabweichung) und SR-040 (sichtbare Neuberechnung). Keine Änderung an Anforderungstexten, Abnahmekriterien oder IDs."
