      en: "The system shall read regulatory content and decision rules only from the versioned catalogs and shall not replicate them in program or user-interface code."
    acceptance_criterion:
      de: "Außerhalb der Kataloge und der Tests sind keine RR- oder RUL-Inhalte oder -Verzweigungen im Code hinterlegt; eine neue Katalogversion erfordert keine Codeänderung, solange das Katalogschema gleich bleibt."
      en: "No RR or RUL content or branching is defined in code outside the catalogs and tests; a new catalog version requires no code change as long as the catalog schema is unchanged."
    verification_method: "INSPECTION"
    derived_from:
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
