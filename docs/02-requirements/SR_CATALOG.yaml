version: "0.6"

requirements:
  - id: "SR-001"
    status: "aktiv"
    group: "QUALIFICATION_CLASSIFICATION"
    title:
      de: "Kontrollierte Produkteingaben"
      en: "Controlled product inputs"
    statement:
      de: "Das System muss Produktangaben für die Entscheidungslogik ausschließlich über Eingaben erfassen, deren Schlüssel und zulässige Werte aus dem RUL-Katalog stammen."
      en: "The system shall capture product information for the decision logic only through inputs whose keys and allowed values are taken from the RUL catalog."
    acceptance_criterion:
      de: "Jede entscheidungsrelevante Frage entspricht einem nicht abgeleiteten input_key des RUL-Katalogs; ein Wert außerhalb von allowed_values wird abgewiesen."
      en: "Every decision-relevant question corresponds to a non-derived input_key of the RUL catalog; a value outside allowed_values is rejected."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#3-zielstellung"
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["ASSESSMENT_SERVICE", "PRESENTATION"]
    rationale: "Das Exposé sieht strukturierte Produkteingaben über einen Fragebogen vor; kontrollierte Werte sind Voraussetzung für reproduzierbare Regelauswertung."
    replaces: []
    replaced_by: []

  - id: "SR-002"
    status: "aktiv"
    group: "QUALIFICATION_CLASSIFICATION"
    title:
      de: "Deterministische Regelausführung"
      en: "Deterministic rule execution"
    statement:
      de: "Das System muss die Entscheidungsregeln des RUL-Katalogs so ausführen, dass gleiche Eingaben bei gleicher Katalogversion denselben Regelpfad und dasselbe Ergebnis liefern."
      en: "The system shall execute the decision rules of the RUL catalog such that identical inputs with the same catalog version yield the same rule path and the same result."
    acceptance_criterion:
      de: "Wiederholte Auswertung identischer Eingaben gegen dieselbe Katalogversion erzeugt identische RuleExecution-Folgen und DecisionResults."
      en: "Repeated evaluation of identical inputs against the same catalog version produces identical RuleExecution sequences and DecisionResults."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["RULE_ENGINE"]
    rationale: "Reproduzierbarkeit ist Bewertungskriterium der Zielerreichung; der Demonstrator ist bewusst regelbasiert."
    replaces: []
    replaced_by: []

  - id: "SR-003"
    status: "aktiv"
    group: "QUALIFICATION_CLASSIFICATION"
    title:
      de: "Keine Entscheidung bei fehlender oder ungültiger Eingabe"
      en: "No decision on missing or invalid input"
    statement:
      de: "Das System muss die Auswertung eines Regelpfads an einer Regel ohne Ergebnis anhalten, wenn deren Eingabe fehlt oder ungültig ist."
      en: "The system shall stop evaluating a rule path at a rule without a result if its input is missing or invalid."
    acceptance_criterion:
      de: "Bei fehlender oder ungültiger Eingabe hat das DecisionResult den Status INCOMPLETE und benennt die betroffene Regel; es wird kein Ergebnis angenommen."
      en: "With a missing or invalid input the DecisionResult has status INCOMPLETE and names the affected rule; no result is assumed."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["RULE_ENGINE"]
    rationale: "RUL_METHOD.md Abschnitt 7 schließt automatische Entscheidungen bei unzureichender Evidenz aus; Korrektheit darf nicht durch Raten entstehen."
    replaces: []
    replaced_by: []

  - id: "SR-004"
    status: "aktiv"
    group: "QUALIFICATION_CLASSIFICATION"
    title:
      de: "Review-Ausgänge als offene Prüfpunkte"
      en: "Review outcomes as open review items"
    statement:
      de: "Das System muss Ausgänge des Typs REVIEW als offene Prüfpunkte mit der im RUL-Katalog dokumentierten Ursache ausgeben und nie als Entscheidung oder Klasse darstellen."
      en: "The system shall present outcomes of type REVIEW as open review items with the cause documented in the RUL catalog and never as a decision or class."
    acceptance_criterion:
      de: "Ein Pfad mit Review-Ausgang ergibt den Status REVIEW_REQUIRED ohne mdr_class; die Ursache erscheint in Anzeige und Bericht."
      en: "A path with a review outcome yields status REVIEW_REQUIRED without mdr_class; the cause appears in the display and the report."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["RULE_ENGINE", "REPORTING"]
    rationale: "Review-Ausgänge wie BOUNDARY_REVIEW_REQUIRED und ADDITIONAL_CLASSIFICATION_REVIEW_REQUIRED kennzeichnen Grenzen der modellierten Logik und dürfen keine Scheinsicherheit erzeugen."
    replaces: []
    replaced_by: []

  - id: "SR-005"
    status: "aktiv"
    group: "QUALIFICATION_CLASSIFICATION"
    title:
      de: "MDR-Klassenaggregation nach Katalog"
      en: "MDR class aggregation according to the catalog"
    statement:
      de: "Das System muss die finale MDR-Klasse ausschließlich als strengsten Klassenkandidaten des Regelpfads nach class_order des RUL-Katalogs bestimmen und bei einem mitgeführten Review-Ausgang keine finale Klasse ausgeben."
      en: "The system shall determine the final MDR class only as the strictest class candidate of the rule path according to the class_order of the RUL catalog and shall output no final class if a review outcome was carried along."
    acceptance_criterion:
      de: "Für die Testfälle T07 bis T14 entspricht die ausgegebene Klasse dem Soll; ein Pfad mit mitgeführtem Review-Ausgang ergibt keine Klasse."
      en: "For test cases T07 to T14 the output class matches the expected result; a path with a carried review outcome yields no class."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
      - "EXPOSE_SCOPE.md#5-geplante-evaluation"
    allocated_modules: ["RULE_ENGINE"]
    rationale: "Die Aggregation nach Anhang VIII Abschnitt 3.5 ist in RUL-020 festgelegt; die Engine setzt sie um, ohne eigene Klassifikationslogik hinzuzufügen."
    replaces: []
    replaced_by: []

  - id: "SR-006"
    status: "aktiv"
    group: "QUALIFICATION_CLASSIFICATION"
    title:
      de: "Protokoll des Entscheidungspfads"
      en: "Decision path record"
    statement:
      de: "Das System muss für jeden ausgeführten Regelschritt Regel-ID, Eingabeschlüssel, Eingabewert, gewählten Zweig und Katalogversion speichern."
      en: "The system shall store the rule id, input key, input value, selected branch and catalog version for every executed rule step."
    acceptance_criterion:
      de: "Aus den gespeicherten RuleExecutions lässt sich der vollständige Regelpfad eines DecisionResults lückenlos rekonstruieren."
      en: "The complete rule path of a DecisionResult can be reconstructed without gaps from the stored RuleExecutions."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["RULE_ENGINE"]
    rationale: "Nachvollziehbarkeit der Entscheidung ist Bewertungskriterium der Zielerreichung."
    replaces: []
    replaced_by: []

  - id: "SR-007"
    status: "aktiv"
    group: "QUALIFICATION_CLASSIFICATION"
    title:
      de: "Getrennte AI-Act-Applicability"
      en: "Separate AI Act applicability"
    statement:
      de: "Das System muss die AI-Act-Applicability als eigenen Entscheidungsbereich getrennt von der MDR-Klassifizierung ausweisen und ausschließlich über katalogisierte Entscheidungsregeln bestimmen."
      en: "The system shall present AI Act applicability as a separate decision area distinct from MDR classification and shall determine it only through catalogued decision rules."
    acceptance_criterion:
      de: "Solange der RUL-Katalog keine Regeln für diesen Bereich enthält, hat das DecisionResult des Bereichs AI_ACT_APPLICABILITY den Status NOT_EVALUATED; eine MDR-Klasse wird nie als AI-Act-Einstufung ausgegeben."
      en: "As long as the RUL catalog contains no rules for this area, the DecisionResult of area AI_ACT_APPLICABILITY has status NOT_EVALUATED; an MDR class is never output as an AI Act classification."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#2-problemstellung"
      - "EXPOSE_SCOPE.md#3-zielstellung"
    allocated_modules: ["RULE_ENGINE", "REPORTING"]
    rationale: "Das Exposé verbindet MDR und AI Act; die aktuelle High-Risk-Logik aus SRC-002 ist separat zu prüfen und liegt noch nicht als RUL vor."
    replaces: []
    replaced_by: []

  - id: "SR-008"
    status: "aktiv"
    group: "APPLICABILITY"
    title:
      de: "RR-Aktivierung über katalogisierte Entscheidungsergebnisse"
      en: "RR activation through catalogued decision results"
    statement:
      de: "Das System muss anwendbare RR ausschließlich aus Entscheidungsergebnissen und dokumentierten, versionierten Applicability-Regeln bestimmen."
      en: "The system shall determine applicable RR only from decision results and documented, versioned applicability rules."
    acceptance_criterion:
      de: "Jede ApplicableRequirement verweist über determined_by auf mindestens ein DecisionResult; keine Aktivierungslogik liegt außerhalb der Kataloge und der APPLICABILITY_ENGINE."
      en: "Every ApplicableRequirement refers through determined_by to at least one DecisionResult; no activation logic resides outside the catalogs and the APPLICABILITY_ENGINE."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#3-zielstellung"
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["APPLICABILITY_ENGINE"]
    rationale: "Das Exposé verlangt die Identifikation relevanter Anforderungen anhand der Produkteingaben mit formalisierter Entscheidungslogik."
    replaces: []
    replaced_by: []

  - id: "SR-009"
    status: "aktiv"
    group: "APPLICABILITY"
    title:
      de: "Bedingte RR ohne bestätigte Bedingung"
      en: "Conditional RR without confirmed condition"
    statement:
      de: "Das System muss eine RR, deren Anforderungstext eine Bedingung enthält, als APPLICABILITY_UNRESOLVED ausweisen, solange die Bedingung nicht durch eine katalogisierte Regel bestätigt ist."
      en: "The system shall mark an RR whose requirement text contains a condition as APPLICABILITY_UNRESOLVED as long as the condition is not confirmed by a catalogued rule."
    acceptance_criterion:
      de: "Ohne bestätigende Regel wird eine bedingte RR weder als APPLICABLE noch als NOT_APPLICABLE geführt; Bedingungen werden nicht aus Freitext interpretiert."
      en: "Without a confirming rule a conditional RR is neither APPLICABLE nor NOT_APPLICABLE; conditions are not interpreted from free text."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["APPLICABILITY_ENGINE"]
    rationale: "Der RR-Katalog führt Bedingungen im Anforderungstext und nicht als Schemafeld; eine automatische Auslegung würde die Korrektheit gefährden."
    replaces: []
    replaced_by: []

  - id: "SR-010"
    status: "aktiv"
    group: "APPLICABILITY"
    title:
      de: "Begründete Nicht-Anwendbarkeit"
      en: "Justified non-applicability"
    statement:
      de: "Das System muss nicht anwendbare RR mit Begründung und Verweis auf das auslösende Entscheidungsergebnis behalten statt sie zu entfernen."
      en: "The system shall keep non-applicable RR with a justification and a reference to the triggering decision result instead of removing them."
    acceptance_criterion:
      de: "Jede RR mit applicability NOT_APPLICABLE besitzt eine Begründung und mindestens einen Eintrag in determined_by und ist im Bericht einsehbar."
      en: "Every RR with applicability NOT_APPLICABLE has a justification and at least one entry in determined_by and can be viewed in the report."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["APPLICABILITY_ENGINE", "REPORTING"]
    rationale: "Vollständigkeit und Nachvollziehbarkeit verlangen, dass auch ausgeblendete Anforderungen begründet bleiben."
    replaces: []
    replaced_by: []

  - id: "SR-011"
    status: "aktiv"
    group: "APPLICABILITY"
    title:
      de: "Anzeige regulatorischer Anforderungen mit Quellenverweis"
      en: "Display of regulatory requirements with source references"
    statement:
      de: "Das System muss jede angezeigte RR mit ID, Titel, Anforderungstext in der gewählten Sprache und ihren Quellenlokatoren aus dem RR-Katalog darstellen."
      en: "The system shall display every shown RR with its id, title, requirement text in the selected language and its source locators from the RR catalog."
    acceptance_criterion:
      de: "Angezeigte Texte und Lokatoren stimmen mit dem RR-Katalog der fixierten Version überein."
      en: "Displayed texts and locators match the RR catalog of the pinned version."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#3-zielstellung"
    allocated_modules: ["REQUIREMENT_SERVICE", "PRESENTATION"]
    rationale: "Das Exposé verlangt eine Gap-Analyse mit Quellenverweisen."
    replaces: []
    replaced_by: []

  - id: "SR-012"
    status: "aktiv"
    group: "GAP_ANALYSIS"
    title:
      de: "Erfüllungsstatus aus kontrolliertem Vokabular"
      en: "Fulfilment status from a controlled vocabulary"
    statement:
      de: "Das System muss den Erfüllungsstatus je RR ausschließlich aus dem Vokabular gap_status des Datenmodells führen."
      en: "The system shall record the fulfilment status of each RR only from the gap_status vocabulary of the data model."
    acceptance_criterion:
      de: "Ein Status außerhalb von gap_status wird abgewiesen."
      en: "A status outside gap_status is rejected."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#3-zielstellung"
    allocated_modules: ["GAP_ENGINE"]
    rationale: "Der Abgleich des Erfüllungsstands erfordert eindeutige, vergleichbare Statuswerte."
    replaces: []
    replaced_by: []

  - id: "SR-013"
    status: "aktiv"
    group: "GAP_ANALYSIS"
    title:
      de: "Kein automatischer Erfüllungsstatus"
      en: "No automatic fulfilment status"
    statement:
      de: "Das System muss neue Bewertungen einer anwendbaren RR mit NOT_ASSESSED beginnen und darf FULFILLED, PARTIALLY_FULFILLED oder NOT_FULFILLED nur auf Nutzereingabe setzen."
      en: "The system shall start new assessments of an applicable RR with NOT_ASSESSED and may set FULFILLED, PARTIALLY_FULFILLED or NOT_FULFILLED only on user input."
    acceptance_criterion:
      de: "Ohne Nutzereingabe bleibt jeder Status NOT_ASSESSED; NOT_APPLICABLE wird nur aus der Anwendbarkeit abgeleitet."
      en: "Without user input every status remains NOT_ASSESSED; NOT_APPLICABLE is only derived from applicability."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["GAP_ENGINE"]
    rationale: "Der Demonstrator ersetzt keine Konformitätsbewertung; der Erfüllungsstand ist eine Aussage des Nutzers."
    replaces: []
    replaced_by: []

  - id: "SR-014"
    status: "aktiv"
    group: "GAP_ANALYSIS"
    title:
      de: "Begründungspflicht des Erfüllungsstatus"
      en: "Justification of the fulfilment status"
    statement:
      de: "Das System muss für die Status FULFILLED, PARTIALLY_FULFILLED und NOT_FULFILLED eine Begründung verlangen."
      en: "The system shall require a justification for the statuses FULFILLED, PARTIALLY_FULFILLED and NOT_FULFILLED."
    acceptance_criterion:
      de: "Das Setzen eines dieser Status ohne Begründung wird abgewiesen."
      en: "Setting one of these statuses without a justification is rejected."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["GAP_ENGINE"]
    rationale: "Nachvollziehbarkeit der Ergebnisberichte."
    replaces: []
    replaced_by: []

  - id: "SR-015"
    status: "aktiv"
    group: "GAP_ANALYSIS"
    title:
      de: "Gap-Ermittlung einschließlich Nachweislücken"
      en: "Gap determination including evidence gaps"
    statement:
      de: "Das System muss einen Gap ausweisen, wenn eine anwendbare RR den Status PARTIALLY_FULFILLED oder NOT_FULFILLED hat oder als FULFILLED bzw. PARTIALLY_FULFILLED ohne Nachweisreferenz bewertet ist."
      en: "The system shall report a gap if an applicable RR has status PARTIALLY_FULFILLED or NOT_FULFILLED or is assessed as FULFILLED or PARTIALLY_FULFILLED without an evidence reference."
    acceptance_criterion:
      de: "Für jede Kombination aus Status und vorhandener bzw. fehlender Nachweisreferenz entspricht die Gap-Kennzeichnung der Regel im Datenmodell."
      en: "For every combination of status and present or missing evidence reference the gap flag matches the rule in the data model."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#3-zielstellung"
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["GAP_ENGINE"]
    rationale: "Die Gap-Analyse ist Kernfunktion des Demonstrators; fehlende Nachweise sind als Lücke erkennbar zu machen."
    replaces: []
    replaced_by: []

  - id: "SR-016"
    status: "aktiv"
    group: "GAP_ANALYSIS"
    title:
      de: "Reproduzierbare Gap-Zusammenfassung"
      en: "Reproducible gap summary"
    statement:
      de: "Das System muss die Gap-Zusammenfassung deterministisch aus Anwendbarkeit, Status und Nachweisreferenzen berechnen."
      en: "The system shall compute the gap summary deterministically from applicability, statuses and evidence references."
    acceptance_criterion:
      de: "Identische Bewertungsdaten und Katalogversionen ergeben eine identische Gap-Zusammenfassung."
      en: "Identical assessment data and catalog versions yield an identical gap summary."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["GAP_ENGINE", "REPORTING"]
    rationale: "Reproduzierbarkeit ist Bewertungskriterium der Zielerreichung."
    replaces: []
    replaced_by: []

  - id: "SR-017"
    status: "aktiv"
    group: "EVIDENCE"
    title:
      de: "Nachweisreferenzen je Anforderung"
      en: "Evidence references per requirement"
    statement:
      de: "Das System muss je bewerteter RR null bis mehrere Nachweisreferenzen mit Titel und Dokumentkennung zuordnen können."
      en: "The system shall allow zero to many evidence references with title and document identifier to be linked to each assessed RR."
    acceptance_criterion:
      de: "Eine Nachweisreferenz kann mehreren RR zugeordnet und im Bericht je RR angezeigt werden."
      en: "An evidence reference can be linked to several RR and is shown per RR in the report."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["EVIDENCE_SERVICE", "GAP_ENGINE"]
    rationale: "Das Exposé verlangt die Verknüpfung jeder Anforderung mit einem Nachweisdokument."
    replaces: []
    replaced_by: []

  - id: "SR-018"
    status: "aktiv"
    group: "EVIDENCE"
    title:
      de: "Keine erzeugten Nachweise"
      en: "No generated evidence"
    statement:
      de: "Das System darf Nachweisreferenzen ausschließlich aus Nutzereingaben anlegen und keine Nachweise erzeugen, ergänzen oder unterstellen."
      en: "The system shall create evidence references only from user input and shall not generate, complete or presume evidence."
    acceptance_criterion:
      de: "Es existiert kein Codepfad, der eine EvidenceReference ohne Nutzereingabe anlegt."
      en: "No code path exists that creates an EvidenceReference without user input."
    verification_method: "INSPECTION"
    derived_from:
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["EVIDENCE_SERVICE"]
    rationale: "Der Demonstrator ersetzt keine Zertifizierung oder Konformitätsbewertung; erfundene Nachweise würden die Gap-Analyse verfälschen."
    replaces: []
    replaced_by: []

  - id: "SR-019"
    status: "aktiv"
    group: "TRACEABILITY"
    title:
      de: "Rückverfolgbarkeit von Entscheidungsergebnissen"
      en: "Traceability of decision results"
    statement:
      de: "Das System muss für jedes Entscheidungsergebnis die angewendeten RUL-IDs mit ihren Primary-Legal-Ankern und Guidance-Ankern ausweisen."
      en: "The system shall show, for every decision result, the applied RUL ids with their primary legal anchors and guidance anchors."
    acceptance_criterion:
      de: "Jedes DecisionResult im Bericht nennt die RUL-IDs des Pfads und deren SRC-Lokatoren, getrennt nach Primärrecht und Guidance."
      en: "Every DecisionResult in the report names the RUL ids of the path and their SRC locators, separated into primary law and guidance."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["RULE_ENGINE", "REPORTING"]
    rationale: "Jede Ausgabe muss bis zur regulatorischen Quelle rückverfolgbar sein; Primärrecht und Guidance bleiben getrennt."
    replaces: []
    replaced_by: []

  - id: "SR-020"
    status: "aktiv"
    group: "TRACEABILITY"
    title:
      de: "Rückverfolgbarkeit von Anforderungsergebnissen"
      en: "Traceability of requirement results"
    statement:
      de: "Das System muss für jede RR im Ergebnis ihre Quellenlokatoren und die Entscheidungsergebnisse ausweisen, aus denen ihre Anwendbarkeit folgt."
      en: "The system shall show, for every RR in the result, its source locators and the decision results from which its applicability follows."
    acceptance_criterion:
      de: "Für jede ApplicableRequirement sind RR-ID, SRC-Lokatoren und determined_by im Bericht auflösbar."
      en: "For every ApplicableRequirement the RR id, SRC locators and determined_by can be resolved in the report."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["APPLICABILITY_ENGINE", "REPORTING"]
    rationale: "Die Traceability-Matrix verknüpft jede Anforderung mit Quelle und Nachweis."
    replaces: []
    replaced_by: []

  - id: "SR-021"
    status: "aktiv"
    group: "TRACEABILITY"
    title:
      de: "Fixierte Katalogversionen je Bewertung"
      en: "Pinned catalog versions per assessment"
    statement:
      de: "Das System muss bei Anlage einer Bewertung die Versionen von Quellenregister, RR-Katalog, RUL-Katalog und Datenmodell fixieren und in jedem Bericht angeben."
      en: "The system shall pin the versions of the source register, RR catalog, RUL catalog and data model when an assessment is created and state them in every report."
    acceptance_criterion:
      de: "Assessment und ReportSnapshot enthalten ein vollständiges CatalogVersionSet; der Bericht nennt alle Versionen des CatalogVersionSet."
      en: "Assessment and ReportSnapshot contain a complete CatalogVersionSet; the report states all versions of the CatalogVersionSet."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["ASSESSMENT_SERVICE", "CATALOG_REPOSITORY", "ASSESSMENT_REPOSITORY"]
    rationale: "Identische Eingaben führen nur bei identischen Katalogversionen zu identischen Ergebnissen."
    replaces: []
    replaced_by: []

  - id: "SR-022"
    status: "aktiv"
    group: "TRACEABILITY"
    title:
      de: "Verweisintegrität der Kataloge"
      en: "Reference integrity of the catalogs"
    statement:
      de: "Das System muss vor der Nutzung der Kataloge prüfen, dass alle Verweise zwischen Quellen, RR und RUL auf vergebene IDs zeigen."
      en: "The system shall verify before using the catalogs that all references between sources, RR and RUL point to assigned ids."
    acceptance_criterion:
      de: "Ein Katalog mit Verweis auf eine nicht vergebene SRC-, RR- oder RUL-ID wird nicht geladen."
      en: "A catalog with a reference to an unassigned SRC, RR or RUL id is not loaded."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["CATALOG_REPOSITORY"]
    rationale: "Eine Traceability-Matrix ist nur mit konsistenten Verweisen belastbar."
