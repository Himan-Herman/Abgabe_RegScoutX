  - id: "SR-023"
    status: "aktiv"
    group: "REPORTING"
    title:
      de: "Inhalt des Ergebnisberichts"
      en: "Content of the result report"
    statement:
      de: "Das System muss einen Ergebnisbericht mit Qualifikation, MDR/IVDR-Abgrenzung, Klassifizierung, AI-Act-Applicability, anwendbaren Anforderungen, Gap-Zusammenfassung, Anforderungsdetails, Nachweisen, offenen Punkten und verwendeten Katalogversionen erzeugen."
      en: "The system shall generate a result report containing qualification, MDR/IVDR boundary, classification, AI Act applicability, applicable requirements, gap summary, requirement details, evidence, open points and the catalog versions used."
    acceptance_criterion:
      de: "Ein erzeugter Bericht enthält alle genannten Abschnitte; offene Punkte umfassen Review-Ausgänge, unvollständige Eingaben, ungeklärte Anwendbarkeit und nicht bewertete Anforderungen."
      en: "A generated report contains all listed sections; open points include review outcomes, incomplete inputs, undetermined applicability and unassessed requirements."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#4-erwartetes-ergebnis"
    allocated_modules: ["REPORTING"]
    rationale: "Das Exposé sieht einen automatisch erzeugten Ergebnisbericht mit Quellenverweisen vor."
    replaces: []
    replaced_by: []

  - id: "SR-024"
