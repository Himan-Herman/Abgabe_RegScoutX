      en: "The system shall generate every report from an immutable ReportSnapshot."
    acceptance_criterion:
      de: "Erneute Erzeugung aus demselben Snapshot liefert denselben Inhalt und denselben content_hash; spätere Änderungen der Bewertung verändern den Snapshot nicht."
      en: "Regenerating from the same snapshot yields the same content and the same content_hash; later changes to the assessment do not alter the snapshot."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#bewertungskriterien-der-zielerreichung"
    allocated_modules: ["REPORTING"]
    rationale: "Reproduzierbarkeit und Nachvollziehbarkeit der Ergebnisberichte."
