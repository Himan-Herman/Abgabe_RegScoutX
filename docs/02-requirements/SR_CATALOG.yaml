      en: "The system shall refuse evaluation if a catalog cannot be loaded in conformity with its schema."
    acceptance_criterion:
      de: "Ein strukturell ungültiger Katalog führt zu einer kontrollierten Fehlermeldung ohne Teilauswertung."
      en: "A structurally invalid catalog leads to a controlled error message without partial evaluation."
