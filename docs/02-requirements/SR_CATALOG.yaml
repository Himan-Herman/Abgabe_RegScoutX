    replaces: []
    replaced_by: []

  - id: "SR-036"
    status: "aktiv"
    group: "NON_FUNCTIONAL"
    title:
      de: "Fehlerisolation"
      en: "Error isolation"
    statement:
      de: "Das System muss Fehler eines Moduls kontrolliert melden, ohne bereits ermittelte Entscheidungen, Anwendbarkeiten oder Status zu verändern."
      en: "The system shall report an error of a module in a controlled way without altering already determined decisions, applicabilities or statuses."
    acceptance_criterion:
      de: "Ein erzwungener Fehler in REPORTING lässt DecisionResults und GapAssessments unverändert und erzeugt eine verständliche Fehlermeldung ohne stillen Ersatzwert."
      en: "A forced error in REPORTING leaves DecisionResults and GapAssessments unchanged and produces an understandable error message without a silent fallback value."
    verification_method: "TEST"
    derived_from:
      - "EXPOSE_SCOPE.md#status-und-zweck-dieses-dokuments"
    allocated_modules: ["ASSESSMENT_SERVICE", "REPORTING", "APPLICATION_API"]
    rationale: "Fehlerbehandlung als technische Erweiterung; stille Ersatzwerte würden die Korrektheit verdecken."
    replaces: []
    replaced_by: []

  - id: "SR-037"
    status: "aktiv"
    group: "NON_FUNCTIONAL"
    title:
      de: "Erkennung von Versionsabweichungen"
      en: "Detection of version mismatches"
