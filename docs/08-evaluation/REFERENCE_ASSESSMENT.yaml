    rul_catalog: docs/03-regulatory/RUL_CATALOG.yaml
    vocabulary: docs/03-regulatory/CONTROLLED_VOCABULARY.md
  not_derived_from: keinem Bewertungs-, Bericht-, API- oder Laufzeitartefakt des Demonstrators
  consistency_checks:
  - 16 Blockzustände unabhängig nachgerechnet = adjudizierte Blockzustände
  - 22 entscheidungskritische RR (Status und Begründung) = adjudizierte Werte
  - scope-inaktiv 70 und scope-ungeklärt 0 = adjudizierte Summen
catalog_versions:
  rr_catalog: '0.26'
  rul_catalog: '0.2'
  rr_applicability: '0.4'
  rr_measure: '0.1'
interpretations:
  RI-1: Lokale Bedingungen sind eine Konjunktion (dreiwertig); eine nicht erfüllte modellierte Bedingung ergibt
    NOT_APPLICABLE auch dann, wenn zusätzlich eine nicht modellierte Bedingung dokumentiert ist.
  RI-2: Ist keine modellierte Bedingung falsch, geht eine dokumentierte nicht modellierte Bedingung als Begründung
    LOCAL_CONDITION_NOT_MODELLED vor einer fehlenden Eingabe (LOCAL_CONDITION_UNRESOLVED); der Status ist in beiden
    Fällen APPLICABILITY_UNRESOLVED.
  RI-3: 'Bei anwendbaren RR: evidence_state EVIDENCE_REFERENCED genau bei mindestens einer zugeordneten Nachweisreferenz,
    sonst NO_EVIDENCE_REFERENCED; bei nicht anwendbaren bzw. ungeklärten RR NOT_CONSIDERED (DATA_MODEL RequirementResult).'
  RI-4: Fehlende Profileingaben (im Referenzfall nicht angegeben) ergeben UNKNOWN (fail-closed).
  RI-5: Bedingte RR ohne lokale und ohne nicht modellierte Bedingung sind bei aktivem Block APPLICABLE mit SCOPE_ACTIVE
    (wie die adjudizierten RR-174, RR-360, RR-376).
