reference_version: '1.0'
status: frozen
provenance:
  kind: manual_and_rule_derived_reference
  author: Projektbearbeiter (Masterarbeit RegScoutX)
  base_case: TC-036
  adjudicated_basis: TC-036 golden_case (Profil, Regelpfade, Entscheidungen, 16 Blockzustände, 22 entscheidungskritische
    RR, Scope-Summen) – manuelle Herleitung EV-003
  derivation_tool: tools/derive_case_reference.py (keine Abhängigkeit von regscoutx/)
  inputs:
    tc_catalog: docs/07-testing/TC_CATALOG.yaml
    rr_applicability: docs/03-regulatory/RR_APPLICABILITY.yaml
    rr_catalog: docs/03-regulatory/RR_CATALOG.yaml
