change_history:
- version: '0.1'
  change: 'Erstfassung: 377 RR zugeordnet (149 regulär, 167 bedingt, 61 ohne dokumentierte Einordnung) auf Grundlage einer Inventur der Conditionality aller Evidenzdateien; 12 Blöcke, 14 Applicability-Eingaben. AI-Act-Anforderungen bleiben bis zur Adjudikation der AI-Act-Applicability ungeklärt.'
- version: '0.2'
  change: 'Block AI_ACT_HIGH_RISK an das Ergebnis des kombinierten Art.-6-Routings (RUL-043) gebunden: AI_ACT_HIGH_RISK aktiviert den Block; AI_ACT_NOT_APPLICABLE und AI_ACT_APPLICABLE_NOT_HIGH_RISK deaktivieren ihn; AI_ACT_NOT_YET_APPLICABLE und AI_ACT_HIGH_RISK_LEGACY_TRANSITION deaktivieren ihn derzeit mit eigenem Begründungscode; Prüfung erforderlich bzw. nicht bewertet lässt ihn ungeklärt. Lokale AI-Act-Bedingungen und nicht dokumentierte Einordnungen bleiben fail-closed. Bindung an RUL_CATALOG 0.2.'
- version: '0.3'
  change: 'RR-378 bis RR-959 (Normen SRC-005 bis SRC-008) zugeordnet; Bindung an RR_CATALOG 0.25. Vier Normblöcke mit dem bestehenden kanonischen Prädikat MDR_MDSW als Scope; 16 Applicability-Eingaben und 20 Prädikate für die adjudizierten Normbedingungen (ISO-13485-Ausschlussregel nach Abschnitt 1, faktische ISO-13485-Bedingungen, IEC-62304-Sicherheitsklasse, -Route, SOUP, Änderung und Problembericht, IEC-62366-1-Route, Usability-Test, Training und Sicherheitsinformation). PROFILE_INPUT-Prädikate können optional unknown_values führen, die fail-closed UNKNOWN ergeben. Nicht operationalisierbare Bedingungen stehen in local_not_modelled. Einordnung: 120 regulär, 462 bedingt, davon 166 mit nicht (vollständig) modellierter Bedingung. RR-001 bis RR-377 unverändert.'
- version: '0.4'
  change: 'Bindung an RR_CATALOG 0.26 nach redaktioneller Präzisierung von 15 Norm-RR (Rückverweise durch explizite Antezedenten ersetzt); Zuordnungen unverändert. Korrektur aus dem abschließenden Block-3-Audit: Die adjudizierte Routing-Regel SRC-007#Abschnitt 4.3/g (bis zur Klassifizierung gelten Klasse-C-Anforderungen) war nicht abgebildet; noch nicht klassifizierte Software ergab bisher UNKNOWN. Die Prädikate IEC62304_CLASS_ABC, IEC62304_CLASS_BC und IEC62304_CLASS_C behandeln NOT_YET_CLASSIFIED jetzt wie Klasse C. Keine Änderung an Blöcken, Eingaben, RR-Zuordnungen oder Counts.'
