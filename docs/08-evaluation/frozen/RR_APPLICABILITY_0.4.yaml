version: '0.4'
rr_catalog_version: '0.26'
rul_catalog_version: '0.2'
description: 'Technische, maschinenlesbare Zuordnung der bereits adjudizierten Anwendbarkeit der RR aus RR_CATALOG.yaml. Kein regulatorischer Anforderungskatalog und keine neue Adjudikation: Blöcke bilden den übergeordneten Bereich (Outer Applicability), local die als faktische Eingabe modellierten lokalen Bedingungen, local_not_modelled die dokumentierten, aber nicht modellierten Bedingungen. Grundlage sind ausschließlich die Evidenzdateien unter docs/03-regulatory und die Entscheidungslogik aus RUL_CATALOG.yaml; Anforderungstexte werden nicht ausgewertet.'
profile_inputs:
  lay_use:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Ist das Produkt für die Anwendung durch Laien vorgesehen?
      en: Is the device intended for use by lay persons?
    source_of_condition: 'RR_EXTRACTION_MDR_ANNEXI_22_1_22_3.md Abschnitt 8 (Outer Conditional: vorgesehene Laienanwendung)'
  eifu_provision:
    input_type: enum
    allowed_values:
    - NO_EIFU
    - EIFU_INSTEAD_OF_PAPER
    - EIFU_IN_ADDITION_TO_FULL_PAPER
    value_labels:
      NO_EIFU:
        de: Keine elektronische Gebrauchsanweisung
        en: No electronic instructions for use
      EIFU_INSTEAD_OF_PAPER:
        de: Elektronische Gebrauchsanweisung anstelle der Papierfassung (einschlägiger Pfad nach Art. 3 der Durchführungsverordnung (EU) 2021/2226)
        en: Electronic instructions for use instead of the paper version (relevant path under Article 3 of Implementing Regulation (EU) 2021/2226)
      EIFU_IN_ADDITION_TO_FULL_PAPER:
        de: Elektronische Gebrauchsanweisung zusätzlich zu einer vollständigen Papierfassung
        en: Electronic instructions for use in addition to a complete paper version
    question:
      de: Wie stellt der Hersteller die Gebrauchsanweisung elektronisch bereit?
      en: How does the manufacturer provide the instructions for use electronically?
    source_of_condition: RR_EXTRACTION_SRC_009_ART3_7_9.md Abschnitt 12.2 und Legende REP/ADD
  investigational_device:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Handelt es sich um ein Prüfprodukt?
      en: Is the device an investigational device?
    source_of_condition: 'RR_EXTRACTION_MDR_ART10.md (Trigger: Produkt ist kein Prüfprodukt)'
  custom_made_device:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Handelt es sich um eine Sonderanfertigung?
      en: Is the device a custom-made device?
    source_of_condition: RR_EXTRACTION_MDR_PMS_ART85_86.md Abschnitt 7 und RR_EXTRACTION_MDR_PMS_ART83_84_ANNEXIII_1.md (Sonderanfertigung)
  implantable_device:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Handelt es sich um ein implantierbares Produkt?
      en: Is the device an implantable device?
    source_of_condition: RR_EXTRACTION_MDR_PMS_ART85_86.md (Klasse III oder implantierbares Art.-86-Produkt) und RR_EXTRACTION_SRC_009_ART3_7_9.md (Implantat)
  manufacturer_has_website:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Verfügt der Hersteller über eine Website?
      en: Does the manufacturer have a website?
    source_of_condition: 'RR_EXTRACTION_MDR_ANNEXI_23_1.md (Trigger: Hersteller verfügt über eine Website)'
  built_in_display:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Verfügt das Produkt über ein eingebautes visuelles Anzeigesystem?
      en: Does the device have a built-in visual display system?
    source_of_condition: 'RR_EXTRACTION_SRC_009_ART3_7_9.md (Inner Conditional: eingebautes Anzeigesystem)'
  eifu_on_storage_medium:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Wird die elektronische Gebrauchsanweisung auf einem Speichermedium bereitgestellt?
      en: Are the electronic instructions for use provided on a storage medium?
    source_of_condition: 'RR_EXTRACTION_SRC_009_ART3_7_9.md (Inner Conditional: Speichermedium)'
  specific_expiry_date:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Hat das Produkt ein bestimmtes Verfallsdatum?
      en: Does the device have a specific expiry date?
    source_of_condition: 'RR_EXTRACTION_SRC_009_ART3_7_9.md (Inner Conditional: bestimmtes Verfallsdatum)'
  symbol_or_colour_used:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Werden Symbole oder Identifizierungsfarben verwendet?
      en: Are symbols or identification colours used?
    source_of_condition: 'RR_EXTRACTION_MDR_ANNEXI_23_1.md (Trigger: Symbol oder Identifizierungsfarbe wird verwendet)'
  harmonised_standard_or_cs_for_symbols:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Existiert für den Bereich der verwendeten Symbole oder Identifizierungsfarben eine einschlägige harmonisierte Norm oder Gemeinsame Spezifikation?
      en: Does a relevant harmonised standard or common specification exist for the area of the symbols or identification colours used?
    source_of_condition: 'RR_EXTRACTION_MDR_ANNEXI_23_1.md (Trigger: einschlägige harmonisierte Norm oder Gemeinsame Spezifikation)'
  residual_risk_present:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Bestehen Restrisiken?
      en: Are there residual risks?
    source_of_condition: 'RR_EXTRACTION_MDR_ANNEXI_23_4.md M23_4-G1 (Trigger: Restrisiko vorhanden)'
  calibration_required:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Ist für das Produkt eine Kalibrierung erforderlich?
      en: Does the device require calibration?
    source_of_condition: 'RR_EXTRACTION_MDR_ANNEXI_23_4.md M23_4-K4 (Trigger: Kalibrierung erforderlich)'
  result_interpretation_by_user:
    input_type: boolean
    allowed_values:
    - true
    - false
    value_labels: null
    question:
      de: Interpretiert der vorgesehene Anwender Ergebnisse des Produkts?
      en: Does the intended user interpret results of the device?
    source_of_condition: 'RR_EXTRACTION_MDR_ANNEXI_22_1_22_3.md M22_2-D (Inner Trigger: Interpretation von Ergebnissen ist im konkreten Produktkontext einschlägig)'
  iso13485_clause1_exclusion_claimed:
    input_type: boolean
    allowed_values: &id001
    - true
    - false
    value_labels: null
    question:
      de: Nimmt die Organisation nach ISO 13485 Abschnitt 1 begründete Ausschlüsse von Anforderungen der Abschnitte 6 bis 8 in Anspruch?
      en: Does the organization claim justified exclusions of requirements in Clauses 6 to 8 under ISO 13485 Clause 1?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.2
  qms_software_used:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Setzt die Organisation Computersoftware im Qualitätsmanagementsystem ein?
      en: Does the organization use computer software in the quality management system?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.3
  outsourced_processes:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Gliedert die Organisation Prozesse aus (Outsourcing)?
      en: Does the organization outsource processes?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.3
  purchasing_performed:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Beschafft die Organisation Produkte bzw. Leistungen (Beschaffung nach ISO 13485 Abschnitt 7.4)?
      en: Does the organization purchase products or services (purchasing under ISO 13485 Clause 7.4)?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.3
  production_service_software_used:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Setzt die Organisation Computersoftware in der Produktion bzw. Dienstleistungserbringung ein (ISO 13485 Abschnitt 7.5.6)?
      en: Does the organization use computer software in production or service provision (ISO 13485 Clause 7.5.6)?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.3
  monitoring_measurement_software_used:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Setzt die Organisation Computersoftware zur Überwachung und Messung ein (ISO 13485 Abschnitt 7.6)?
      en: Does the organization use computer software for monitoring and measurement (ISO 13485 Clause 7.6)?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.3
  customer_property_provided:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Wird der Organisation Kundeneigentum bereitgestellt?
      en: Is customer property provided to the organization?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.3
  software_safety_class:
    input_type: enum
    allowed_values:
    - A
    - B
    - C
    - NOT_YET_CLASSIFIED
    value_labels:
      A:
        de: Klasse A
        en: Class A
      B:
        de: Klasse B
        en: Class B
      C:
        de: Klasse C
        en: Class C
      NOT_YET_CLASSIFIED:
        de: noch nicht klassifiziert (bis zur Klassifizierung gelten Klasse-C-Anforderungen)
        en: not yet classified (class C requirements apply until classification)
    question:
      de: Welche Software-Sicherheitsklasse nach IEC 62304 ist dem Softwaresystem zugeordnet?
      en: Which IEC 62304 software safety class is assigned to the software system?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.5
  iec62304_route:
    input_type: enum
    allowed_values:
    - REGULAR_LIFECYCLE
    - LEGACY_SOFTWARE
    value_labels:
      REGULAR_LIFECYCLE:
        de: reguläre Lebenszyklusprozesse (Abschnitte 5 bis 9)
        en: regular life-cycle processes (Clauses 5 to 9)
      LEGACY_SOFTWARE:
        de: ältere Software (Legacy-Route nach Abschnitt 4.4)
        en: legacy software (route under Clause 4.4)
    question:
      de: Nach welcher Route wird die Software nach IEC 62304 behandelt?
      en: Which IEC 62304 route applies to the software?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.5
  soup_used:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Enthält die Software SOUP-Komponenten?
      en: Does the software contain SOUP items?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.5
  software_change:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Werden Änderungen an der Software vorgenommen?
      en: Are changes made to the software?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.5
  software_problem_reported:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Liegen Problemberichte vor bzw. wurde ein Softwareproblem identifiziert?
      en: Are there problem reports or has a software problem been identified?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.5
  iec62366_ui_route:
    input_type: enum
    allowed_values:
    - REGULAR_ROUTE
    - UOUP_UNCHANGED
    - UOUP_WITH_MODIFIED_PARTS
    value_labels:
      REGULAR_ROUTE:
        de: reguläre Route nach Abschnitt 5.1 bis 5.9
        en: regular route under Clauses 5.1 to 5.9
      UOUP_UNCHANGED:
        de: UOUP nach Anhang C ohne geänderte Teile
        en: UOUP under Annex C without modified parts
      UOUP_WITH_MODIFIED_PARTS:
        de: UOUP nach Anhang C mit geänderten Teilen (geänderte Teile nach Abschnitt 5.1 bis 5.9)
        en: UOUP under Annex C with modified parts (modified parts under Clauses 5.1 to 5.9)
    question:
      de: Nach welcher Route wird die Benutzerschnittstelle nach IEC 62366-1 behandelt?
      en: Which IEC 62366-1 route applies to the user interface?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.6
  usability_test_planned:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Ist für die Evaluation der Benutzerschnittstelle ein Usability-Test vorgesehen?
      en: Is a usability test planned for the user-interface evaluation?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.6
  training_required_for_safe_use:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Ist ein Training für den sicheren Gebrauch erforderlich?
      en: Is training required for safe use?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.6
  safety_information_as_risk_control:
    input_type: boolean
    allowed_values: *id001
    value_labels: null
    question:
      de: Wird Sicherheitsinformation als Risikobeherrschungsmaßnahme eingesetzt?
      en: Is safety information used as a risk-control measure?
    source_of_condition: RR_EXTRACTION_STANDARDS_SRC_005_008.md Abschnitt 8.6
predicates:
  AI_ACT_HIGH_RISK_SYSTEM:
    kind: DECISION_OUTCOME
    description:
      de: Das betrachtete System ist nach dem kombinierten Art.-6-Routing ein wirksames Hochrisiko-KI-System.
      en: The system under consideration is an effective high-risk AI system according to the combined Article 6 routing.
    source_of_condition: DECISION_LOGIC_SRC_002_AI_ACT_APPLICABILITY.md Abschnitt 9
    true_if:
    - area: AI_ACT_APPLICABILITY
      outcome: AI_ACT_HIGH_RISK
    false_if:
    - area: AI_ACT_APPLICABILITY
      outcome: AI_ACT_NOT_APPLICABLE
    - area: AI_ACT_APPLICABILITY
      outcome: AI_ACT_APPLICABLE_NOT_HIGH_RISK
    - area: AI_ACT_APPLICABILITY
      outcome: AI_ACT_NOT_YET_APPLICABLE
      reason_code: SCOPE_NOT_YET_APPLICABLE
    - area: AI_ACT_APPLICABILITY
      outcome: AI_ACT_HIGH_RISK_LEGACY_TRANSITION
      reason_code: SCOPE_LEGACY_TRANSITION
  SRC009_ART3_1_PROFESSIONAL_PATH:
    kind: NOT_MODELLED
    description:
      de: Professioneller Nutzerpfad nach Art. 3 Abs. 1 der Durchführungsverordnung (EU) 2021/2226 mit vernünftigerweise vorhersehbarer Laiennutzung.
      en: Professional user path under Article 3(1) of Implementing Regulation (EU) 2021/2226 with reasonably foreseeable use by lay persons.
    source_of_condition: RR_EXTRACTION_SRC_009_ART3_7_9.md Abschnitt 12.2 (S9-3-A)
    area: null
    reason:
      de: Die Pfadbedingung umfasst die Wertung „vernünftigerweise vorhersehbar“ und ist nicht als faktische Eingabe adjudiziert.
      en: The path condition includes the judgement 'reasonably foreseeable' and is not adjudicated as a factual input.
    missing_primary_law: []
  MDR_MDSW:
    kind: DECISION_OUTCOME
    description:
      de: Die Software ist MDSW im Anwendungsbereich der MDR.
      en: The software is MDSW within the scope of the MDR.
    source_of_condition: DECISION_LOGIC_SRC_004_MDSW_QUALIFICATION_CLASSIFICATION.md Abschnitt 11
    true_if:
    - area: BOUNDARY
      outcome: MDR_MDSW
    false_if:
    - area: QUALIFICATION
      outcome: NOT_MDSW
    - area: BOUNDARY
      outcome: OUT_OF_SCOPE_IVDR
  MDR_CLASS_I:
    kind: MDR_CLASS
    description:
      de: MDR-Klasse I
      en: MDR class I
    source_of_condition: RR_EXTRACTION_MDR_PMS_ART85_86.md Abschnitt 7 und Kandidaten M85/M86
    area: CLASSIFICATION
    classes:
    - I
